                        </div>
                        <div style={{ marginBottom: 14 }}>
                            <L>Cliente</L>
                            <select className="input-field" value={selId} onChange={e => pick(e.target.value)}>
                                <option value="">Selecione um cliente</option>
                                {store.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                        {selId && (<>
                            <div style={{ display: 'flex', gap: 3, marginBottom: 16, background: 'rgba(255,255,255,.04)', borderRadius: 8, padding: 3 }}>
                                {[['modelo', 'Modelo & Estilo'], ['refs', 'Referências'], ['pessoas', 'Pessoas']].map(([k, label]) => (
                                    <button key={k} onClick={() => setTab(k)} style={{ flex: 1, padding: '7px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: tab === k ? 'rgba(160,96,255,.22)' : 'transparent', color: tab === k ? 'rgba(200,155,255,.95)' : 'rgba(255,255,255,.4)', transition: 'all .15s' }}>{label}</button>
                                ))}
                            </div>

                            {tab === 'modelo' ? (<>
                                <div style={{ marginBottom: 14 }}>
                                    <L>Template do Prompt</L>
                                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,.32)', marginBottom: 6, background: 'rgba(255,204,0,.05)', border: '1px solid rgba(255,204,0,.14)', borderRadius: 6, padding: '6px 10px', lineHeight: 1.7 }}>
                                        Use <strong style={{ color: '#ffcc00' }}>Titulo:</strong> e <strong style={{ color: '#ffcc00' }}>Conteúdo:</strong> como marcadores dinâmicos no template.
                                    </div>
                                    <textarea className="input-field" rows={7} value={tmpl} onChange={e => setTmpl(e.target.value)}
                                        placeholder={"Crie uma imagem para post de Instagram.\n\nTema: Titulo:\n\nConteúdo: Conteúdo:\n\nManter identidade visual da marca."}
                                        style={{ resize: 'vertical', fontFamily: 'monospace', fontSize: 12, lineHeight: 1.6 }} />
                                </div>
                                <div style={{ marginBottom: 14 }}>
                                    <L>Estilo Visual</L>
                                    <input className="input-field" value={visualStyle} onChange={e => setVisualStyle(e.target.value)} placeholder="Ex: Minimalista, fundo escuro, tipografia moderna, clean" />
                                </div>
                                <div style={{ marginBottom: 14 }}>
                                    <L>Fontes do Cliente</L>
                                    <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
                                        <input className="input-field" value={newFont} onChange={e => setNewFont(e.target.value)} onKeyDown={e => e.key === 'Enter' && addFont()} placeholder="Ex: Poppins" style={{ flex: 1 }} />
                                        <button className="btn-primary" onClick={addFont} style={{ padding: '6px 14px', flexShrink: 0 }}>Adicionar</button>
                                    </div>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                                        {fonts.map(f => (
                                            <div key={f} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '4px 10px 4px 12px', borderRadius: 20, background: 'rgba(160,96,255,.13)', border: '1px solid rgba(160,96,255,.28)', fontSize: 12 }}>
                                                <span style={{ color: 'rgba(200,155,255,.88)' }}>{f}</span>
                                                <button onClick={() => setFonts(p => p.filter(x => x !== f))} style={{ background: 'none', border: 'none', color: 'rgba(255,100,100,.6)', cursor: 'pointer', fontSize: 15, padding: '0 2px', lineHeight: 1 }}>×</button>
                                            </div>
                                        ))}
                                        {fonts.length === 0 && <span style={{ fontSize: 12, color: 'rgba(255,255,255,.22)' }}>Nenhuma fonte adicionada</span>}
                                    </div>
                                </div>
                                <div style={{ marginBottom: 6 }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                        <L>Cores do Cliente</L>
                                        <button className="btn-secondary" onClick={addColor} style={{ fontSize: 11, padding: '3px 10px' }}><Ic n="plus" s={11} />Adicionar</button>
                                    </div>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
                                        {colors.map((c, i) => (
                                            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                                <input type="color" value={c} onChange={e => updateColor(i, e.target.value)} style={{ width: 34, height: 34, borderRadius: 6, border: '1px solid rgba(255,255,255,.13)', cursor: 'pointer', padding: 2 }} />
                                                <span style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', fontFamily: 'monospace' }}>{c.toUpperCase()}</span>
                                                <button onClick={() => setColors(p => p.filter((_, idx) => idx !== i))} style={{ background: 'none', border: 'none', color: 'rgba(255,100,100,.5)', cursor: 'pointer', fontSize: 15, padding: '0 2px', lineHeight: 1 }}>×</button>
                                            </div>
                                        ))}
                                        {colors.length === 0 && <span style={{ fontSize: 12, color: 'rgba(255,255,255,.22)' }}>Nenhuma cor adicionada</span>}
                                    </div>
                                </div>
                            </>) : tab === 'refs' ? (
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                                        <div style={{ fontSize: 12, color: 'rgba(255,255,255,.45)' }}>{refImages.length} referência(s)</div>
                                        <label style={{ display: 'inline-flex', alignItems: 'center', gap: 5, cursor: 'pointer', fontSize: 11, padding: '5px 12px', borderRadius: 6, border: '1px solid rgba(160,96,255,.35)', color: 'rgba(190,140,255,.85)', background: 'rgba(160,96,255,.08)' }}>
                                            <Ic n="plus" s={11} />Adicionar Imagens
                                            <input type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={e => Array.from(e.target.files).forEach(addRefImage)} />
                                        </label>
                                    </div>
                                    {refImages.length === 0 ? (
                                        <div style={{ padding: '28px 20px', textAlign: 'center', border: '1px dashed rgba(255,255,255,.1)', borderRadius: 10, color: 'rgba(255,255,255,.22)', fontSize: 13, lineHeight: 1.8 }}>
                                            Nenhuma referência cadastrada.<br />Adicione imagens que representam o estilo do cliente.
                                        </div>
                                    ) : (
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(110px, 1fr))', gap: 10 }}>
                                            {refImages.map(img => (
                                                <div key={img.id} style={{ position: 'relative', borderRadius: 8, overflow: 'hidden', border: '1px solid rgba(255,255,255,.1)' }}>
                                                    <img src={img.data} alt={img.name} style={{ width: '100%', aspectRatio: '1', objectFit: 'cover', display: 'block' }} />
                                                    <button onClick={() => deleteClientImage(img.id)} style={{ position: 'absolute', top: 4, right: 4, background: 'rgba(255,0,64,.8)', border: 'none', color: '#fff', borderRadius: 5, padding: '3px 7px', cursor: 'pointer', fontSize: 10, fontWeight: 700 }}>✕</button>
                                                    <div style={{ padding: '4px 6px', background: 'rgba(0,0,0,.65)', fontSize: 9, color: 'rgba(255,255,255,.55)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{img.name}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                        <div style={{ fontSize: 12, color: 'rgba(255,255,255,.45)' }}>{pessoasImages.length} pessoa(s)</div>
                                        <label style={{ display: 'inline-flex', alignItems: 'center', gap: 5, cursor: 'pointer', fontSize: 11, padding: '5px 12px', borderRadius: 6, border: '1px solid rgba(160,96,255,.35)', color: 'rgba(190,140,255,.85)', background: 'rgba(160,96,255,.08)' }}>
                                            <Ic n="plus" s={11} />Adicionar Pessoas
                                            <input type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={e => Array.from(e.target.files).forEach(addPessoaImage)} />
                                        </label>
                                    </div>
                                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,.28)', marginBottom: 10, lineHeight: 1.5 }}>Fotos de presskit com as pessoas/personagens que poderão aparecer nos posts.</div>
                                    {pessoasImages.length === 0 ? (
                                        <div style={{ padding: '28px 20px', textAlign: 'center', border: '1px dashed rgba(255,255,255,.1)', borderRadius: 10, color: 'rgba(255,255,255,.22)', fontSize: 13, lineHeight: 1.8 }}>
                                            Nenhuma pessoa cadastrada.<br />Adicione fotos do presskit do cliente.
                                        </div>
                                    ) : (
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(110px, 1fr))', gap: 10 }}>
                                            {pessoasImages.map(img => (
                                                <div key={img.id} style={{ position: 'relative', borderRadius: 8, overflow: 'hidden', border: '1px solid rgba(255,255,255,.1)' }}>
                                                    <img src={img.data} alt={img.name} style={{ width: '100%', aspectRatio: '1', objectFit: 'cover', display: 'block' }} />
                                                    <button onClick={() => deleteClientImage(img.id)} style={{ position: 'absolute', top: 4, right: 4, background: 'rgba(255,0,64,.8)', border: 'none', color: '#fff', borderRadius: 5, padding: '3px 7px', cursor: 'pointer', fontSize: 10, fontWeight: 700 }}>✕</button>
                                                    <div style={{ padding: '4px 6px', background: 'rgba(0,0,0,.65)', fontSize: 9, color: 'rgba(255,255,255,.55)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{img.name}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 20, paddingTop: 14, borderTop: '1px solid rgba(255,255,255,.06)' }}>
                                <button className="btn-secondary" onClick={onClose}>Cancelar</button>
                                <button className="btn-primary" onClick={save}><Ic n="plus" s={13} />Salvar Modelo</button>
                            </div>
                        </>)}
                    </div>
                </div>
            );
        }

        /* ── POST CREATOR ───────────────────────────────────── */
        function PostCreator() {
            const { store } = useApp();
            const pj = s => { try { return JSON.parse(s || '[]'); } catch { return []; } };
            const [selClientId, setSelClientId] = useState('');
            const [selTaskId, setSelTaskId] = useState('');
            const [headline, setHeadline] = useState('');
            const [conteudo, setConteudo] = useState('');
            const [personagem, setPersonagem] = useState(null);
            const [formato, setFormato] = useState('');
            const [tom, setTom] = useState('');
            const [generated, setGenerated] = useState(null);
            const [copied, setCopied] = useState(false);
            const [copiedImgId, setCopiedImgId] = useState(null);

            const client = store.clients.find(c => c.id === selClientId);
            /* Parse visualStyle JSON ({ s, f, c }) or fall back to plain text */
            const parseVS = raw => { try { const o = JSON.parse(raw || '{}'); if (o && typeof o.s !== 'undefined') return { style: o.s || '', fonts: o.f || [], colors: o.c || [] }; } catch { } return { style: raw || '', fonts: [], colors: [] }; };
            const vs = parseVS(client?.visualStyle);
            const clientFonts = vs.fonts;
            const clientColors = vs.colors;
            const vsText = vs.style;
            const refImages = (store.clientImages || []).filter(i => i.clientId === selClientId && i.type !== 'pessoa');
            const pessoasImages = (store.clientImages || []).filter(i => i.clientId === selClientId && i.type === 'pessoa');
            const postTasks = selClientId ? (store.tasks || []).filter(t => t.clientId === selClientId && t.category === 'Post' && t.status !== 'Concluído') : [];

            const changeClient = id => { setSelClientId(id); setSelTaskId(''); setHeadline(''); setConteudo(''); setPersonagem(null); setFormato(''); setTom(''); setGenerated(null); };
            const pickTask = id => {
                setSelTaskId(id);
                const t = postTasks.find(x => x.id === id);
                if (t) { setHeadline(t.title || ''); setConteudo(t.desc || t.description || ''); }
            };

            const buildPrompt = () => {
                const tmpl = client?.promptTemplate || '';
                let base = tmpl
                    ? tmpl.replace(/Titulo:/gi, headline).replace(/Conteúdo:/gi, conteudo)
                    : `Crie uma imagem para post de Instagram.\n\nTema: ${headline || '(sem headline)'}\n\nConteúdo: ${conteudo || '(sem conteúdo)'}`;
                const specs = [];
                if (vsText) specs.push(`Estilo Visual: ${vsText}`);
                if (clientFonts.length) specs.push(`Fontes: ${clientFonts.join(', ')}`);
                if (clientColors.length) specs.push(`Cores da marca: ${clientColors.join(', ')}`);
                if (formato) specs.push(`Formato: ${formato}`);
                if (tom) specs.push(`Tom: ${tom}`);
                if (personagem === 'sim') specs.push('Incluir um personagem/pessoa humana na composição.');
                if (personagem === 'nao') specs.push('Não incluir nenhuma pessoa ou personagem na composição.');
                return base + (specs.length ? '\n\n' + specs.join('\n') : '');
            };

            const generate = () => { setGenerated({ prompt: buildPrompt(), refs: [...refImages], pessoas: [...pessoasImages] }); setCopied(false); setCopiedImgId(null); };
            const copy = () => { navigator.clipboard.writeText(generated.prompt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2200); }); };
            const copyImgToClipboard = (dataUrl, id) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    canvas.toBlob(async blob => {
                        try {
                            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                            setCopiedImgId(id); setTimeout(() => setCopiedImgId(null), 2000);
                        } catch { setCopiedImgId(id + '_err'); setTimeout(() => setCopiedImgId(null), 2000); }
                    }, 'image/png');
                };
                img.src = dataUrl;
            };
            const canGenerate = selClientId && (headline || conteudo);

            return (
                <div className="glass fade-in" style={{ marginBottom: 24, borderColor: 'rgba(160,96,255,.25)' }}>
                    {/* Header */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '16px 20px', borderBottom: '1px solid rgba(255,255,255,.05)' }}>
                        <div style={{ width: 26, height: 26, borderRadius: 6, background: 'rgba(160,96,255,.15)', border: '1px solid rgba(160,96,255,.3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(180,120,255,.9)" strokeWidth="2"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                        </div>
                        <h3 style={{ fontSize: 14, fontWeight: 700, color: 'rgba(190,140,255,.95)' }}>Criar Post</h3>
                        {generated && <button className="btn-secondary" onClick={() => setGenerated(null)} style={{ marginLeft: 'auto', fontSize: 11, padding: '3px 10px' }}>← Novo</button>}
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0 }}>
                        {/* LEFT — form */}
                        <div style={{ padding: '18px 20px', borderRight: '1px solid rgba(255,255,255,.05)', display: 'flex', flexDirection: 'column', gap: 13 }}>

                            {/* Cliente */}
                            <div>
                                <L>Cliente</L>
                                <select className="input-field" value={selClientId} onChange={e => changeClient(e.target.value)}>
                                    <option value="">Selecione o cliente</option>
                                    {store.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>

                            {/* Specs do cliente */}
                            {selClientId && (clientFonts.length > 0 || clientColors.length > 0 || vsText) && (
                                <div style={{ padding: '9px 12px', borderRadius: 8, background: 'rgba(160,96,255,.07)', border: '1px solid rgba(160,96,255,.16)', display: 'flex', flexDirection: 'column', gap: 5 }}>
                                    {vsText && <div style={{ fontSize: 11, color: 'rgba(255,255,255,.45)' }}>Estilo: <span style={{ color: 'rgba(200,155,255,.8)' }}>{vsText}</span></div>}
                                    {clientFonts.length > 0 && <div style={{ fontSize: 11, color: 'rgba(255,255,255,.45)' }}>Fontes: <span style={{ color: 'rgba(200,155,255,.8)' }}>{clientFonts.join(' · ')}</span></div>}
                                    {clientColors.length > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                        <span style={{ fontSize: 11, color: 'rgba(255,255,255,.45)' }}>Cores:</span>
                                        {clientColors.map((c, i) => <div key={i} title={c} style={{ width: 15, height: 15, borderRadius: 3, background: c, border: '1px solid rgba(255,255,255,.15)', flexShrink: 0 }} />)}
                                    </div>}
                                </div>
                            )}

                            {/* Tarefa (opcional) */}
                            {selClientId && postTasks.length > 0 && (
                                <div>
                                    <L>Tarefa Post (opcional)</L>
                                    <select className="input-field" value={selTaskId} onChange={e => pickTask(e.target.value)}>
                                        <option value="">— Preencher manualmente —</option>
                                        {postTasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                    </select>
                                </div>
                            )}

                            {/* Headline */}
                            <div>
                                <L>Headline</L>
                                <input className="input-field" value={headline} onChange={e => setHeadline(e.target.value)} placeholder="Ex: Novos empreendimentos em Itajaí" />
                            </div>

                            {/* Conteúdo */}
                            <div>
                                <L>Conteúdo</L>
                                <textarea className="input-field" rows={3} value={conteudo} onChange={e => setConteudo(e.target.value)} placeholder="Ex: Prédios ao redor, vista panorâmica, área nobre..." style={{ resize: 'vertical' }} />
                            </div>

                            {/* Personagem */}
                            <div>
                                <L>Personagem</L>
                                <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                                    {[['sim', 'Com personagem'], ['nao', 'Sem personagem']].map(([v, label]) => (
                                        <button key={v} onClick={() => setPersonagem(personagem === v ? null : v)} style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid', cursor: 'pointer', fontSize: 12, fontWeight: 600, transition: 'all .15s', background: personagem === v ? 'rgba(160,96,255,.2)' : 'rgba(255,255,255,.03)', borderColor: personagem === v ? 'rgba(160,96,255,.55)' : 'rgba(255,255,255,.1)', color: personagem === v ? 'rgba(200,155,255,.95)' : 'rgba(255,255,255,.45)' }}>{label}</button>
                                    ))}
                                </div>
                            </div>

                            {/* Formato */}
                            <div>
                                <L>Formato</L>
                                <select className="input-field" value={formato} onChange={e => setFormato(e.target.value)}>
                                    <option value="">— Não especificar —</option>
                                    <option value="Feed quadrado (1080×1080px)">Feed quadrado (1080×1080px)</option>
                                    <option value="Feed retrato (1080×1350px)">Feed retrato (1080×1350px)</option>
                                    <option value="Stories/Reels (1080×1920px)">Stories/Reels (1080×1920px)</option>
                                    <option value="Banner horizontal">Banner horizontal</option>
                                    <option value="Carrossel">Carrossel</option>
                                </select>
                            </div>

                            {/* Tom */}
                            <div>
                                <L>Tom</L>
                                <select className="input-field" value={tom} onChange={e => setTom(e.target.value)}>
                                    <option value="">— Padrão do cliente —</option>
                                    <option value="Profissional e sóbrio">Profissional e sóbrio</option>
                                    <option value="Descontraído e amigável">Descontraído e amigável</option>
                                    <option value="Urgente e impactante">Urgente e impactante</option>
                                    <option value="Inspiracional e motivacional">Inspiracional e motivacional</option>
                                    <option value="Luxuoso e exclusivo">Luxuoso e exclusivo</option>
                                </select>
                            </div>

                            <button className="btn-primary" onClick={generate} disabled={!canGenerate} style={{ width: '100%', padding: '11px', fontSize: 13, opacity: canGenerate ? 1 : 0.38, cursor: canGenerate ? 'pointer' : 'default', marginTop: 2 }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                                Gerar Prompt
                            </button>
                        </div>

                        {/* RIGHT — resultado */}
                        <div style={{ padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>
                            {generated ? (<>
                                {/* Prompt */}
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                        <L>Prompt Gerado</L>
                                        <button onClick={copy} className="btn-secondary" style={{ fontSize: 11, padding: '4px 16px', color: copied ? '#00c864' : undefined, borderColor: copied ? 'rgba(0,200,100,.4)' : undefined, transition: 'all .2s' }}>
                                            {copied ? '✓ Copiado!' : 'Copiar Prompt'}
                                        </button>
                                    </div>
                                    <textarea readOnly value={generated.prompt} style={{ width: '100%', minHeight: 200, background: 'rgba(0,0,0,.28)', border: '1px solid rgba(255,255,255,.1)', borderRadius: 8, padding: '12px 14px', color: 'rgba(255,255,255,.88)', fontSize: 12, lineHeight: 1.85, resize: 'vertical', fontFamily: 'inherit', outline: 'none' }} />
                                </div>

                                {/* Referências */}
                                {/* Imagens copiáveis — helper inline */}
                                {(() => {
                                    const ImgThumb = ({ img, accentColor }) => {
                                        const isCopied = copiedImgId === img.id;
                                        const isErr = copiedImgId === img.id + '_err';
                                        return (
                                            <div onClick={() => copyImgToClipboard(img.data, img.id)} title={img.name} style={{ cursor: 'pointer', borderRadius: 8, overflow: 'hidden', border: `1px solid ${isCopied ? 'rgba(0,200,100,.55)' : accentColor}`, position: 'relative', width: 76, height: 76, flexShrink: 0, transition: 'border-color .2s' }}>
                                                <img src={img.data} alt={img.name} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                                                {(isCopied || isErr) ? (
                                                    <div style={{ position: 'absolute', inset: 0, background: isCopied ? 'rgba(0,160,80,.82)' : 'rgba(200,50,50,.82)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color: '#fff', letterSpacing: .3 }}>
                                                        {isCopied ? '✓ Copiado' : '✕ Erro'}
                                                    </div>
                                                ) : (
                                                    <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
                                                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(0,0,0,.52)'; e.currentTarget.querySelector('svg').style.opacity = '1'; }}
                                                        onMouseLeave={e => { e.currentTarget.style.background = 'rgba(0,0,0,0)'; e.currentTarget.querySelector('svg').style.opacity = '0'; }}>
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" style={{ opacity: 0, transition: 'opacity .15s' }}><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    };
                                    return (<>
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                                <L>Referências do Cliente</L>
                                                <span style={{ fontSize: 10, color: 'rgba(255,255,255,.28)' }}>Clique para copiar</span>
                                            </div>
                                            {generated.refs.length > 0 ? (
                                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                                                    {generated.refs.map(img => <ImgThumb key={img.id} img={img} accentColor="rgba(160,96,255,.35)" />)}
                                                </div>
                                            ) : (
                                                <div style={{ fontSize: 12, color: 'rgba(255,255,255,.22)', padding: '8px 0', lineHeight: 1.6 }}>Nenhuma referência cadastrada.<br />Use "Criar Modelos → Referências".</div>
                                            )}
                                        </div>
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                                <L>Pessoas</L>
                                                <span style={{ fontSize: 10, color: 'rgba(255,255,255,.28)' }}>Clique para copiar</span>
                                            </div>
                                            {generated.pessoas.length > 0 ? (
                                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                                                    {generated.pessoas.map(img => <ImgThumb key={img.id} img={img} accentColor="rgba(96,160,255,.35)" />)}
                                                </div>
                                            ) : (
                                                <div style={{ fontSize: 12, color: 'rgba(255,255,255,.22)', padding: '8px 0', lineHeight: 1.6 }}>Nenhuma pessoa cadastrada.<br />Use "Criar Modelos → Pessoas".</div>
                                            )}
                                        </div>
                                    </>);
                                })()}
                            </>) : (
                                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10, color: 'rgba(255,255,255,.13)', minHeight: 220 }}>
                                    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                                    <span style={{ fontSize: 13, textAlign: 'center', lineHeight: 1.7 }}>Preencha os campos e<br />clique em "Gerar Prompt"</span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Design() {
            const { store, deleteDesign, editDesign } = useApp();
            const [showAdd, setShowAdd] = useState(false);
            const [editing, setEditing] = useState(null);
            const [del, setDel] = useState(null);
            const [filt, setFilt] = useState('Todos');
            const [filtAssignee, setFiltAssignee] = useState('Todos');
            const [addingTaskFor, setAddingTaskFor] = useState(null);
            const [editingTask, setEditingTask] = useState(null);
            const [lightbox, setLightbox] = useState(null);
            const [showModelos, setShowModelos] = useState(false);

            const toggleTaskDone = (reqId, taskId) => {
                const req = store.designReqs.find(r => r.id === reqId);
                if (!req) return;
                editDesign(reqId, { subtasks: (req.subtasks || []).map(t => t.id === taskId ? { ...t, done: !t.done } : t) });
            };
            const deleteSubtask = (reqId, taskId) => {
                const req = store.designReqs.find(r => r.id === reqId);
                if (!req) return;
                editDesign(reqId, { subtasks: (req.subtasks || []).filter(t => t.id !== taskId) });
            };

            const rows = store.designReqs
                .filter(r => filt === 'Todos' || r.status === filt)
                .filter(r => {
                    if (filtAssignee === 'Todos') return true;
                    if (r.assignee === filtAssignee) return true;
                    return (r.subtasks || []).some(t => t.assignee === filtAssignee);
                });

            return (
                <div className="fade-in">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 22 }}>
                        <div><h1 style={{ fontSize: 21, fontWeight: 700 }}>Solicitações de Design</h1><p style={{ fontSize: 13, color: 'rgba(255,255,255,.38)', marginTop: 3 }}>{store.designReqs.length} solicitações</p></div>
                        <div style={{ display: 'flex', gap: 8 }}>
                            <button className="btn-secondary" onClick={() => setShowModelos(true)} style={{ fontSize: 12, borderColor: 'rgba(160,96,255,.35)', color: 'rgba(190,140,255,.85)' }}>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg>
                                Criar Modelos
                            </button>
                            <button className="btn-primary" onClick={() => setShowAdd(true)}><Ic n="plus" s={15} />Nova Solicitação</button>
                        </div>
                    </div>

                    <PostCreator />

                    {/* Filtro por status */}
                    <div style={{ display: 'flex', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
                        {['Todos', 'Aberto', 'Em Revisão', 'Concluído', 'Encerrado'].map(f => (
                            <button key={f} onClick={() => setFilt(f)} style={{ padding: '7px 13px', borderRadius: 8, border: '1px solid', fontSize: 12, cursor: 'pointer', fontWeight: 600, transition: 'all .2s', background: filt === f ? 'rgba(255,0,64,.18)' : 'rgba(255,255,255,.03)', borderColor: filt === f ? 'rgba(255,0,64,.5)' : 'rgba(255,255,255,.08)', color: filt === f ? '#ff4060' : 'rgba(255,255,255,.55)' }}>{f}</button>
                        ))}
                    </div>

                    {/* Filtro por responsável */}
                    <div style={{ display: 'flex', gap: 8, marginBottom: 22, flexWrap: 'wrap', alignItems: 'center' }}>
                        <span style={{ fontSize: 11, color: 'rgba(255,255,255,.3)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: .5 }}>Responsável:</span>
                        {['Todos', ...TEAM].map(a => (
                            <button key={a} onClick={() => setFiltAssignee(a)} style={{ padding: '5px 12px', borderRadius: 20, border: '1px solid', fontSize: 11, cursor: 'pointer', fontWeight: 600, transition: 'all .2s', background: filtAssignee === a ? 'rgba(160,96,255,.18)' : 'rgba(255,255,255,.03)', borderColor: filtAssignee === a ? 'rgba(160,96,255,.55)' : 'rgba(255,255,255,.08)', color: filtAssignee === a ? '#c080ff' : 'rgba(255,255,255,.45)' }}>
                                {a === 'Todos' ? 'Todos' : a.split(' ')[0]}
                            </button>
                        ))}
                    </div>

                    {rows.length === 0 ? (
                        <div className="glass" style={{ padding: 60, textAlign: 'center', color: 'rgba(255,255,255,.3)' }}><div style={{ fontSize: 44, marginBottom: 14 }}>🎨</div><div style={{ fontSize: 15 }}>Nenhuma solicitação encontrada.</div></div>
                    ) : (
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(310px,1fr))', gap: 16 }}>
                            {rows.map(r => {
                                const dl = daysLeft(r.dueDate);
                                const over = r.dueDate && isOverdue(r.dueDate) && r.status !== 'Concluído' && r.status !== 'Encerrado';
                                const subtasks = r.subtasks || [];
                                const doneCount = subtasks.filter(t => t.done).length;
                                return (
                                    <div key={r.id} className="glass glass-hover fade-in" style={{ padding: 18, transition: 'all .2s', ...(over ? { borderColor: 'rgba(255,0,64,.4)' } : {}) }}>

                                        {/* Header */}
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                                            <div style={{ fontSize: 14, fontWeight: 700, flex: 1, lineHeight: 1.3, paddingRight: 8 }}>{r.title}</div>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                                                {subtasks.length > 0 && (
                                                    <span style={{ background: doneCount === subtasks.length ? 'rgba(0,200,100,.18)' : 'rgba(255,255,255,.07)', color: doneCount === subtasks.length ? '#00c864' : 'rgba(255,255,255,.45)', border: '1px solid ' + (doneCount === subtasks.length ? 'rgba(0,200,100,.3)' : 'rgba(255,255,255,.1)'), borderRadius: 20, fontSize: 10, fontWeight: 700, padding: '2px 8px', whiteSpace: 'nowrap' }}>
                                                        {doneCount}/{subtasks.length} tasks
                                                    </span>
                                                )}
                                                <Badge v={r.status} />
                                            </div>
                                        </div>

                                        {/* Client + assignee */}
                                        <div style={{ fontSize: 11.5, color: 'rgba(255,255,255,.4)', marginBottom: 8 }}>
                                            {r.clientName && <span>👤 {r.clientName} · </span>}
                                            <span>→ {(r.assignee || '').split(' ')[0]}</span>
                                        </div>

                                        {r.desc && <div style={{ fontSize: 12, color: 'rgba(255,255,255,.5)', lineHeight: 1.5, marginBottom: 10 }}>{r.desc}</div>}
                                        {r.feedback && <div style={{ fontSize: 11.5, color: 'rgba(255,200,0,.8)', background: 'rgba(255,200,0,.06)', border: '1px solid rgba(255,200,0,.15)', borderRadius: 6, padding: '7px 10px', marginBottom: 10, lineHeight: 1.5 }}>💬 {r.feedback}</div>}

                                        {/* ── TASKS ── */}
                                        <div style={{ marginTop: 14, padding: '12px 0 4px', borderTop: '1px solid rgba(255,255,255,.06)' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                                                <span style={{ fontSize: 10.5, fontWeight: 700, color: 'rgba(255,255,255,.3)', textTransform: 'uppercase', letterSpacing: .7 }}>
                                                    Tasks {subtasks.length > 0 && `· ${doneCount}/${subtasks.length}`}
                                                </span>
                                                <button onClick={() => setAddingTaskFor(r.id)} style={{ background: 'rgba(255,0,64,.1)', border: '1px solid rgba(255,0,64,.25)', borderRadius: 6, color: '#ff6070', fontSize: 10, fontWeight: 700, padding: '3px 9px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, transition: 'all .2s' }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,0,64,.2)'} onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,0,64,.1)'}>
                                                    <Ic n="plus" s={10} /> Task
                                                </button>
                                            </div>

                                            {subtasks.length === 0 ? (
                                                <div onClick={() => setAddingTaskFor(r.id)} style={{ textAlign: 'center', padding: '12px 0', border: '1px dashed rgba(255,255,255,.07)', borderRadius: 8, fontSize: 11, color: 'rgba(255,255,255,.18)', cursor: 'pointer', transition: 'all .2s' }} onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(255,0,64,.25)'; e.currentTarget.style.color = 'rgba(255,255,255,.35)'; }} onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,.07)'; e.currentTarget.style.color = 'rgba(255,255,255,.18)'; }}>
                                                    Nenhuma task — clique para adicionar
                                                </div>
                                            ) : (
                                                <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                                                    {subtasks.map(t => (
                                                        <div key={t.id} style={{ background: t.done ? 'rgba(0,200,100,.05)' : 'rgba(255,255,255,.025)', border: '1px solid ' + (t.done ? 'rgba(0,200,100,.2)' : 'rgba(255,255,255,.07)'), borderLeft: '3px solid ' + (t.done ? '#00c864' : '#ff0040'), borderRadius: 7, padding: '9px 10px', transition: 'all .2s' }}>
                                                            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 9 }}>
                                                                {/* Checkbox */}
                                                                <button onClick={() => toggleTaskDone(r.id, t.id)} style={{ flexShrink: 0, width: 18, height: 18, borderRadius: 4, border: '2px solid ' + (t.done ? '#00c864' : 'rgba(255,255,255,.3)'), background: t.done ? '#00c864' : 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', marginTop: 1, transition: 'all .2s', color: '#fff', padding: 0 }}>
                                                                    {t.done && <Ic n="check" s={10} />}
                                                                </button>
                                                                {/* Content */}
                                                                <div style={{ flex: 1, minWidth: 0 }}>
                                                                    <div style={{ fontSize: 12.5, fontWeight: 600, color: t.done ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.88)', textDecoration: t.done ? 'line-through' : 'none', lineHeight: 1.35 }}>{t.title}</div>
                                                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.3)', marginTop: 3 }}>→ {(t.assignee || '').split(' ')[0]}</div>
                                                                    {t.images && t.images.length > 0 && (
                                                                        <div style={{ display: 'flex', gap: 5, marginTop: 7, flexWrap: 'wrap' }}>
                                                                            {t.images.map((src, i) => (
                                                                                <img key={i} src={src} onClick={() => setLightbox(src)} style={{ width: 44, height: 44, objectFit: 'cover', borderRadius: 5, border: '1px solid rgba(255,255,255,.1)', cursor: 'zoom-in', transition: 'transform .15s, box-shadow .15s' }} onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.12)'; e.currentTarget.style.boxShadow = '0 4px 16px rgba(0,0,0,.5)'; }} onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; e.currentTarget.style.boxShadow = 'none'; }} />
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                                {/* Edit / Delete */}
                                                                <div style={{ display: 'flex', gap: 2, flexShrink: 0 }}>
                                                                    <button onClick={() => setEditingTask({ reqId: r.id, task: t })} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(255,255,255,.2)', padding: 3, display: 'flex', borderRadius: 4, transition: 'color .15s' }} title="Editar task" onMouseEnter={e => e.currentTarget.style.color = 'rgba(255,255,255,.6)'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,.2)'}><Ic n="edit" s={11} /></button>
                                                                    <button onClick={() => deleteSubtask(r.id, t.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(255,60,60,.35)', padding: 3, display: 'flex', borderRadius: 4, transition: 'color .15s' }} title="Excluir task" onMouseEnter={e => e.currentTarget.style.color = '#ff4060'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,60,60,.35)'}><Ic n="trash" s={11} /></button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* Footer */}
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: 12, borderTop: '1px solid rgba(255,255,255,.05)', marginTop: 12 }}>
                                            <div style={{ display: 'flex', gap: 12, fontSize: 11, color: 'rgba(255,255,255,.4)' }}>
                                                <span>Rev: <strong style={{ color: (r.revisions || 0) > 3 ? '#ff4060' : '#ffcc00' }}>{r.revisions || 0}</strong></span>
                                                {r.dueDate && <span style={{ color: over ? '#ff4060' : dl <= 3 ? '#ffcc00' : 'inherit' }}>{over ? '⚠ Atrasado' : dl + 'd restantes'}</span>}
                                            </div>
                                            <div style={{ display: 'flex', gap: 5 }}>
                                                <button className="btn-secondary" style={{ padding: '4px 9px', fontSize: 11 }} onClick={() => editDesign(r.id, { revisions: (r.revisions || 0) + 1 })}>+Rev</button>
                                                <button className="btn-secondary" style={{ padding: '4px 8px' }} onClick={() => setEditing(r)}><Ic n="edit" s={11} /></button>
                                                <button className="btn-danger" style={{ padding: '4px 8px' }} onClick={() => setDel(r)}><Ic n="trash" s={11} /></button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {showAdd && <DesignModal onClose={() => setShowAdd(false)} />}
                    {editing && <DesignModal req={editing} onClose={() => setEditing(null)} />}
                    {del && <Confirm msg={'Excluir a solicitação de design "' + del.title + '"?'} onOk={() => deleteDesign(del.id)} onClose={() => setDel(null)} />}
                    {addingTaskFor && <DesignTaskModal reqId={addingTaskFor} onClose={() => setAddingTaskFor(null)} />}
                    {editingTask && <DesignTaskModal reqId={editingTask.reqId} task={editingTask.task} onClose={() => setEditingTask(null)} />}
                    {lightbox && <ImageLightbox src={lightbox} onClose={() => setLightbox(null)} />}
                    {showModelos && <PromptTemplateModal onClose={() => setShowModelos(false)} />}
                </div>
            );
        }

        /* ── PERFORMANCE MODAL ───────────────────────────────── */
        function PerformanceModal({ rec, onClose }) {
            const { addPerformance, editPerformance, store } = useApp();
            const now = new Date();
            const [f, setF] = useState(rec ? { ...rec } : {
                clientId: '', clientName: '', platform: 'Instagram',
                month: now.getMonth() + 1, year: now.getFullYear(),
                followers: '', followersGained: '',
                reach: '', impressions: '', profileVisits: '',
                likes: '', comments: '', shares: '', saves: '',
                posts: '', stories: '', reels: '', notes: ''
            });
            const s = (k, v) => setF(p => ({ ...p, [k]: v }));
            const sub = e => {
                e.preventDefault();
                const cl = store.clients.find(c => c.id === f.clientId);
                const data = { ...f, clientName: cl?.name || f.clientName };
                rec ? editPerformance(rec.id, data) : addPerformance(data);
                onClose();
            };
            const SBox = ({ title, cols, children }) => (
                <div style={{ background: 'rgba(255,255,255,.03)', border: '1px solid rgba(255,255,255,.06)', borderRadius: 8, padding: '12px 14px', marginBottom: 14 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: 'rgba(255,255,255,.3)', textTransform: 'uppercase', letterSpacing: .7, marginBottom: 10 }}>{title}</div>
                    <div style={{ display: 'grid', gridTemplateColumns: `repeat(${cols || 2},1fr)`, gap: 12 }}>{children}</div>
                </div>
            );
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                            <h2 style={{ fontSize: 17, fontWeight: 700 }}>{rec ? 'Editar Registro' : '+ Novo Registro de Performance'}</h2>
                            <button className="btn-secondary" onClick={onClose} style={{ padding: '5px 9px' }}><Ic n="x" s={14} /></button>
                        </div>
                        <form onSubmit={sub}>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 14 }}>
                                <div><L>Cliente</L>
                                    <select className="input-field" value={f.clientId} onChange={e => { const cl = store.clients.find(c => c.id === e.target.value); s('clientId', e.target.value); if (cl) s('clientName', cl.name); }}>
                                        <option value="">Sem cliente</option>
                                        {store.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div><L>Plataforma</L>
                                    <select className="input-field" value={f.platform} onChange={e => s('platform', e.target.value)}>
                                        {PLATFORMS.map(p => <option key={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div><L>Mês</L>
                                    <select className="input-field" value={f.month} onChange={e => s('month', parseInt(e.target.value))}>
                                        {MESES.map((m, i) => <option key={i + 1} value={i + 1}>{m}</option>)}
                                    </select>
                                </div>
                                <div><L>Ano</L>
                                    <input className="input-field" type="number" value={f.year} onChange={e => s('year', parseInt(e.target.value))} min={2020} max={2099} />
                                </div>
                            </div>
                            <SBox title="Seguidores">
                                <div><L>Total de Seguidores</L><input className="input-field" type="number" placeholder="ex: 10500" value={f.followers} onChange={e => s('followers', e.target.value)} /></div>
                                <div><L>Ganhos no Mês</L><input className="input-field" type="number" placeholder="ex: 240" value={f.followersGained} onChange={e => s('followersGained', e.target.value)} /></div>
                            </SBox>
                            <SBox title="Visibilidade">
                                <div><L>Alcance</L><input className="input-field" type="number" placeholder="ex: 45000" value={f.reach} onChange={e => s('reach', e.target.value)} /></div>
                                <div><L>Impressões</L><input className="input-field" type="number" placeholder="ex: 120000" value={f.impressions} onChange={e => s('impressions', e.target.value)} /></div>
                                <div><L>Visitas ao Perfil</L><input className="input-field" type="number" placeholder="ex: 3200" value={f.profileVisits} onChange={e => s('profileVisits', e.target.value)} /></div>
                            </SBox>
                            <SBox title="Engajamento">
                                <div><L>Curtidas</L><input className="input-field" type="number" placeholder="ex: 1800" value={f.likes} onChange={e => s('likes', e.target.value)} /></div>
                                <div><L>Comentários</L><input className="input-field" type="number" placeholder="ex: 230" value={f.comments} onChange={e => s('comments', e.target.value)} /></div>
                                <div><L>Compartilhamentos</L><input className="input-field" type="number" placeholder="ex: 95" value={f.shares} onChange={e => s('shares', e.target.value)} /></div>
                                <div><L>Salvamentos</L><input className="input-field" type="number" placeholder="ex: 420" value={f.saves} onChange={e => s('saves', e.target.value)} /></div>
                            </SBox>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 14 }}>
                                <div><L>Posts</L><input className="input-field" type="number" placeholder="ex: 12" value={f.posts} onChange={e => s('posts', e.target.value)} /></div>
                                <div><L>Stories</L><input className="input-field" type="number" placeholder="ex: 45" value={f.stories} onChange={e => s('stories', e.target.value)} /></div>
                                <div><L>Reels/Vídeos</L><input className="input-field" type="number" placeholder="ex: 4" value={f.reels} onChange={e => s('reels', e.target.value)} /></div>
                            </div>
                            <div style={{ marginBottom: 14 }}><L>Observações</L><textarea className="input-field" rows={2} value={f.notes || ''} onChange={e => s('notes', e.target.value)} style={{ resize: 'vertical' }} /></div>
                            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                                <button type="button" className="btn-secondary" onClick={onClose}>Cancelar</button>
                                <button type="submit" className="btn-primary">{rec ? 'Salvar' : '+ Criar Registro'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        /* ── PERFORMANCE ─────────────────────────────────────── */
        function Performance() {
            const { store, deletePerformance } = useApp();
            const perf = store.performance || [];
            const [showAdd, setShowAdd] = useState(false);
            const [editing, setEditing] = useState(null);
            const [del, setDel] = useState(null);
            const [filtClient, setFiltClient] = useState('');
            const [filtPlatform, setFiltPlatform] = useState('Todos');
            const [pdfLoading, setPdfLoading] = useState(null);

            const rows = perf
                .filter(r => !filtClient || r.clientId === filtClient)
                .filter(r => filtPlatform === 'Todos' || r.platform === filtPlatform)
                .sort((a, b) => (b.year * 100 + b.month) - (a.year * 100 + a.month));

            return (
                <div className="fade-in">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 22 }}>

        /* ── MINI CALENDAR ──────────────────────────────────── */
        function MiniCalendar() {
            const { store, setView, setCalFocusDate } = useApp();
            const calEvs = store.calEvents || [];
            const kTasks = (store.tasks || []).filter(t => t.dueDate && t.status !== 'Concluído' && !t.fromCalendar);
            const today = new Date();
            const [mth, setMth] = useState(today.getMonth());
            const [yr, setYr] = useState(today.getFullYear());
            const evDays = new Set(calEvs.filter(e => { const d = new Date(e.date + 'T12:00'); return d.getMonth() === mth && d.getFullYear() === yr; }).map(e => new Date(e.date + 'T12:00').getDate()));
            const tkDays = new Set(kTasks.filter(t => { const d = new Date(t.dueDate + 'T12:00'); return d.getMonth() === mth && d.getFullYear() === yr; }).map(t => new Date(t.dueDate + 'T12:00').getDate()));
            const first = new Date(yr, mth, 1).getDay();
            const dim = new Date(yr, mth + 1, 0).getDate();
            const cells = [...Array(first).fill(null), ...Array.from({ length: dim }, (_, i) => i + 1)];
            return (
                <div style={{ padding: '8px 6px 4px', borderTop: '1px solid rgba(255,255,255,.05)', marginTop: 4 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 5, paddingLeft: 2, paddingRight: 2 }}>
                        <button onClick={() => { if (mth === 0) { setMth(11); setYr(y => y - 1); } else setMth(m => m - 1); }} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.35)', cursor: 'pointer', padding: '1px 5px', fontSize: 14, lineHeight: 1 }}>&#8249;</button>
                        <span onClick={() => setView('calendar')} style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,.45)', cursor: 'pointer', letterSpacing: .3 }}>{MESES_SHORT[mth]} {yr}</span>
                        <button onClick={() => { if (mth === 11) { setMth(0); setYr(y => y + 1); } else setMth(m => m + 1); }} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.35)', cursor: 'pointer', padding: '1px 5px', fontSize: 14, lineHeight: 1 }}>&#8250;</button>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)' }}>
                        {['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((d, i) => <div key={i} style={{ textAlign: 'center', fontSize: 8, color: 'rgba(255,255,255,.2)', fontWeight: 700, paddingBottom: 2 }}>{d}</div>)}
                        {cells.map((day, i) => {
                            const isT = day && day === today.getDate() && mth === today.getMonth() && yr === today.getFullYear();
                            const hasEv = day && (evDays.has(day) || tkDays.has(day));
                            return (
                                <div key={i} onClick={() => { if (!day) return; const ds = `${yr}-${String(mth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; setCalFocusDate(ds); setView('calendar'); }}
                                    style={{ textAlign: 'center', fontSize: 9, cursor: day ? 'pointer' : 'default', padding: '2px 0', borderRadius: 3, color: isT ? '#ff4060' : day ? 'rgba(255,255,255,.45)' : 'transparent', fontWeight: isT ? 700 : 400, background: isT ? 'rgba(255,0,64,.14)' : 'transparent', lineHeight: 1.3 }}>
                                    {day || ''}
                                    {hasEv && <div style={{ width: 3, height: 3, background: isT ? '#ff4060' : 'rgba(255,0,64,.65)', borderRadius: '50%', margin: '1px auto 0' }} />}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        /* ── GERAR PDF CALENDARIO ───────────────────────────── */
        async function gerarPDFCalendario(evs, tasks, month, year, clientName) {
            if (typeof window.jspdf === 'undefined') { alert('jsPDF nao carregado.'); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [1280, 720] });
            const W = 1280, H = 720, M = 24;
            const fill = (r, g, b) => doc.setFillColor(r, g, b);
            const tc = (r, g, b) => doc.setTextColor(r, g, b);
            const dc2 = (r, g, b) => doc.setDrawColor(r, g, b);
            const fnt = (st, sz) => { doc.setFont('helvetica', st); doc.setFontSize(sz); };
            fill(10, 9, 28); doc.rect(0, 0, W, H, 'F');
            fill(20, 18, 50); doc.rect(0, 0, W, 64, 'F');
            fill(255, 0, 64); doc.rect(0, 0, W, 4, 'F');
            let logoEndX = M + 58; try { const img = new Image(); img.src = 'images/LOGOTIPO 2 copiar 2.png'; await new Promise(r => { img.onload = r; img.onerror = r; setTimeout(r, 1200); }); if (img.naturalWidth > 0) { const lc = document.createElement('canvas'); lc.width = img.naturalWidth; lc.height = img.naturalHeight; lc.getContext('2d').drawImage(img, 0, 0); const asp = img.naturalWidth / img.naturalHeight; const lh = 46, lw = Math.round(asp * lh); doc.addImage(lc.toDataURL('image/png'), 'PNG', M, 9, lw, lh); logoEndX = M + lw + 12; } } catch { }
            fnt('bold', 20); tc(255, 255, 255); doc.text('Calendário ' + MESES[month] + ' ' + year, logoEndX, 36);
            if (clientName) { fnt('normal', 11); tc(160, 158, 210); doc.text(clientName, logoEndX, 52); }
            fnt('normal', 9); tc(100, 98, 150); doc.text('Gerado em ' + new Date().toLocaleDateString('pt-BR'), W - M, 38, { align: 'right' });
            fill(255, 0, 64); doc.rect(W - 3, 0, 3, H, 'F');
            const dim = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const rows = Math.ceil((firstDay + dim) / 7);
            const gridY = 72, gridH = H - gridY - 12;
            const cellW = (W - M * 2) / 7, cellH = (gridH - 18) / rows;
            const hdrH = 18;
            ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].forEach((d, i) => {
                fill(24, 22, 56); doc.rect(M + i * cellW, gridY, cellW, hdrH, 'F');
                fnt('bold', 8); tc(110, 108, 170); doc.text(d, M + i * cellW + cellW / 2, gridY + 12, { align: 'center' });
            });
            const todayStr = new Date().toISOString().split('T')[0];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < 7; c++) {
                    const dn = r * 7 + c - firstDay + 1;
                    const cx = M + c * cellW, cy = gridY + hdrH + r * cellH;
                    fill(14, 13, 40); doc.rect(cx, cy, cellW, cellH, 'F');
                    dc2(26, 24, 60); doc.setLineWidth(.4); doc.rect(cx, cy, cellW, cellH, 'S');
                    if (dn < 1 || dn > dim) continue;
                    const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(dn).padStart(2, '0')}`;
                    const isT = ds === todayStr;
                    if (isT) { fill(38, 8, 20); doc.rect(cx, cy, cellW, cellH, 'F'); dc2(255, 0, 64); doc.setLineWidth(.8); doc.rect(cx, cy, cellW, cellH, 'S'); }
                    fnt(isT ? 'bold' : 'normal', 8.5); tc(isT ? 255 : 160, isT ? 60 : 158, isT ? 80 : 200);
                    doc.text(String(dn), cx + cellW - 7, cy + 11, { align: 'right' });
                    const dayItems = [...evs.filter(e => e.date === ds), ...tasks.filter(t => t.dueDate === ds && !t.fromCalendar).map(t => ({ ...t, color: '#a060ff', _task: true }))];
                    let ey = cy + 16;
                    const maxItems = Math.floor((cellH - 16) / 11);
                    dayItems.slice(0, maxItems).forEach(ev => {
                        const rgb = ev.color ? [parseInt(ev.color.slice(1, 3), 16), parseInt(ev.color.slice(3, 5), 16), parseInt(ev.color.slice(5, 7), 16)] : [160, 96, 255];
                        fill(rgb[0], rgb[1], rgb[2]); doc.roundedRect(cx + 2, ey, cellW - 4, 9, 1.5, 1.5, 'F');
                        fnt('bold', 6); tc(240, 240, 240);
                        const lbl = (ev.startTime && !ev.allDay && !ev._task ? ev.startTime + ' ' : '') + ev.title;
                        doc.text(doc.splitTextToSize(lbl, cellW - 8)[0] || '', cx + 5, ey + 6.5);
                        ey += 11;
                    });
                    if (dayItems.length > maxItems) { fnt('normal', 5.5); tc(100, 98, 150); doc.text('+' + (dayItems.length - maxItems) + ' mais', cx + 3, cy + cellH - 4); }
                }
            }
            fill(14, 13, 42); doc.rect(0, H - 8, W, 8, 'F');
            fill(255, 0, 64); doc.rect(0, H - 4, W, 4, 'F');

        /* ── CAMPAIGN COMPARISON MODAL ───────────────────────── */
        function CampaignComparisonModal({ onClose }) {
            const [a, setA] = useState({ nome: 'Campanha A', budget: '', leads: '', sales: '', cpa: '' });
            const [b, setB] = useState({ nome: 'Campanha B', budget: '', leads: '', sales: '', cpa: '' });
            const [result, setResult] = useState(null);
            const [pdfLoad, setPdfLoad] = useState(false);
            const sa = (k, v) => setA(p => ({ ...p, [k]: v }));
            const sb = (k, v) => setB(p => ({ ...p, [k]: v }));
            const compare = () => {
                const calc = f => { const bg = parseFloat(f.budget) || 0, ld = parseInt(f.leads) || 0, sl = parseInt(f.sales) || 0, cp = parseFloat(f.cpa) || 0; return { budget: bg, leads: ld, sales: sl, cpa: cp, cpl: ld > 0 && bg > 0 ? bg / ld : 0, roas: bg > 0 && sl > 0 ? sl * cp / bg : 0, conv: ld > 0 ? (sl / ld) * 100 : 0, rev: sl * cp }; };
                const ra = calc(a), rb = calc(b);
                const diff = k => rb[k] > 0 && ra[k] > 0 ? ((rb[k] - ra[k]) / ra[k] * 100).toFixed(1) : null;
                setResult({ ra, rb, diffs: { cpl: diff('cpl'), roas: diff('roas'), conv: diff('conv'), rev: diff('rev'), leads: diff('leads') } });
            };
            const DiffBadge = ({ v, invert }) => { if (v === null) return <span style={{ color: 'rgba(255,255,255,.3)', fontSize: 11 }}>—</span>; const n = parseFloat(v); const pos = invert ? n < 0 : n > 0; return <span style={{ color: pos ? '#00c864' : '#ff4060', fontSize: 12, fontWeight: 700 }}>{n > 0 ? '+' : ''}{v}%</span>; };
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in" style={{ maxWidth: 640 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
                            <h3 style={{ fontSize: 15, fontWeight: 700 }}>Comparativo de Campanhas</h3>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer' }}><Ic n="x" s={16} /></button>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
                            {[{ label: 'Campanha A (Antiga)', vals: a, set: sa }, { label: 'Campanha B (Nova)', vals: b, set: sb }].map(({ label, vals, set }) => (
                                <div key={label} style={{ background: 'rgba(255,255,255,.03)', border: '1px solid rgba(255,255,255,.07)', borderRadius: 10, padding: 14 }}>
                                    <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 12, color: 'rgba(255,255,255,.7)' }}>{label}</div>
                                    <input className="input-field" style={{ marginBottom: 8, fontSize: 12 }} placeholder="Nome" value={vals.nome} onChange={e => set('nome', e.target.value)} />
                                    {[['Investimento', 'budget'], ['Leads', 'leads'], ['Vendas', 'sales'], ['CPA (R$)', 'cpa']].map(([l, k]) => (
                                        <div key={k} style={{ marginBottom: 8 }}><div style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', marginBottom: 3, fontWeight: 700, textTransform: 'uppercase', letterSpacing: .4 }}>{l}</div><input className="input-field" type="number" style={{ fontSize: 12 }} placeholder="0" value={vals[k]} onChange={e => set(k, e.target.value)} /></div>
                                    ))}
                                </div>
                            ))}
                        </div>
                        <button className="btn-primary" style={{ width: '100%', justifyContent: 'center', marginBottom: result ? 16 : 0 }} onClick={compare}>Comparar Campanhas</button>
                        {result && (
                            <div style={{ borderTop: '1px solid rgba(255,255,255,.07)', paddingTop: 16 }}>
                                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: 'rgba(255,255,255,.8)' }}>Resultado da Comparação ({a.nome} vs {b.nome})</div>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 10, marginBottom: 16 }}>
                                    {[['CPL', result.ra.cpl > 0 ? 'R$' + result.ra.cpl.toFixed(2) : '—', result.rb.cpl > 0 ? 'R$' + result.rb.cpl.toFixed(2) : '—', result.diffs.cpl, true],
                                    ['ROAS', result.ra.roas.toFixed(2) + 'x', result.rb.roas.toFixed(2) + 'x', result.diffs.roas, false],
                                    ['Conv %', result.ra.conv.toFixed(1) + '%', result.rb.conv.toFixed(1) + '%', result.diffs.conv, false],
                                    ['Receita', 'R$' + result.ra.rev.toLocaleString('pt-BR', { minimumFractionDigits: 2 }), 'R$' + result.rb.rev.toLocaleString('pt-BR', { minimumFractionDigits: 2 }), result.diffs.rev, false],
                                    ['Leads', result.ra.leads, result.rb.leads, result.diffs.leads, false]
                                    ].map(([l, va, vb, diff, inv]) => (
                                        <div key={l} style={{ background: 'rgba(255,255,255,.03)', border: '1px solid rgba(255,255,255,.06)', borderRadius: 8, padding: '10px 12px', textAlign: 'center' }}>
                                            <div style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', marginBottom: 4, fontWeight: 700, textTransform: 'uppercase', letterSpacing: .4 }}>{l}</div>
                                            <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 2 }}>{va}</div>
                                            <div style={{ fontSize: 14, fontWeight: 700, color: 'rgba(255,255,255,.85)', marginBottom: 4 }}>{vb}</div>
                                            <DiffBadge v={diff} invert={inv} />
                                        </div>
                                    ))}
                                </div>
                                <button className="btn-secondary" disabled={pdfLoad} style={{ width: '100%', justifyContent: 'center' }} onClick={async () => { setPdfLoad(true); try { await gerarPDFComparativo(a, b, result); } catch (e) { console.error(e); } setPdfLoad(false); }}>
                                    {pdfLoad ? 'Gerando PDF...' : 'Gerar PDF Comparativo'}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* ── GERAR PDF COMPARATIVO ───────────────────────────── */
        async function gerarPDFComparativo(camA, camB, result) {
            if (typeof window.jspdf === 'undefined') { alert('jsPDF nao carregado.'); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [1280, 720] });
            const W = 1280, H = 720, M = 24;
            const fill = (r, g, b) => doc.setFillColor(r, g, b);
            const tc = (r, g, b) => doc.setTextColor(r, g, b);
            const dc2 = (r, g, b) => doc.setDrawColor(r, g, b);
