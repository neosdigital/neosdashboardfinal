                                </select>
                            </div>

                            {/* Specs do cliente */}
                            {selClientId && (clientFonts.length > 0 || clientColors.length > 0 || vsText) && (
                                <div style={{ padding: '9px 12px', borderRadius: 8, background: 'rgba(160,96,255,.07)', border: '1px solid rgba(160,96,255,.16)', display: 'flex', flexDirection: 'column', gap: 5 }}>
                                    {vsText && <div style={{ fontSize: 11, color: 'rgba(255,255,255,.45)' }}>Estilo: <span style={{ color: 'rgba(200,155,255,.8)' }}>{vsText}</span></div>}
                                    {clientFonts.length > 0 && <div style={{ fontSize: 11, color: 'rgba(255,255,255,.45)' }}>Fontes: <span style={{ color: 'rgba(200,155,255,.8)' }}>{clientFonts.join(' · ')}</span></div>}
                                    {clientColors.length > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                        <span style={{ fontSize: 11, color: 'rgba(255,255,255,.45)' }}>Cores:</span>
                                        {clientColors.map((c, i) => <div key={i} title={c} style={{ width: 15, height: 15, borderRadius: 3, background: c, border: '1px solid rgba(255,255,255,.15)', flexShrink: 0 }} />)}
                                    </div>}
                                </div>
                            )}

                            {/* Tarefa (opcional) */}
                            {selClientId && postTasks.length > 0 && (
                                <div>
                                    <L>Tarefa Post (opcional)</L>
                                    <select className="input-field" value={selTaskId} onChange={e => pickTask(e.target.value)}>
                                        <option value="">— Preencher manualmente —</option>
                                        {postTasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                    </select>
                                </div>
                            )}

                            {/* Headline */}
                            <div>
                                <L>Headline</L>
                                <input className="input-field" value={headline} onChange={e => setHeadline(e.target.value)} placeholder="Ex: Novos empreendimentos em Itajaí" />
                            </div>

                            {/* Conteúdo */}
                            <div>
                                <L>Conteúdo</L>
                                <textarea className="input-field" rows={3} value={conteudo} onChange={e => setConteudo(e.target.value)} placeholder="Ex: Prédios ao redor, vista panorâmica, área nobre..." style={{ resize: 'vertical' }} />
                            </div>

                            {/* Personagem */}
                            <div>
                                <L>Personagem</L>
                                <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                                    {[['sim', 'Com personagem'], ['nao', 'Sem personagem']].map(([v, label]) => (
                                        <button key={v} onClick={() => setPersonagem(personagem === v ? null : v)} style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid', cursor: 'pointer', fontSize: 12, fontWeight: 600, transition: 'all .15s', background: personagem === v ? 'rgba(160,96,255,.2)' : 'rgba(255,255,255,.03)', borderColor: personagem === v ? 'rgba(160,96,255,.55)' : 'rgba(255,255,255,.1)', color: personagem === v ? 'rgba(200,155,255,.95)' : 'rgba(255,255,255,.45)' }}>{label}</button>
                                    ))}
                                </div>
                            </div>

                            {/* Formato */}
                            <div>
                                <L>Formato</L>
                                <select className="input-field" value={formato} onChange={e => setFormato(e.target.value)}>
                                    <option value="">— Não especificar —</option>
                                    <option value="Feed quadrado (1080×1080px)">Feed quadrado (1080×1080px)</option>
                                    <option value="Feed retrato (1080×1350px)">Feed retrato (1080×1350px)</option>
                                    <option value="Stories/Reels (1080×1920px)">Stories/Reels (1080×1920px)</option>
                                    <option value="Banner horizontal">Banner horizontal</option>
                                    <option value="Carrossel">Carrossel</option>
                                </select>
                            </div>

                            {/* Tom */}
                            <div>
                                <L>Tom</L>
                                <select className="input-field" value={tom} onChange={e => setTom(e.target.value)}>
                                    <option value="">— Padrão do cliente —</option>
                                    <option value="Profissional e sóbrio">Profissional e sóbrio</option>
                                    <option value="Descontraído e amigável">Descontraído e amigável</option>
                                    <option value="Urgente e impactante">Urgente e impactante</option>
                                    <option value="Inspiracional e motivacional">Inspiracional e motivacional</option>
                                    <option value="Luxuoso e exclusivo">Luxuoso e exclusivo</option>
                                </select>
                            </div>

                            <button className="btn-primary" onClick={generate} disabled={!canGenerate} style={{ width: '100%', padding: '11px', fontSize: 13, opacity: canGenerate ? 1 : 0.38, cursor: canGenerate ? 'pointer' : 'default', marginTop: 2 }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                                Gerar Prompt
                            </button>
                        </div>

                        {/* RIGHT — resultado */}
                        <div style={{ padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>
                            {generated ? (<>
                                {/* Prompt */}
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                        <L>Prompt Gerado</L>
                                        <button onClick={copy} className="btn-secondary" style={{ fontSize: 11, padding: '4px 16px', color: copied ? '#00c864' : undefined, borderColor: copied ? 'rgba(0,200,100,.4)' : undefined, transition: 'all .2s' }}>
                                            {copied ? '✓ Copiado!' : 'Copiar Prompt'}
                                        </button>
                                    </div>
                                    <textarea readOnly value={generated.prompt} style={{ width: '100%', minHeight: 200, background: 'rgba(0,0,0,.28)', border: '1px solid rgba(255,255,255,.1)', borderRadius: 8, padding: '12px 14px', color: 'rgba(255,255,255,.88)', fontSize: 12, lineHeight: 1.85, resize: 'vertical', fontFamily: 'inherit', outline: 'none' }} />
                                </div>

                                {/* Referências */}
                                {/* Imagens copiáveis — helper inline */}
                                {(() => {
                                    const ImgThumb = ({ img, accentColor }) => {
                                        const isCopied = copiedImgId === img.id;
                                        const isErr = copiedImgId === img.id + '_err';
                                        return (
                                            <div onClick={() => copyImgToClipboard(img.data, img.id)} title={img.name} style={{ cursor: 'pointer', borderRadius: 8, overflow: 'hidden', border: `1px solid ${isCopied ? 'rgba(0,200,100,.55)' : accentColor}`, position: 'relative', width: 76, height: 76, flexShrink: 0, transition: 'border-color .2s' }}>
                                                <img src={img.data} alt={img.name} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                                                {(isCopied || isErr) ? (
                                                    <div style={{ position: 'absolute', inset: 0, background: isCopied ? 'rgba(0,160,80,.82)' : 'rgba(200,50,50,.82)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color: '#fff', letterSpacing: .3 }}>
                                                        {isCopied ? '✓ Copiado' : '✕ Erro'}
                                                    </div>
                                                ) : (
                                                    <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
                                                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(0,0,0,.52)'; e.currentTarget.querySelector('svg').style.opacity = '1'; }}
                                                        onMouseLeave={e => { e.currentTarget.style.background = 'rgba(0,0,0,0)'; e.currentTarget.querySelector('svg').style.opacity = '0'; }}>
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" style={{ opacity: 0, transition: 'opacity .15s' }}><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    };
                                    return (<>
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                                <L>Referências do Cliente</L>
                                                <span style={{ fontSize: 10, color: 'rgba(255,255,255,.28)' }}>Clique para copiar</span>
                                            </div>
                                            {generated.refs.length > 0 ? (
                                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                                                    {generated.refs.map(img => <ImgThumb key={img.id} img={img} accentColor="rgba(160,96,255,.35)" />)}
                                                </div>
                                            ) : (
                                                <div style={{ fontSize: 12, color: 'rgba(255,255,255,.22)', padding: '8px 0', lineHeight: 1.6 }}>Nenhuma referência cadastrada.<br />Use "Criar Modelos → Referências".</div>
                                            )}
                                        </div>
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                                <L>Pessoas</L>
                                                <span style={{ fontSize: 10, color: 'rgba(255,255,255,.28)' }}>Clique para copiar</span>
                                            </div>
                                            {generated.pessoas.length > 0 ? (
                                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                                                    {generated.pessoas.map(img => <ImgThumb key={img.id} img={img} accentColor="rgba(96,160,255,.35)" />)}
                                                </div>
                                            ) : (
                                                <div style={{ fontSize: 12, color: 'rgba(255,255,255,.22)', padding: '8px 0', lineHeight: 1.6 }}>Nenhuma pessoa cadastrada.<br />Use "Criar Modelos → Pessoas".</div>
                                            )}
                                        </div>
                                    </>);
                                })()}
                            </>) : (
                                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10, color: 'rgba(255,255,255,.13)', minHeight: 220 }}>
                                    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                                    <span style={{ fontSize: 13, textAlign: 'center', lineHeight: 1.7 }}>Preencha os campos e<br />clique em "Gerar Prompt"</span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        /* ── NEOS FLOWGRAM ─────────────────────────────────────── */
        const FG_SIZES = {
            'Post':       { w: 1080, h: 1080, label: '1080×1080' },
            'Carrossel':  { w: 1080, h: 1080, label: '1080×1080 (multi)' },
            'Story':      { w: 1080, h: 1920, label: '1080×1920' },
            'Flyer':      { w: 1080, h: 1350, label: '1080×1350' },
            'Banner':     { w: 1200, h: 628,  label: '1200×628' },
            'Thumb':      { w: 1280, h: 720,  label: '1280×720' },
        };

        const FG_TEMPLATES = [
            { id: 'tpl1', name: 'Minimalista', type: 'Post',      thumb: null, bg: '#1a1a2e', objects: [
                { kind: 'rect',  left: 80, top: 80, width: 920, height: 920, fill: '#16213e', rx: 24 },
                { kind: 'text',  left: 540, top: 420, text: 'Seu Título Aqui', fontSize: 64, fill: '#fff', fontWeight: 'bold', textAlign: 'center', originX: 'center' },
                { kind: 'text',  left: 540, top: 520, text: 'Subtítulo ou descrição curta', fontSize: 28, fill: 'rgba(255,255,255,0.55)', textAlign: 'center', originX: 'center' },
            ]},
            { id: 'tpl2', name: 'Gradiente',  type: 'Post',      thumb: null, bg: '#0f0f23', objects: [
                { kind: 'rect',  left: 0,  top: 700, width: 1080, height: 380, fill: 'rgba(255,0,64,0.85)' },
                { kind: 'text',  left: 540, top: 780, text: 'TÍTULO IMPACTANTE', fontSize: 72, fill: '#fff', fontWeight: 'bold', textAlign: 'center', originX: 'center' },
                { kind: 'text',  left: 540, top: 880, text: '@sua_marca', fontSize: 30, fill: 'rgba(255,255,255,0.7)', textAlign: 'center', originX: 'center' },
            ]},
            { id: 'tpl3', name: 'Story Clean', type: 'Story',    thumb: null, bg: '#ffffff', objects: [
                { kind: 'rect',  left: 40, top: 200, width: 1000, height: 1520, fill: '#f5f5f5', rx: 32 },
                { kind: 'text',  left: 540, top: 800, text: 'Seu Conteúdo', fontSize: 80, fill: '#111', fontWeight: 'bold', textAlign: 'center', originX: 'center' },
                { kind: 'text',  left: 540, top: 920, text: 'Link na bio ↓', fontSize: 36, fill: '#555', textAlign: 'center', originX: 'center' },
            ]},
            { id: 'tpl4', name: 'Banner Ad',  type: 'Banner',    thumb: null, bg: '#0d1117', objects: [
                { kind: 'rect',  left: 0, top: 0, width: 1200, height: 628, fill: '#161b22' },
                { kind: 'rect',  left: 0, top: 0, width: 6, height: 628, fill: '#ff0040' },
                { kind: 'text',  left: 80, top: 220, text: 'Headline Aqui', fontSize: 72, fill: '#fff', fontWeight: 'bold' },
                { kind: 'text',  left: 80, top: 320, text: 'Chamada de ação ou descrição do produto', fontSize: 30, fill: 'rgba(255,255,255,0.6)' },
            ]},
        ];

        function FlowGram() {
            const { store } = useApp();
            const canvasRef = useRef(null);
            const fabricRef = useRef(null);
            const [creativeType, setCreativeType] = useState('Post');
            const [clientId, setClientId] = useState('');
            const [prompt, setPrompt] = useState('');
            const [generating, setGenerating] = useState(false);
            const [zoom, setZoom] = useState(0.35);
            const [pages, setPages] = useState([[]]);
            const [activePage, setActivePage] = useState(0);
            const [selObj, setSelObj] = useState(null);
            const [projects, setProjects] = useState([]);
            const [showProjects, setShowProjects] = useState(false);
            const [exportMsg, setExportMsg] = useState('');
            const [activeTemplate, setActiveTemplate] = useState(null);

            const size = FG_SIZES[creativeType] || FG_SIZES['Post'];
            const isCarrossel = creativeType === 'Carrossel';

            /* Init / resize Fabric canvas */
            useEffect(() => {
                if (!canvasRef.current) return;
                if (fabricRef.current) { fabricRef.current.dispose(); }
                if (!window.fabric) return;
                const fc = new window.fabric.Canvas(canvasRef.current, {
                    width: size.w,
                    height: size.h,
                    backgroundColor: '#1a1a2e',
                    preserveObjectStacking: true,
                });
                fabricRef.current = fc;
                fc.on('selection:created', e => setSelObj(e.selected?.[0] || null));
                fc.on('selection:updated', e => setSelObj(e.selected?.[0] || null));
                fc.on('selection:cleared', () => setSelObj(null));
                fc.on('object:modified', () => setSelObj(fc.getActiveObject() || null));
                /* restore page objects */
                const saved = pages[activePage];
                if (saved && saved.length) {
                    window.fabric.util.enlivenObjects(saved, objs => {
                        objs.forEach(o => fc.add(o));
                        fc.renderAll();
                    });
                }
                return () => { fc.dispose(); fabricRef.current = null; };
            }, [creativeType, activePage]);

            /* Save page state before switching */
            const savePage = () => {
                if (!fabricRef.current) return;
                const json = fabricRef.current.getObjects().map(o => o.toObject(['id','kind']));
                setPages(prev => { const n = [...prev]; n[activePage] = json; return n; });
            };

            const switchPage = (idx) => {
                savePage();
                setActivePage(idx);
            };

            const addPage = () => {
                savePage();
                setPages(prev => [...prev, []]);
                setActivePage(pages.length);
            };

            /* Apply template */
            const applyTemplate = (tpl) => {
                if (!fabricRef.current || !window.fabric) return;
                const fc = fabricRef.current;
                fc.clear();
                fc.backgroundColor = tpl.bg || '#1a1a2e';
                tpl.objects.forEach(o => {
                    if (o.kind === 'rect') {
                        const r = new window.fabric.Rect({ left: o.left, top: o.top, width: o.width, height: o.height, fill: o.fill, rx: o.rx || 0, ry: o.rx || 0, selectable: true });
                        fc.add(r);
                    } else if (o.kind === 'text') {
                        const t = new window.fabric.IText(o.text, { left: o.left, top: o.top, fontSize: o.fontSize || 40, fill: o.fill || '#fff', fontWeight: o.fontWeight || 'normal', textAlign: o.textAlign || 'left', originX: o.originX || 'left', selectable: true });
                        fc.add(t);
                    }
                });
                fc.renderAll();
                setActiveTemplate(tpl.id);
            };

            /* AI generate (mock: fills template with prompt text) */
            const handleGenerate = async () => {
                if (!prompt.trim()) return;
                setGenerating(true);
                await new Promise(r => setTimeout(r, 1200));
                const tpl = FG_TEMPLATES.find(t => t.type === creativeType) || FG_TEMPLATES[0];
                applyTemplate(tpl);
                if (!fabricRef.current || !window.fabric) { setGenerating(false); return; }
                const fc = fabricRef.current;
                const textObjs = fc.getObjects('i-text');
                if (textObjs[0]) textObjs[0].set('text', prompt.slice(0, 60));
                if (textObjs[1]) textObjs[1].set('text', store.clients.find(c => c.id === clientId)?.name || 'Neos Digital');
                fc.renderAll();
                setGenerating(false);
            };

            /* Add text object */
            const addText = () => {
                if (!fabricRef.current || !window.fabric) return;
                const t = new window.fabric.IText('Clique para editar', { left: size.w / 2, top: size.h / 2, originX: 'center', originY: 'center', fontSize: 48, fill: '#ffffff', fontWeight: 'bold' });
                fabricRef.current.add(t);
                fabricRef.current.setActiveObject(t);
                fabricRef.current.renderAll();
            };

            /* Add image from file */
            const addImage = (e) => {
                const file = e.target.files[0];
                if (!file || !window.fabric) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    window.fabric.Image.fromURL(ev.target.result, img => {
                        const scale = Math.min(size.w * 0.6 / img.width, size.h * 0.6 / img.height);
                        img.scale(scale);
                        img.set({ left: size.w / 2, top: size.h / 2, originX: 'center', originY: 'center' });
                        fabricRef.current.add(img);
                        fabricRef.current.setActiveObject(img);
                        fabricRef.current.renderAll();
                    });
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            /* Add color rect */
            const addRect = () => {
                if (!fabricRef.current || !window.fabric) return;
                const r = new window.fabric.Rect({ left: 100, top: 100, width: 300, height: 200, fill: 'rgba(255,0,64,0.7)', rx: 12, ry: 12 });
                fabricRef.current.add(r);
                fabricRef.current.setActiveObject(r);
                fabricRef.current.renderAll();
            };

            /* Delete selected */
            const deleteSelected = () => {
                const fc = fabricRef.current;
                if (!fc) return;
                const obj = fc.getActiveObject();
                if (obj) { fc.remove(obj); fc.renderAll(); setSelObj(null); }
            };

            /* Export PNG */
            const exportPNG = async () => {
                if (!fabricRef.current) return;
                if (isCarrossel) {
                    savePage();
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: [size.w, size.h] });
                    for (let i = 0; i < pages.length; i++) {
                        if (i > 0) pdf.addPage([size.w, size.h]);
                        const fc2 = new window.fabric.StaticCanvas(null, { width: size.w, height: size.h, backgroundColor: '#1a1a2e' });
                        await new Promise(res => {
                            if (!pages[i] || !pages[i].length) { res(); return; }
                            window.fabric.util.enlivenObjects(pages[i], objs => { objs.forEach(o => fc2.add(o)); fc2.renderAll(); res(); });
                        });
                        const dataUrl = fc2.toDataURL({ format: 'jpeg', quality: 0.92 });
                        pdf.addImage(dataUrl, 'JPEG', 0, 0, size.w, size.h);
                        fc2.dispose();
                    }
                    pdf.save('flowgram-carrossel.pdf');
                    setExportMsg('PDF exportado!');
                } else {
                    const dataUrl = fabricRef.current.toDataURL({ format: 'png', multiplier: 1 });
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = `flowgram-${creativeType.toLowerCase()}.png`;
                    a.click();
                    setExportMsg('PNG exportado!');
                }
                setTimeout(() => setExportMsg(''), 2500);
            };

            /* Save project to IndexedDB */
            const saveProject = async () => {
                savePage();
                const proj = {
                    id: 'fg_' + Date.now(),
                    name: (store.clients.find(c => c.id === clientId)?.name || 'Sem cliente') + ' — ' + creativeType,
                    type: creativeType, clientId,
                    pages: JSON.stringify(pages),
                    bg: fabricRef.current?.backgroundColor || '#1a1a2e',
                    createdAt: new Date().toISOString(),
                };
                await db.flowgramProjects.put(proj);
                setExportMsg('Projeto salvo!');
                setTimeout(() => setExportMsg(''), 2000);
            };

            /* Load projects */
            const loadProjects = async () => {
                const all = await db.flowgramProjects.toArray();
                setProjects(all.reverse());
                setShowProjects(true);
            };

            /* Load a saved project */
            const loadProject = async (proj) => {
                setCreativeType(proj.type);
                setClientId(proj.clientId || '');
                const pgs = JSON.parse(proj.pages || '[[]]');
                setPages(pgs);
                setActivePage(0);
                setShowProjects(false);
            };

            /* Prop panel helpers */
            const setProp = (key, val) => {
                if (!selObj) return;
                selObj.set(key, val);
                fabricRef.current?.renderAll();
                setSelObj(Object.assign(Object.create(Object.getPrototypeOf(selObj)), selObj));
            };

            const isText = selObj && (selObj.type === 'i-text' || selObj.type === 'text');
            const isImg  = selObj && selObj.type === 'image';
            const isRect = selObj && selObj.type === 'rect';

            /* canvas wrapper scale to fit panel */
            const PANEL_W = 680;
            const dispW = size.w * zoom;

        /* ── PERFORMANCE ─────────────────────────────────────── */
        /* ══ MÓDULOS DE GESTÃO OPERACIONAL ══════════════════════ */
        const _USER_MAP = { 'Arthur Lemos':'arthur','Lavinia Wallery':'lavinia','Miguel Lemos':'miguel','Caio':'caio','Funcionário':'funcionario' };
        const _toUserId = n => _USER_MAP[n] || (n||'').toLowerCase().split(' ')[0] || '';
        const _ADMIN_IDS = ['arthur', 'lavinia'];

        const _calcIPC = (client, store) => {
            const cId = client.id, cNm = (client.name||'').toLowerCase();
            const calItms = (store.calEvents||[]).filter(ev => ev.clientId===cId || (ev.clientName||'').toLowerCase()===cNm);
            const clLeads = (store.leads||[]).filter(l => l.clientId===cId || (l.company||'').toLowerCase()===cNm);
            const liIds = clLeads.map(l=>l.id);
            const liacts = (store.leadInteractions||[]).filter(li => liIds.includes(li.leadId));
            const clTasks = (store.tasks||[]).filter(t => t.clientId===cId && t.status==='Concluído');
            const allMs = [
                ...liacts.map(i => new Date(i.createdAt||i.date+'T12:00').getTime()),
                ...calItms.map(e => new Date(e.date+'T12:00').getTime()),
                ...clTasks.map(t => new Date(t.modifiedAt||t.createdAt).getTime()),
            ].filter(n => n && !isNaN(n));
            const lastMs = allMs.length ? Math.max(...allMs) : 0;
            const daysSince = lastMs ? Math.floor((Date.now()-lastMs)/86400000) : 999;
            let s = 0;
            if (daysSince<=3) s+=20; else if (daysSince<=7) s+=10;
            const mtgMs = calItms.filter(e=>e.type==='Reunião'||(e.title||'').toLowerCase().includes('reuni')).map(e=>new Date(e.date+'T12:00').getTime()).filter(n=>!isNaN(n));
            const lastMtg = mtgMs.length ? Math.max(...mtgMs) : 0;
            const daysMtg = lastMtg ? Math.floor((Date.now()-lastMtg)/86400000) : 999;
            if (daysMtg<=30) s+=20; else if (daysMtg<=60) s+=10;
            if (daysSince<=7) s+=10; else if (daysSince>30) s-=10;
            const fin = (store.financials||[]).filter(f=>f.clientId===cId);
            if (fin.some(f=>f.status==='Atrasado')) s-=20; else if (fin.some(f=>f.status==='Pago')) s+=20;
            if (clLeads.some(l=>l.status==='Fechado Ganho')) s+=10;
            return { score: Math.max(0,Math.min(100,s)), daysSince };
        };
        const _ipcClass = s => s>=90?{label:'Embaixador',color:'#4090ff'}:s>=70?{label:'Saudável',color:'#00c864'}:s>=50?{label:'Atenção',color:'#ffcc00'}:{label:'Risco',color:'#ff4060'};

        const _calcPerfScore = (uName, store) => {
            const tasks = (store.tasks||[]).filter(t=>t.assignee===uName);
            if (!tasks.length) return 50;
            let s = 50;
            const now = Date.now();
            tasks.forEach(t => {
                if (t.status==='Concluído') {
                    if (t.dueDate) { const due=new Date(t.dueDate+'T23:59:59').getTime(), done=new Date(t.modifiedAt||t.createdAt).getTime(); if (due-done>86400000) s+=15; else if (done<=due) s+=10; else s-=15; }
                    else s+=10;
                } else if (t.dueDate && now>new Date(t.dueDate+'T23:59:59').getTime()) s-=15;
            });
            if (!(store.taskTimers||[]).some(t=>t.userName===uName&&t.totalMs>0)) s-=20;
            return Math.max(0,Math.min(100,Math.round(s)));
        };
        const _perfClass = s => s>=90?{label:'Excelente 🏆',color:'#4090ff'}:s>=70?{label:'Bom 🟢',color:'#00c864'}:s>=50?{label:'Regular 🟡',color:'#ffcc00'}:{label:'Abaixo do Esperado 🔴',color:'#ff4060'};

        const _calcReliability = (uName, store) => {
            let pts = 0;
            const tasks=(store.tasks||[]).filter(t=>t.assignee===uName);
            const done=tasks.filter(t=>t.status==='Concluído');
            const onTime=done.filter(t=>!t.dueDate||new Date(t.modifiedAt||Date.now())<=new Date(t.dueDate+'T23:59:59'));
            if (tasks.length) pts+=Math.round((onTime.length/tasks.length)*40);
            if ((store.taskTimers||[]).some(t=>t.userName===uName&&t.totalMs>0)) pts+=25;
            const recent=tasks.filter(t=>(Date.now()-new Date(t.modifiedAt||t.createdAt).getTime())<7*86400000);
            if (tasks.length) pts+=Math.round((recent.length/tasks.length)*20);
            if ((store.leadInteractions||[]).some(li=>(li.modifiedBy||'')==uName)) pts+=15;
            return Math.min(100,pts);
        };
        const _relClass = s => s>=90?{label:'Extremamente Confiável',color:'#4090ff'}:s>=80?{label:'Confiável',color:'#00c864'}:s>=60?{label:'Atenção',color:'#ffcc00'}:{label:'Necessita Gestão',color:'#ff4060'};

        /* ── Timer Meta Modal ── */
        function TimerMetaModal({ onClose, currentMeta, userId }) {
            const [daily,setDaily]=useState(String(currentMeta?.dailyGoalHours||6));
            const [weekly,setWeekly]=useState(String(currentMeta?.weeklyGoalHours||30));
            const [saving,setSaving]=useState(false);
            const save = async () => {
                setSaving(true);
                const meta = { id:currentMeta?.id||genId(), userId, dailyGoalHours:parseFloat(daily)||6, weeklyGoalHours:parseFloat(weekly)||30, createdAt:currentMeta?.createdAt||new Date().toISOString(), updatedAt:new Date().toISOString() };

                setSaving(false); onClose(meta);

                    </div>

        /* ── MINI CALENDAR ──────────────────────────────────── */
        function MiniCalendar() {
            const { store, setView, setCalFocusDate } = useApp();
            const calEvs = store.calEvents || [];
            const kTasks = (store.tasks || []).filter(t => t.dueDate && t.status !== 'Concluído' && !t.fromCalendar);
            const today = new Date();
            const [mth, setMth] = useState(today.getMonth());
            const [yr, setYr] = useState(today.getFullYear());
            const evDays = new Set(calEvs.filter(e => { const d = new Date(e.date + 'T12:00'); return d.getMonth() === mth && d.getFullYear() === yr; }).map(e => new Date(e.date + 'T12:00').getDate()));
            const tkDays = new Set(kTasks.filter(t => { const d = new Date(t.dueDate + 'T12:00'); return d.getMonth() === mth && d.getFullYear() === yr; }).map(t => new Date(t.dueDate + 'T12:00').getDate()));
            const first = new Date(yr, mth, 1).getDay();
            const dim = new Date(yr, mth + 1, 0).getDate();
            const cells = [...Array(first).fill(null), ...Array.from({ length: dim }, (_, i) => i + 1)];
            return (
                <div style={{ padding: '8px 6px 4px', borderTop: '1px solid rgba(255,255,255,.05)', marginTop: 4 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 5, paddingLeft: 2, paddingRight: 2 }}>
                        <button onClick={() => { if (mth === 0) { setMth(11); setYr(y => y - 1); } else setMth(m => m - 1); }} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.35)', cursor: 'pointer', padding: '1px 5px', fontSize: 14, lineHeight: 1 }}>&#8249;</button>
                        <span onClick={() => setView('calendar')} style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,.45)', cursor: 'pointer', letterSpacing: .3 }}>{MESES_SHORT[mth]} {yr}</span>
                        <button onClick={() => { if (mth === 11) { setMth(0); setYr(y => y + 1); } else setMth(m => m + 1); }} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.35)', cursor: 'pointer', padding: '1px 5px', fontSize: 14, lineHeight: 1 }}>&#8250;</button>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)' }}>
                        {['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((d, i) => <div key={i} style={{ textAlign: 'center', fontSize: 8, color: 'rgba(255,255,255,.2)', fontWeight: 700, paddingBottom: 2 }}>{d}</div>)}
                        {cells.map((day, i) => {
                            const isT = day && day === today.getDate() && mth === today.getMonth() && yr === today.getFullYear();
                            const hasEv = day && (evDays.has(day) || tkDays.has(day));
                            return (
                                <div key={i} onClick={() => { if (!day) return; const ds = `${yr}-${String(mth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; setCalFocusDate(ds); setView('calendar'); }}
                                    style={{ textAlign: 'center', fontSize: 9, cursor: day ? 'pointer' : 'default', padding: '2px 0', borderRadius: 3, color: isT ? '#ff4060' : day ? 'rgba(255,255,255,.45)' : 'transparent', fontWeight: isT ? 700 : 400, background: isT ? 'rgba(255,0,64,.14)' : 'transparent', lineHeight: 1.3 }}>
                                    {day || ''}
                                    {hasEv && <div style={{ width: 3, height: 3, background: isT ? '#ff4060' : 'rgba(255,0,64,.65)', borderRadius: '50%', margin: '1px auto 0' }} />}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        /* ── EVENT MODAL ─────────────────────────────────────── */
        function EventModal({ ev, defaultDate, onClose }) {
            const { store, addCalEvent, editCalEvent } = useApp();
            const EV_COLORS = ['#ff0040', '#a060ff', '#4090ff', '#00c864', '#ffcc00', '#E1306C', '#69C9D0', '#ff8030'];
            const [f, setF] = useState(ev ? { ...ev } : { title: '', date: defaultDate || new Date().toISOString().split('T')[0], startTime: '09:00', endTime: '10:00', allDay: false, type: 'event', color: '#ff0040', clientId: '', clientCustomName: '', desc: '', category: '', responsavel: '', done: false });
            const [calImgs, setCalImgs] = useState(() => { try { return ev?.images ? JSON.parse(ev.images) : []; } catch { return []; } });
            const [imgUploading, setImgUploading] = useState(false);
            const s = (k, v) => setF(p => ({ ...p, [k]: v }));

            const compressCalImg = (file, maxDim = 800, quality = 0.70) => new Promise(resolve => {
                const r = new FileReader();
                r.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.naturalWidth, h = img.naturalHeight;
                        const scale = Math.min(maxDim / w, maxDim / h, 1);
                        w = Math.round(w * scale); h = Math.round(h * scale);
                        const c = document.createElement('canvas'); c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                r.readAsDataURL(file);
            });

            const handleImgUpload = async e => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                setImgUploading(true);
                const newImgs = [];
                for (const file of files) {
                    const data = await compressCalImg(file);
                    newImgs.push({ id: Date.now() + Math.random(), name: file.name, data, createdAt: new Date().toISOString() });
                }
                setCalImgs(p => [...p, ...newImgs]);
                setImgUploading(false);
                e.target.value = '';
            };

            const removeCalImg = id => setCalImgs(p => p.filter(i => i.id !== id));

            const downloadCalImg = img => {
                const a = document.createElement('a');
                a.href = img.data;
                a.download = img.name || 'imagem.jpg';
                a.click();
            };

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in" style={{ maxWidth: 480 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                            <h3 style={{ fontSize: 15, fontWeight: 700 }}>{ev ? 'Editar Evento' : 'Novo Evento'}</h3>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer' }}><Ic n="x" s={16} /></button>
                        </div>
                        <form onSubmit={e => { e.preventDefault(); if (!f.title.trim()) return; const cl = f.clientId && f.clientId !== '__outro__' ? store.clients.find(c => c.id === f.clientId) : null; const derivedName = f.clientId === '__outro__' ? (f.clientCustomName || '') : (cl?.name || ''); const data = { ...f, clientName: derivedName, images: JSON.stringify(calImgs) }; ev ? editCalEvent(ev.id, data) : addCalEvent(data); onClose(); }} style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
                            <input className="input-field" placeholder="Título *" value={f.title} onChange={e => s('title', e.target.value)} required autoFocus />
                            <div style={{ display: 'flex', gap: 8 }}>
                                <div style={{ flex: 1 }}><div style={{ fontSize: 11, color: 'rgba(255,255,255,.38)', marginBottom: 4 }}>Data</div><input className="input-field" type="date" value={f.date} onChange={e => s('date', e.target.value)} required /></div>
                                <div><div style={{ fontSize: 11, color: 'rgba(255,255,255,.38)', marginBottom: 4 }}>Tipo</div>
                                    <select className="input-field" value={f.type} onChange={e => s('type', e.target.value)}>
                                        {['event', 'task', 'reminder', 'meeting'].map(t => <option key={t} value={t}>{{ event: 'Evento', task: 'Tarefa', reminder: 'Lembrete', meeting: 'Reunião' }[t]}</option>)}
                                    </select>
                                </div>
                            </div>
                            <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 12, color: 'rgba(255,255,255,.6)' }}>
                                <input type="checkbox" checked={f.allDay} onChange={e => s('allDay', e.target.checked)} style={{ accentColor: '#ff0040' }} /> Dia todo
                            </label>

        function exportExcelCalendario(evs, tasks, month, year, clientName) {
            if (typeof XLSX === 'undefined') { alert('Biblioteca de Excel não carregada. Verifique sua conexão e recarregue a página.'); return; }
            const DOW = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            const rows = [...evs.map(e => ({ ...e, _task: false })), ...tasks.map(t => ({ ...t, _task: true }))]
                .sort((a, b) => (a.date || a.dueDate || '').localeCompare(b.date || b.dueDate || ''));
            const header = ['Data', 'Dia da Semana', 'Tipo', 'Título', 'Cliente', 'Responsável', 'Horário Início', 'Horário Fim', 'Dia Todo', 'Status', 'Descrição'];
            const aoa = [header];
            rows.forEach(r => {
                const ds = r.date || r.dueDate || '';
                const d = ds ? new Date(ds + 'T12:00') : null;
                const tipo = r._task ? 'Tarefa' : (r.type === 'event' ? 'Evento' : (r.type || 'Evento'));
                const status = r._task ? (r.status || '') : (r.done ? 'Concluído' : 'Pendente');
                aoa.push([
                    ds, d ? DOW[d.getDay()] : '', tipo, r.title || '', r.clientName || '',
                    r.responsavel || r.assignee || '', r._task ? '' : (r.startTime || ''), r._task ? '' : (r.endTime || ''),
                    r._task ? '' : (r.allDay ? 'Sim' : 'Não'), status, r.desc || r.description || ''
                ]);
            });
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!cols'] = [{ wch: 11 }, { wch: 11 }, { wch: 9 }, { wch: 36 }, { wch: 22 }, { wch: 16 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 11 }, { wch: 50 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Calendário');
            XLSX.writeFile(wb, 'calendario-' + (clientName || 'geral').replace(/[^a-z0-9]/gi, '-') + '-' + MESES_SHORT[month] + year + '.xlsx');
        }

            const [focus, setFocus] = useState(() => calFocusDate ? new Date(calFocusDate + 'T12:00') : new Date(today.getFullYear(), today.getMonth(), today.getDate()));

            const [xlsLoad, setXlsLoad] = useState(false);

            const [gcClientId, setGcClientId] = useState(() => localStorage.getItem('gcClientId') || '');
            const [gcToken, setGcToken] = useState(null);
            const [gcSync, setGcSync] = useState(false);
            const [gcSetup, setGcSetup] = useState(false);
            const [gcIdInput, setGcIdInput] = useState(gcClientId);
            const [showTextAdd, setShowTextAdd] = useState(false);
            const [textInput, setTextInput] = useState('');
            const [bulkMode, setBulkMode] = useState(false);
            const [bulkSel, setBulkSel] = useState(new Set());
            const [bulkResp, setBulkResp] = useState('');
            const [dayMenu, setDayMenu] = useState(null);

            useEffect(() => { if (calFocusDate) setFocus(new Date(calFocusDate + 'T12:00')); }, [calFocusDate]);

            const _normStr = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
            const _findClient = name => {
                if (!name) return null;
                const clients = store.clients || [];
                const q = _normStr(name);
                // 1. match exato
                let m = clients.find(c => _normStr(c.name) === q);
                // 2. um contém o outro
                if (!m) m = clients.find(c => { const n = _normStr(c.name); return n.includes(q) || q.includes(n); });
                // 3. qualquer palavra com 3+ caracteres coincide
                if (!m) { const words = q.split(' ').filter(w => w.length >= 3); if (words.length) m = clients.find(c => words.some(w => _normStr(c.name).includes(w))); }
                return m || null;
            };
            const parseOneEvent = block => {
                const ev = { title: '', date: '', type: 'Reunião', desc: '', clientName: '', clientId: '' };
                const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
                for (const line of lines) {
                    const lower = line.toLowerCase();
                    const val = line.split(':').slice(1).join(':').trim();
                    if (lower.startsWith('título:') || lower.startsWith('titulo:')) ev.title = val;

                                <button onClick={async () => { setExportMenu(null); setPdfLoad(true); const { mEvs, mTks, clientName } = getMonthExportData(); await gerarPDFCalendario(mEvs, mTks, focus.getMonth(), focus.getFullYear(), clientName); setPdfLoad(false); }} style={{ display: 'block', width: '100%', padding: '8px 14px', background: 'none', border: 'none', color: 'rgba(255,255,255,.8)', cursor: 'pointer', textAlign: 'left', fontSize: 12 }}>📄 PDF</button>

                                <button onClick={() => { setExportMenu(null); setXlsLoad(true); const { mEvs, mTks, clientName } = getMonthExportData(); exportExcelCalendario(mEvs, mTks, focus.getMonth(), focus.getFullYear(), clientName); setXlsLoad(false); }} style={{ display: 'block', width: '100%', padding: '8px 14px', background: 'none', border: 'none', color: 'rgba(255,255,255,.8)', cursor: 'pointer', textAlign: 'left', fontSize: 12 }}>📊 EXCEL</button>

                    {dayMenu && (
                        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 998 }} onClick={() => setDayMenu(null)}>

                                <div style={{ height: 1, background: 'rgba(255,255,255,.07)', margin: '3px 0' }} />
                                <button onClick={() => { if (!confirm(`Excluir ${dayMenu.items.length} item(s) de ${dayMenu.ds}?`)) return; dayMenu.items.forEach(ev => { if (ev._task) deleteTask(ev.id); else deleteCalEvent(ev.id); }); setDayMenu(null); }} style={{ display: 'block', width: '100%', padding: '8px 14px', background: 'none', border: 'none', color: '#ff6060', cursor: 'pointer', textAlign: 'left', fontSize: 12 }}>🗑 Excluir todos do dia</button>
                            </div>

                    )}
                    {showTextAdd && (
                        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowTextAdd(false)}>

                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                                    <h3 style={{ fontSize: 15, fontWeight: 700 }}>Adicionar via Texto</h3>

                                    <strong style={{ color: 'rgba(255,255,255,.55)' }}>Formato (separe múltiplos eventos com linha em branco):</strong><br />
                                    Título: Nome do evento<br />
                                    Data: DD/MM/AAAA<br />
                                    Tipo: Reunião | Entrega | Prazo | Outro<br />

        /* ══ CARGA DIÁRIA (subaba do Calendário) ══════════════════════
           Módulo isolado: nunca cria/duplica eventos do Calendário.
           Vínculo com eventos existentes acontece só via dailyTaskLinks. ── */
        const DAILY_STATUS = ['Não iniciada', 'Em andamento', 'Aguardando revisão', 'Concluída'];
        const DAILY_PCOL = { Baixa: '#4090ff', Média: '#ffcc00', Alta: '#ff8020', Urgente: '#ff0040' };
        const DAILY_SCOL = { 'Não iniciada': '#999', 'Em andamento': '#4090ff', 'Aguardando revisão': '#c060ff', 'Concluída': '#00c864' };
        const dailyGreeting = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };
        const _dailyIsOverdue = t => !!t.dueDate && t.dueDate < new Date().toISOString().slice(0, 10) && t.status !== 'Concluída';
        const _dailyInScope = (t, scope) => {
            if (scope === 'todos') return true;
            if (!t.dueDate) return false;
            const today = new Date().toISOString().slice(0, 10);
            if (scope === 'hoje') return t.dueDate === today;
            const now = new Date();
            const d = new Date(t.dueDate + 'T12:00');
            if (scope === 'semana') {
                const ws = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
                const we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6, 23, 59, 59);
                return d >= ws && d <= we;
            }
            if (scope === 'mes') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            return true;
        };

        /* ── NOVA/EDITAR TAREFA ── */
        function DailyTaskModal({ task, defaultAssignee, defaultDate, onClose }) {
            const { addDailyTask, editDailyTask, store, addNotif } = useApp();
            const [f, setF] = useState(task || { title: '', desc: '', clientId: '', clientName: '', assignee: defaultAssignee || '', priority: 'Média', status: 'Não iniciada', dueDate: defaultDate || '', dueTime: '', estimatedHours: '', spentHours: '' });
            const s = (k, v) => setF(p => ({ ...p, [k]: v }));
            const sub = e => {
                e.preventDefault();
                if (!f.title.trim()) return;
                const cl = store.clients.find(c => c.id === f.clientId);
                const data = { ...f, clientName: cl?.name || f.clientName };
                const prevAssignee = task?.assignee;
                task ? editDailyTask(task.id, data) : addDailyTask(data);
                if (f.assignee && f.assignee !== prevAssignee) addNotif(_toUserId(f.assignee), 'task_assigned', 'Nova tarefa na Carga Diária', `Você foi definido como responsável por "${f.title}"`, '', 'task');
                onClose();
            };
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 22 }}>
                            <h2 style={{ fontSize: 18, fontWeight: 700 }}>{task ? 'Editar Tarefa' : '+ Nova Tarefa'}</h2>
                            <button className="btn-secondary" onClick={onClose} style={{ padding: '5px 9px' }}><Ic n="x" s={14} /></button>
                        </div>
                        <form onSubmit={sub}>
                            <div style={{ marginBottom: 14 }}><L>Título *</L><input className="input-field" value={f.title} onChange={e => s('title', e.target.value)} required autoFocus /></div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                                <div><L>Cliente</L>
                                    <select className="input-field" value={f.clientId} onChange={e => s('clientId', e.target.value)}>
                                        <option value="">Sem cliente</option>
                                        {store.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div><L>Responsável</L>
                                    <select className="input-field" value={f.assignee} onChange={e => s('assignee', e.target.value)}>
                                        <option value="">Sem responsável</option>
                                        {TEAM.map(v => <option key={v}>{v}</option>)}
                                    </select>
                                </div>
                                <div><L>Prioridade</L>
                                    <select className="input-field" value={f.priority} onChange={e => s('priority', e.target.value)}>
                                        {Object.keys(DAILY_PCOL).map(v => <option key={v}>{v}</option>)}
                                    </select>
                                </div>
                                <div><L>Status</L>
                                    <select className="input-field" value={f.status} onChange={e => s('status', e.target.value)}>

        /* ── ANEXOS (IndexedDB local — mesmo padrão de finComprovantes, evita egress de binários) ── */
        function DailyTaskAttachments({ taskId }) {
            const me = (() => { try { return JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); } catch { return null; } })();
            const [list, setList] = useState([]);
            const [uploading, setUploading] = useState(false);
            const fileRef = useRef();
            const load = () => { db.dailyTaskAttachments.where('taskId').equals(taskId).toArray().then(r => setList(r.sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt)))); };
            useEffect(() => { load(); }, [taskId]);
            const fmtSize = b => b < 1024 * 1024 ? (b / 1024).toFixed(1) + ' KB' : (b / 1024 / 1024).toFixed(2) + ' MB';
            const handleFile = async e => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 25 * 1024 * 1024) { alert('Arquivo muito grande. Máximo 25 MB.'); return; }
                setUploading(true);
                try {
                    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.onerror = rej; r.readAsDataURL(file); });
                    await db.dailyTaskAttachments.put({ id: genId(), taskId, name: file.name, size: file.size, type: file.type, uploadedAt: new Date().toISOString(), uploadedBy: me?.name || 'Usuário', data });
                    load();
                } catch (err) { alert('Erro ao anexar arquivo.'); }
                setUploading(false);
                e.target.value = '';
            };
            const downloadItem = item => { const a = document.createElement('a'); a.href = item.data; a.download = item.name; a.click(); };
            const removeItem = async id => { if (!confirm('Remover este anexo?')) return; await db.dailyTaskAttachments.delete(id); load(); };
            return (
                <div>
                    <input ref={fileRef} type="file" style={{ display: 'none' }} onChange={handleFile} />
                    <button type="button" className="btn-secondary" onClick={() => fileRef.current?.click()} disabled={uploading} style={{ marginBottom: 10 }}>
                        <Ic n="paperclip" s={13} /> {uploading ? 'Enviando...' : 'Anexar Arquivo'}
                    </button>
                    {list.length === 0 ? (
                        <div style={{ fontSize: 12, color: 'rgba(255,255,255,.3)', padding: '4px 0 8px' }}>Nenhum anexo ainda.</div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                            {list.map(item => (
                                <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.08)', borderRadius: 7, padding: '7px 10px' }}>
                                    <span style={{ flex: 1, fontSize: 12, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.name}</span>
                                    <span style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', flexShrink: 0 }}>{fmtSize(item.size)}</span>
                                    <button type="button" onClick={() => downloadItem(item)} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer', padding: 2 }}><Ic n="download" s={12} /></button>
                                    <button type="button" onClick={() => removeItem(item.id)} style={{ background: 'none', border: 'none', color: '#ff6070', cursor: 'pointer', padding: 2 }}><Ic n="trash" s={12} /></button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        /* ── VISUALIZAÇÃO SEMANAL ── */
        function DailyWeeklyView({ tasks, onDayClick }) {
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);
            const ws = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay());
            const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return d; });
            const labels = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            return (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 8 }}>
                    {days.map((d, i) => {
                        const ds = d.toISOString().slice(0, 10);
                        const ct = tasks.filter(t => t.dueDate === ds);
                        const isT = ds === todayStr;
                        return (
                            <div key={i} onClick={() => onDayClick(ds, ct)} className="glass glass-hover" style={{ padding: '14px 8px', textAlign: 'center', cursor: 'pointer', borderColor: isT ? 'rgba(255,0,64,.35)' : undefined }}>
                                <div style={{ fontSize: 10.5, fontWeight: 700, color: isT ? '#ff4060' : 'rgba(255,255,255,.4)', textTransform: 'uppercase', letterSpacing: .5 }}>{labels[i]}</div>
                                <div style={{ fontSize: 10, color: 'rgba(255,255,255,.3)', marginBottom: 6 }}>{d.getDate()}</div>
                                <div style={{ fontSize: 22, fontWeight: 800, color: ct.length ? '#fff' : 'rgba(255,255,255,.2)' }}>{ct.length}</div>
                                <div style={{ fontSize: 9.5, color: 'rgba(255,255,255,.3)' }}>tarefa{ct.length !== 1 ? 's' : ''}</div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        /* ── PÁGINA PRINCIPAL DA CARGA DIÁRIA ── */
        function DailyLoadPage({ goToEvent }) {
            const { store, editDailyTask } = useApp();
            const me = (() => { try { return JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); } catch { return null; } })();
            const myName = me?.name || '';
            const tasks = store.dailyTasks || [];
            const [showAdd, setShowAdd] = useState(false);
            const [showFromCal, setShowFromCal] = useState(false);
            const [detailTask, setDetailTask] = useState(null);
            const [editTask, setEditTask] = useState(null);
            const [viewingUser, setViewingUser] = useState(null);
            const [mode, setMode] = useState('lista');
            const [showAllTasks, setShowAllTasks] = useState(false);
            const [dayModal, setDayModal] = useState(null);
            const [dragging, setDragging] = useState(null);
            const [dragOverUser, setDragOverUser] = useState(null);

            const [dateScope, setDateScope] = useState('todos');
            const [statusQuick, setStatusQuick] = useState('todas');
            const [filtClient, setFiltClient] = useState('');
            const [filtResp, setFiltResp] = useState('');
            const [filtPrior, setFiltPrior] = useState('');

            const today = new Date().toISOString().slice(0, 10);
            const myTasks = tasks.filter(t => t.assignee === myName);
            const myStats = {
                total: myTasks.length,
                done: myTasks.filter(t => t.status === 'Concluída').length,
                andamento: myTasks.filter(t => t.status === 'Em andamento').length,
                revisao: myTasks.filter(t => t.status === 'Aguardando revisão').length,
                atrasadas: myTasks.filter(t => _dailyIsOverdue(t)).length,
            };
            const globalStats = {
                total: tasks.length,
                done: tasks.filter(t => t.status === 'Concluída').length,
                andamento: tasks.filter(t => t.status === 'Em andamento').length,
                revisao: tasks.filter(t => t.status === 'Aguardando revisão').length,
                atrasadas: tasks.filter(t => _dailyIsOverdue(t)).length,
                semResp: tasks.filter(t => !t.assignee).length,
            };

            const applyFilters = list => list
                .filter(t => _dailyInScope(t, dateScope))
                .filter(t => {
                    if (statusQuick === 'todas') return true;
                    if (statusQuick === 'atrasadas') return _dailyIsOverdue(t);
                    if (statusQuick === 'sem_resp') return !t.assignee;
                    if (statusQuick === 'concluidas') return t.status === 'Concluída';
                    if (statusQuick === 'andamento') return t.status === 'Em andamento';
                    if (statusQuick === 'nao_iniciada') return t.status === 'Não iniciada';
                    if (statusQuick === 'revisao') return t.status === 'Aguardando revisão';
                    return true;
                })
                .filter(t => !filtClient || t.clientId === filtClient)
                .filter(t => !filtResp || t.assignee === filtResp)
                .filter(t => !filtPrior || t.priority === filtPrior);

            const minhaCargaList = applyFilters(myTasks).sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
            const allFilteredList = applyFilters(tasks).sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
            const venceHoje = tasks.filter(t => t.dueDate === today && t.status !== 'Concluída').sort((a, b) => (a.dueTime || '').localeCompare(b.dueTime || ''));

            const teamCards = TEAM.map(name => {
                const ut = tasks.filter(t => t.assignee === name);
                const doneCt = ut.filter(t => t.status === 'Concluída').length;
                return { name, total: ut.length, done: doneCt, pct: ut.length ? Math.round((doneCt / ut.length) * 100) : 0 };
            });

            const dropOnUser = name => {
                if (dragging) editDailyTask(dragging.id, { assignee: name });
                setDragging(null); setDragOverUser(null);
            };

            return (
                <div className="fade-in">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18, flexWrap: 'wrap', gap: 10 }}>
                        <div>
                            <h1 style={{ fontSize: 21, fontWeight: 700 }}>{dailyGreeting()}, {myName.split(' ')[0] || 'time'}</h1>
                            <p style={{ fontSize: 13, color: 'rgba(255,255,255,.38)', marginTop: 3 }}>
                                Hoje você possui: {myStats.total} tarefas · {myStats.done} concluídas · {myStats.andamento} em andamento · {myStats.revisao} aguardando revisão · {myStats.atrasadas} atrasadas
                            </p>
                        </div>
                        <div style={{ display: 'flex', gap: 8 }}>
                            <button className="btn-secondary" onClick={() => setShowFromCal(true)}><Ic n="cal" s={14} /> Adicionar do Calendário</button>
                            <button className="btn-primary" onClick={() => setShowAdd(true)}><Ic n="plus" s={15} /> Nova Tarefa</button>
                        </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(110px,1fr))', gap: 10, marginBottom: 20 }}>
                        {[
                            { l: 'Total', v: globalStats.total, c: '#4090ff' },
                            { l: 'Concluídas', v: globalStats.done, c: '#00c864' },
                            { l: 'Em andamento', v: globalStats.andamento, c: '#4090ff' },
                            { l: 'Aguard. revisão', v: globalStats.revisao, c: '#c060ff' },
                            { l: 'Atrasadas', v: globalStats.atrasadas, c: '#ff4060' },
                            { l: 'Sem responsável', v: globalStats.semResp, c: '#ffcc00' },

                                <div style={{ fontSize: 9.5, color: 'rgba(255,255,255,.38)', marginTop: 3 }}>{m.l}</div>
                            </div>

                    </div>

                    <div style={{ display: 'flex', gap: 0, marginBottom: 18, background: 'rgba(255,255,255,.04)', borderRadius: 10, overflow: 'hidden', width: 'fit-content' }}>

                            <button key={id} onClick={() => setMode(id)} style={{ padding: '8px 22px', fontSize: 12, background: mode === id ? 'rgba(255,0,64,.18)' : 'transparent', color: mode === id ? '#ff4060' : 'rgba(255,255,255,.5)', border: 'none', cursor: 'pointer', fontWeight: mode === id ? 700 : 400 }}>{l}</button>
                        ))}
                    </div>

                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
                        <select className="input-field" value={dateScope} onChange={e => setDateScope(e.target.value)} style={{ width: 'auto', fontSize: 12 }}>
                            {[['todos', 'Todos'], ['hoje', 'Hoje'], ['semana', 'Semana'], ['mes', 'Mês']].map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                        </select>
                        <select className="input-field" value={statusQuick} onChange={e => setStatusQuick(e.target.value)} style={{ width: 'auto', fontSize: 12 }}>
                            {[['todas', 'Todos status'], ['atrasadas', 'Atrasadas'], ['concluidas', 'Concluídas'], ['andamento', 'Em andamento'], ['nao_iniciada', 'Não iniciadas'], ['revisao', 'Aguardando revisão'], ['sem_resp', 'Sem responsável']].map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                        </select>
                        <select className="input-field" value={filtClient} onChange={e => setFiltClient(e.target.value)} style={{ width: 'auto', fontSize: 12 }}>
                            <option value="">Todos os clientes</option>
                            {store.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                        </select>
                        <select className="input-field" value={filtResp} onChange={e => setFiltResp(e.target.value)} style={{ width: 'auto', fontSize: 12 }}>
                            <option value="">Todos os responsáveis</option>
                            {TEAM.map(v => <option key={v}>{v}</option>)}
                        </select>
                        <select className="input-field" value={filtPrior} onChange={e => setFiltPrior(e.target.value)} style={{ width: 'auto', fontSize: 12 }}>
                            <option value="">Todas prioridades</option>
                            {Object.keys(DAILY_PCOL).map(v => <option key={v}>{v}</option>)}
                        </select>
                    </div>

                    {mode === 'semana' ? (
                        <div style={{ marginBottom: 24 }}>
                            <DailyWeeklyView tasks={applyFilters(tasks)} onDayClick={(ds, ct) => setDayModal({ ds, items: ct })} />
                        </div>
                    ) : (
                        <>
                            {venceHoje.length > 0 && (
                                <div className="glass" style={{ padding: 16, marginBottom: 20, border: '1px solid rgba(255,204,0,.2)' }}>
                                    <div style={{ fontSize: 12, fontWeight: 700, color: '#ffcc00', marginBottom: 10 }}>⏰ Vence Hoje ({venceHoje.length})</div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                                        {venceHoje.map(t => (
                                            <div key={t.id} onClick={() => setDetailTask(t)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 10px', background: 'rgba(255,204,0,.05)', borderRadius: 7, border: '1px solid rgba(255,204,0,.12)', cursor: 'pointer' }}>
                                                <span style={{ flex: 1, fontSize: 12 }}>{t.title}</span>
                                                {t.dueTime && <span style={{ fontSize: 10.5, color: '#ffcc00', fontWeight: 700 }}>{t.dueTime}</span>}
                                                <span style={{ fontSize: 10.5, color: 'rgba(255,255,255,.4)' }}>{(t.assignee || 'Sem responsável').split(' ')[0]}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div style={{ marginBottom: 26 }}>
                                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Minha Carga <span style={{ fontWeight: 400, color: 'rgba(255,255,255,.35)', fontSize: 12 }}>({minhaCargaList.length})</span></div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                    {minhaCargaList.length === 0 && <div style={{ textAlign: 'center', padding: '24px 0', color: 'rgba(255,255,255,.3)', fontSize: 13 }}>Nenhuma tarefa com os filtros atuais.</div>}
                                    {minhaCargaList.map(t => (
                                        <DailyTaskRow key={t.id} task={t} draggable onDragStart={e => { setDragging(t); e.dataTransfer.effectAllowed = 'move'; }} onClick={() => setDetailTask(t)} />
                                    ))}
                                </div>
                            </div>

                            <div>
                                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Equipe</div>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 12 }}>
                                    {teamCards.map(u => (
                                        <div key={u.name} onClick={() => setViewingUser(u.name)}
                                            onDragOver={e => { e.preventDefault(); setDragOverUser(u.name); }}
                                            onDragLeave={() => setDragOverUser(null)}
                                            onDrop={e => { e.preventDefault(); dropOnUser(u.name); }}
                                            className="glass glass-hover" style={{ padding: 16, cursor: 'pointer', borderColor: dragOverUser === u.name ? 'rgba(255,0,64,.5)' : undefined }}>
                                            <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 3 }}>{u.name}</div>
                                            <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 10 }}>{u.total} tarefa{u.total !== 1 ? 's' : ''}</div>
                                            <div style={{ height: 7, background: 'rgba(255,255,255,.06)', borderRadius: 4, overflow: 'hidden', marginBottom: 6 }}>
                                                <div style={{ height: '100%', width: u.pct + '%', background: u.pct >= 80 ? '#00c864' : u.pct >= 40 ? '#ffcc00' : '#ff8020', borderRadius: 4, transition: 'width .3s' }} />
                                            </div>
                                            <div style={{ fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,.5)' }}>{u.pct}% concluído</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div style={{ marginTop: 26 }}>
                                <div onClick={() => setShowAllTasks(v => !v)} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', marginBottom: showAllTasks ? 12 : 0 }}>
                                    <div style={{ fontSize: 14, fontWeight: 700 }}>Todas as Tarefas <span style={{ fontWeight: 400, color: 'rgba(255,255,255,.35)', fontSize: 12 }}>({allFilteredList.length})</span></div>
                                    <span style={{ fontSize: 11, color: 'rgba(255,255,255,.4)' }}>{showAllTasks ? '▲ ocultar' : '▼ mostrar (aplica os filtros acima a toda a equipe)'}</span>
                                </div>
                                {showAllTasks && (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                        {allFilteredList.length === 0 && <div style={{ textAlign: 'center', padding: '24px 0', color: 'rgba(255,255,255,.3)', fontSize: 13 }}>Nenhuma tarefa com os filtros atuais.</div>}
                                        {allFilteredList.map(t => (
                                            <DailyTaskRow key={t.id} task={t} onClick={() => setDetailTask(t)} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {showAdd && <DailyTaskModal onClose={() => setShowAdd(false)} />}
                    {editTask && <DailyTaskModal task={editTask} onClose={() => { setEditTask(null); setDetailTask(null); }} />}
                    {showFromCal && <AddFromCalendarModal onClose={() => setShowFromCal(false)} />}
                    {detailTask && !editTask && (
                        <DailyTaskDetail task={tasks.find(t => t.id === detailTask.id) || detailTask} onClose={() => setDetailTask(null)}
                            onEdit={() => setEditTask(detailTask)}
                            onOpenCalendarEvent={ds => { setDetailTask(null); goToEvent(ds); }} />
                    )}
                    {viewingUser && (
                        <TeamMemberTasksModal name={viewingUser} tasks={applyFilters(tasks.filter(t => t.assignee === viewingUser))} onClose={() => setViewingUser(null)} onOpenTask={t => setDetailTask(t)} />
                    )}
                    {dayModal && (
                        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setDayModal(null)}>
                            <div className="modal-box fade-in" style={{ maxWidth: 480 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                                    <h2 style={{ fontSize: 15, fontWeight: 700 }}>{fmtD(dayModal.ds)}</h2>
                                    <button className="btn-secondary" onClick={() => setDayModal(null)} style={{ padding: '5px 9px' }}><Ic n="x" s={14} /></button>
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                    {dayModal.items.length === 0 && <div style={{ textAlign: 'center', padding: '20px 0', color: 'rgba(255,255,255,.3)', fontSize: 13 }}>Nenhuma tarefa neste dia.</div>}
                                    {dayModal.items.map(t => <DailyTaskRow key={t.id} task={t} onClick={() => { setDetailTask(t); setDayModal(null); }} />)}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ── SUBABA DO CALENDÁRIO: Calendário | Carga Diária (CalendarPage acima permanece intocado) ── */
        function CalendarModule() {
            const { setCalFocusDate } = useApp();
            const [subTab, setSubTab] = useState('calendar');
            const goToEvent = ds => { if (ds) setCalFocusDate(ds); setSubTab('calendar'); };
            return (
                <div>
                    <div style={{ display: 'flex', gap: 0, marginBottom: 18, background: 'rgba(255,255,255,.04)', borderRadius: 10, overflow: 'hidden', width: 'fit-content' }}>
                        {[['calendar', 'Calendário'], ['daily', 'Carga Diária']].map(([id, l]) => (
                            <button key={id} onClick={() => setSubTab(id)} style={{ padding: '9px 26px', fontSize: 12.5, background: subTab === id ? 'rgba(255,0,64,.18)' : 'transparent', color: subTab === id ? '#ff4060' : 'rgba(255,255,255,.5)', border: 'none', cursor: 'pointer', fontWeight: subTab === id ? 700 : 400 }}>{l}</button>
                        ))}
                    </div>
                    {subTab === 'calendar' ? <CalendarPage /> : <DailyLoadPage goToEvent={goToEvent} />}
                </div>

        }

        /* ── CAMPAIGN MODAL ──────────────────────────────────── */

            const [f, setF] = useState(campaign ? { ...campaign } : { campaignName: '', month: now.getMonth() + 1, year: now.getFullYear(), budget: '', cpl: '', cpa: '', roas: '', leads: '', sales: '' });
