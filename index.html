        /* ── FINANCIAL ──────────────────────────────────────── */
        /* ── COMPROVANTES DE PAGAMENTO ─────────────────────── */
        function ComprovantesModal({ rec, onClose }) {
            const me = (() => { try { return JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); } catch { return null; } })();
            const [list, setList] = React.useState([]);
            const [uploading, setUploading] = React.useState(false);
            const [lightbox, setLightbox] = React.useState(null);
            const fileRef = React.useRef();

            const load = async () => {
                try {
                    const items = await db.finComprovantes.where('finId').equals(rec.id).sortBy('uploadedAt');
                    setList(items.map(({ id, finId, name, size, type, uploadedAt, uploadedBy }) => ({ id, finId, name, size, type, uploadedAt, uploadedBy })));
                } catch (e) { console.error('ComprovantesModal load:', e); }
            };
            React.useEffect(() => { load(); }, []);

            const fmtSize = b => b < 1024 * 1024 ? (b / 1024).toFixed(1) + ' KB' : (b / 1024 / 1024).toFixed(2) + ' MB';
            const fmtTs = iso => { try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };

            const handleFile = async e => {
                const file = e.target.files[0];
                if (!file) return;
                const allowed = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
                if (!allowed.includes(file.type)) { alert('Formato não suportado. Use PDF, JPG, PNG ou WEBP.'); return; }
                if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo 10 MB.'); return; }
                setUploading(true);
                try {
                    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.onerror = rej; r.readAsDataURL(file); });
                    await db.finComprovantes.put({ id: genId(), finId: rec.id, name: file.name, size: file.size, type: file.type, uploadedAt: new Date().toISOString(), uploadedBy: me?.name || me?.username || 'Usuário', data });
                    await load();
                } catch (err) { console.error(err); alert('Erro ao salvar comprovante.'); }
                setUploading(false);
                e.target.value = '';
            };

            const viewItem = async id => {
                const item = await db.finComprovantes.get(id);
                if (!item) return;
                if (item.type.startsWith('image/')) { setLightbox({ src: item.data, name: item.name }); }
                else {
                    const byteStr = atob(item.data.split(',')[1]);
                    const ab = new Uint8Array(byteStr.length);
                    for (let i = 0; i < byteStr.length; i++) ab[i] = byteStr.charCodeAt(i);
                    window.open(URL.createObjectURL(new Blob([ab], { type: item.type })), '_blank');
                }
            };

            const downloadItem = async id => {
                const item = await db.finComprovantes.get(id);
                if (!item) return;
                const a = document.createElement('a'); a.href = item.data; a.download = item.name; a.click();
            };

            const removeItem = async id => {
                if (!confirm('Remover este comprovante?')) return;
                await db.finComprovantes.delete(id);
                await load();
            };

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in" style={{ maxWidth: 560 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18 }}>
                            <div>
                                <h2 style={{ fontSize: 16, fontWeight: 700 }}>Comprovantes de Pagamento</h2>
                                <p style={{ fontSize: 12, color: 'rgba(255,255,255,.4)', marginTop: 3 }}>{rec.clientName || '—'} · {fmtD(rec.date)} · {fmt(rec.amount || 0)}</p>
                            </div>
                            <button className="btn-secondary" onClick={onClose} style={{ padding: '5px 9px' }}><Ic n="x" s={14} /></button>
                        </div>
                        <div style={{ marginBottom: 16 }}>
                            <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" style={{ display: 'none' }} onChange={handleFile} />
                            <button className="btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => fileRef.current?.click()} disabled={uploading}>
                                {uploading ? 'Enviando...' : '+ Anexar Comprovante'}
                            </button>
                            <p style={{ fontSize: 11, color: 'rgba(255,255,255,.3)', marginTop: 6, textAlign: 'center' }}>PDF, JPG, PNG ou WEBP · Máx. 10 MB</p>
                        </div>
                        {list.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '28px 0', color: 'rgba(255,255,255,.3)', fontSize: 13 }}>Nenhum comprovante anexado ainda</div>
                        ) : (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                {list.map(item => (
                                    <div key={item.id} style={{ background: 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.08)', borderRadius: 10, padding: '12px 14px' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 }}>
                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                <div style={{ fontWeight: 600, fontSize: 13, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                                    {item.type.startsWith('image/') ? '🖼 ' : '📄 '}{item.name}
                                                </div>
                                                <div style={{ fontSize: 11, color: 'rgba(255,255,255,.38)', marginTop: 4 }}>
                                                    {fmtSize(item.size)} · {fmtTs(item.uploadedAt)} · por {item.uploadedBy}
                                                </div>
                                            </div>
                                            <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                                                <button className="btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }} onClick={() => viewItem(item.id)}>Visualizar</button>
                                                <button className="btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }} onClick={() => downloadItem(item.id)}>Baixar</button>
                                                <button className="btn-danger" style={{ padding: '4px 8px' }} onClick={() => removeItem(item.id)}><Ic n="trash" s={11} /></button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {lightbox && <ImageLightbox src={lightbox.src} onClose={() => setLightbox(null)} />}
                    </div>
                </div>
            );
        }

                        ))}
                    </div>
                    <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
                        {['Todos', 'Pago', 'Pendente', 'Atrasado'].map(f => (
                            <button key={f} onClick={() => setFilt(f)} style={{ padding: '7px 14px', borderRadius: 8, border: '1px solid', fontSize: 12, cursor: 'pointer', fontWeight: 600, transition: 'all .2s', background: filt === f ? 'rgba(255,0,64,.18)' : 'rgba(255,255,255,.03)', borderColor: filt === f ? 'rgba(255,0,64,.5)' : 'rgba(255,255,255,.08)', color: filt === f ? '#ff4060' : 'rgba(255,255,255,.55)' }}>{f}</button>
                        ))}
                    </div>
                    <div className="glass" style={{ overflow: 'hidden', marginBottom: 20 }}>
                        <table style={{ width: '100%', borderCollapse: 'collapse' }} className="tbl">
                            <thead><tr>{['Cliente', 'Valor', 'Tipo', 'Data', 'Status', 'Ações'].map(h => <th key={h}>{h}</th>)}</tr></thead>
                            <tbody>
                                {rows.length === 0 && <tr><td colSpan={6} style={{ textAlign: 'center', padding: 40, color: 'rgba(255,255,255,.3)' }}>Nenhum registro encontrado</td></tr>}

                                    <tr key={r.id}>
                                        <td style={{ fontWeight: 600 }}>{r.clientName || '—'}</td>
                                        <td style={{ fontWeight: 700, color: '#00c864', fontSize: 14 }}>{fmt(r.amount)}</td>
                                        <td style={{ color: 'rgba(255,255,255,.5)' }}>{r.type}</td>
                                        <td style={{ color: 'rgba(255,255,255,.55)' }}>{fmtD(r.date)}</td>
                                        <td>
                                            <select className="input-field" value={r.status} onChange={e => editFin(r.id, { status: e.target.value })} style={{ padding: '4px 8px', width: 'auto', fontSize: 12 }}>
                                                {['Pago', 'Pendente', 'Atrasado'].map(s => <option key={s}>{s}</option>)}
                                            </select>
                                        </td>
                                        <td><div style={{ display: 'flex', gap: 7 }}>{r.status === 'Pago' && <button className="btn-secondary" style={{ padding: '5px 9px', color: '#00c864', borderColor: 'rgba(0,200,100,.3)' }} onClick={() => setShowComp(r)} title="Comprovantes de Pagamento">📎</button>}<button className="btn-secondary" style={{ padding: '5px 9px' }} onClick={() => setEditing(r)}><Ic n="edit" s={12} /></button><button className="btn-danger" style={{ padding: '5px 9px' }} onClick={() => setDel(r)}><Ic n="trash" s={12} /></button></div></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                        <div><h2 style={{ fontSize: 16, fontWeight: 700 }}>Custos</h2><p style={{ fontSize: 12, color: 'rgba(255,255,255,.35)', marginTop: 2 }}>Custos fixos, únicos e anuais</p></div>
                        <button className="btn-secondary" onClick={() => setShowCost(true)}><Ic n="plus" s={13} />Adicionar Custo</button>
                    </div>
                    <div className="glass" style={{ overflow: 'hidden' }}>

                                            <td style={{ fontWeight: 700, color: '#ff8030', fontSize: 14 }}>{fmt(c.amount)}</td>

                                            <td><div style={{ display: 'flex', gap: 7 }}><button className="btn-secondary" style={{ padding: '5px 9px' }} onClick={() => setEditingCost(c)}><Ic n="edit" s={12} /></button><button className="btn-danger" style={{ padding: '5px 9px' }} onClick={() => setDelCost2(c)}><Ic n="trash" s={12} /></button></div></td>

                    {showAdd && <FinModal onClose={() => setShowAdd(false)} />}

                    {del && <Confirm msg="Excluir este registro financeiro?" onOk={() => deleteFin(del.id)} onClose={() => setDel(null)} />}
                    {showCost && <CostModal onClose={() => setShowCost(false)} />}
                    {editingCost && <CostModal rec={editingCost} onClose={() => setEditingCost(null)} />}
                    {delCost2 && <Confirm msg={`Excluir custo "${delCost2.name}"?`} onOk={() => { deleteCost(delCost2.id); setDelCost2(null); }} onClose={() => setDelCost2(null)} />}
                    {showComp && <ComprovantesModal rec={showComp} onClose={() => setShowComp(null)} />}
                </div>
            );
        }

        /* ── PDF CAMPANHA ───────────────────────────────────── */
        async function gerarPDFCampanha(rec, client) {
            if (typeof window.jspdf === 'undefined') { alert('Biblioteca jsPDF nao carregada. Verifique sua conexao e recarregue a pagina.'); return; }
            const { jsPDF } = window.jspdf;

            /* ── métricas ── */
            const bgt = parseFloat(rec.budget) || 0;
            const lds = parseInt(rec.leads) || 0;
            const sls = parseInt(rec.sales) || 0;
            const cpa = parseFloat(rec.cpa) || 0;
            const cpl = lds > 0 && bgt > 0 ? bgt / lds : (parseFloat(rec.cpl) || 0);
            const roas = parseFloat(rec.roas) || (bgt > 0 && sls > 0 ? sls * cpa / bgt : 0);
            const conv = lds > 0 ? (sls / lds) * 100 : 0;
            const rev = sls * cpa;
            const fmtV = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const period = MESES_SHORT[(rec.month || 1) - 1] + '/' + (rec.year || new Date().getFullYear());

            /* ── dimensões do PDF (pt, 1pt ≈ 1px a 72dpi, formato 16:9) ── */
            /* embed dims em pt — canvas sempre 2× para qualidade */
            const BAR_W = 790, BAR_H = 256;   /* gráfico de barras */
            const DON_S = 200;                 /* donut (quadrado) */
            const FUN_W = 410, FUN_H = 120;   /* funil horizontal */

            /* ── Chart 1: barras — canvas 2× do embed ── */
            const bc = document.createElement('canvas');
            bc.width = BAR_W * 2; bc.height = BAR_H * 2;
            const bctx = bc.getContext('2d');
            bctx.fillStyle = '#0d0c25'; bctx.fillRect(0, 0, bc.width, bc.height);
            const ch1 = new Chart(bctx, {
                type: 'bar',
                data: { labels: ['Investimento', 'Receita Estimada'], datasets: [{ data: [bgt, rev], backgroundColor: ['rgba(64,144,255,.85)', 'rgba(0,200,100,.85)'], borderColor: ['#4090ff', '#00c864'], borderWidth: 4, borderRadius: 16 }] },
                options: { animation: false, responsive: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: 'rgba(255,255,255,.6)', font: { size: 22 }, callback: v => 'R$' + Number(v).toLocaleString('pt-BR') }, border: { color: 'transparent' } }, x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,.8)', font: { size: 26, weight: 'bold' } }, border: { color: 'transparent' } } } }
            });

            /* ── Chart 2: donut ROAS — canvas 2×DON_S (quadrado) ── */
            const dc = document.createElement('canvas');
            dc.width = DON_S * 2; dc.height = DON_S * 2;
            const dctx = dc.getContext('2d');
            dctx.fillStyle = '#0d0c25'; dctx.fillRect(0, 0, dc.width, dc.height);
            const roasHex = roas >= 3 ? '#00c864' : roas >= 1 ? '#ffcc00' : '#ff4060';
            const ch2 = new Chart(dctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [Math.min(roas, 10), Math.max(10 - Math.min(roas, 10), 0.01)], backgroundColor: [roasHex + 'cc', 'rgba(255,255,255,.05)'], borderColor: [roasHex, 'rgba(255,255,255,.08)'], borderWidth: 4, hoverOffset: 0 }] },
                options: { animation: false, responsive: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, layout: { padding: 12 } }
            });

            /* ── Chart 3: funil horizontal — canvas 2× do embed, mesmo aspect ratio ── */
            const fc = document.createElement('canvas');
            fc.width = FUN_W * 2; fc.height = FUN_H * 2;  /* mesmo ratio: FUN_W/FUN_H */
            const fctx = fc.getContext('2d');
            fctx.fillStyle = '#0d0c25'; fctx.fillRect(0, 0, fc.width, fc.height);
            const ch3 = new Chart(fctx, {
                type: 'bar',
                data: { labels: ['Leads Gerados', 'Vendas Realizadas'], datasets: [{ data: [lds, sls], backgroundColor: ['rgba(160,96,255,.85)', 'rgba(0,200,100,.85)'], borderColor: ['#a060ff', '#00c864'], borderWidth: 3, borderRadius: 10, indexAxis: 'y' }] },
                options: { animation: false, responsive: false, indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: 'rgba(255,255,255,.6)', font: { size: 20 } }, border: { color: 'transparent' }, max: Math.ceil(Math.max(lds, 1) * 1.2) }, y: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,.8)', font: { size: 22, weight: 'bold' } }, border: { color: 'transparent' } } } }
            });

            await new Promise(r => setTimeout(r, 240));
            const barImg = bc.toDataURL('image/png');
            const donutImg = dc.toDataURL('image/png');
            const funImg = fc.toDataURL('image/png');
            ch1.destroy(); ch2.destroy(); ch3.destroy();

            /* ── logo com aspect ratio correto ── */
            let logoData = null, logoNW = 0, logoNH = 0;
            try {
                const img = new Image();
                img.src = 'images/LOGOTIPO 2 copiar 2.png';
                await new Promise(r => { img.onload = r; img.onerror = r; setTimeout(r, 1600); });
                if (img.naturalWidth > 0) {
                    logoNW = img.naturalWidth; logoNH = img.naturalHeight;
                    const lc = document.createElement('canvas');
                    lc.width = logoNW; lc.height = logoNH;
                    lc.getContext('2d').drawImage(img, 0, 0);
                    logoData = lc.toDataURL('image/png');
                }
            } catch { }

            /* ── jsPDF: 1280×720 pt (16:9) ── */
            const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [1280, 720] });
            const W = 1280, H = 720, M = 22;

            const fill = (r, g, b) => doc.setFillColor(r, g, b);
            const tc = (r, g, b) => doc.setTextColor(r, g, b);
            const dc2 = (r, g, b) => doc.setDrawColor(r, g, b);
            const fnt = (st, sz) => { doc.setFont('helvetica', st); doc.setFontSize(sz); };

            /* ── fundo geral ── */
            fill(10, 9, 28); doc.rect(0, 0, W, H, 'F');

            /* ══════════ HEADER (y 0–72) ══════════ */
            fill(15, 14, 42); doc.rect(0, 0, W, 72, 'F');
            fill(255, 0, 64); doc.rect(0, 0, W, 5, 'F');

            /* logo com proporção original */
            let logoEndX = M;
            if (logoData && logoNW > 0) {
                const lgH = 48, lgW = (logoNW / logoNH) * lgH;
                doc.addImage(logoData, 'PNG', M, 12, lgW, lgH);
                logoEndX = M + lgW + 16;
            } else {
                fnt('bold', 30); tc(255, 0, 64); doc.text('NEOS', M, 54);
                logoEndX = M + 88;
            }

            /* campanha + cliente */
            const campNameDisp = (rec.campaignName || 'Campanha Principal').substring(0, 44);
            fnt('bold', 16); tc(255, 255, 255);
            doc.text(campNameDisp, logoEndX, 28);
            fnt('normal', 10); tc(200, 198, 245);
            doc.text(client.name || 'Cliente', logoEndX, 44);
            fnt('normal', 9); tc(150, 148, 195);
            doc.text(period + '  ·  ' + (client.service || 'Tráfego Pago').toUpperCase(), logoEndX, 60);

            /* chips de métricas — objetivos, sem análise */
            const chips = [
                { l: 'Investimento', v: fmtV(bgt) },
                { l: 'Leads Gerados', v: lds > 0 ? lds.toLocaleString() : '—' },
                { l: 'CPL', v: cpl > 0 ? fmtV(cpl) : '—' },
                { l: 'Período', v: period },
                { l: 'Status', v: 'Ativa' },
            ];
            const chipW = 118, chipH = 48, chipG = 7;
            const chipX0 = W - M - chips.length * chipW - (chips.length - 1) * chipG;
            chips.forEach((ch, i) => {
                const cx = chipX0 + i * (chipW + chipG), cy = 12;
                fill(24, 22, 64); doc.roundedRect(cx, cy, chipW, chipH, 5, 5, 'F');
                fnt('normal', 8); tc(130, 130, 175); doc.text(ch.l, cx + chipW / 2, cy + 16, { align: 'center' });
                fnt('bold', 11); tc(225, 225, 255); doc.text(ch.v, cx + chipW / 2, cy + 36, { align: 'center' });
            });

            dc2(40, 38, 90); doc.setLineWidth(1); doc.line(0, 72, W, 72);

            /* ══════════ KPI CARDS (y 80–210) ══════════ */
            const cardY = 80, cardH = 130, cardG = 10;
            const cardW = (W - M * 2 - 3 * cardG) / 4;
            const cplRgb = cpl <= 0 ? [180,178,220] : cpl <= 50 ? [0,200,100] : cpl <= 100 ? [255,204,0] : [255,64,96];
            const kpis = [
                { l: 'Investimento Total', v: fmtV(bgt), sub: 'Budget da campanha', rgb: [64, 144, 255], bar: 1 },
                { l: 'Leads Gerados', v: lds > 0 ? lds.toLocaleString() : '—', sub: 'Total capturado na campanha', rgb: [160, 96, 255], bar: lds > 0 ? 1 : 0 },
                { l: 'CPL — Custo por Lead', v: cpl > 0 ? fmtV(cpl) : '—', sub: bgt > 0 && lds > 0 ? 'R$' + bgt.toFixed(0) + ' ÷ ' + lds + ' leads' : 'Aguardando dados', rgb: cplRgb, bar: cpl > 0 ? Math.max(0, 1 - Math.min(cpl / 200, 1)) : 0 },
                { l: 'Período', v: period, sub: client.name || '—', rgb: [255, 128, 48], bar: 1 },
            ];
            kpis.forEach((k, i) => {
                const kx = M + i * (cardW + cardG);
                fill(16, 15, 46); doc.roundedRect(kx, cardY, cardW, cardH, 6, 6, 'F');
                fill(...k.rgb); doc.rect(kx, cardY, 5, cardH, 'F');
                fnt('normal', 8.5); tc(150, 148, 200); doc.text(k.l.toUpperCase(), kx + 16, cardY + 22);
                fnt('bold', 26); tc(...k.rgb); doc.text(k.v, kx + 16, cardY + 62);
                fnt('normal', 8); tc(140, 138, 188); doc.text(k.sub, kx + 16, cardY + 80);
                const bw = cardW - 32;
                fill(32, 30, 72); doc.roundedRect(kx + 16, cardY + 92, bw, 8, 4, 4, 'F');
                if (k.bar > 0) { fill(...k.rgb); doc.roundedRect(kx + 16, cardY + 92, bw * k.bar, 8, 4, 4, 'F'); }
            });

            /* ══════════ ÁREA DE GRÁFICOS (y 220–490) ══════════ */
            const gY = 220, gH = 270;
            /* painel esquerdo: gráfico de barras */
            const leftW = 790;
            fill(14, 13, 40); doc.roundedRect(M, gY, leftW, gH, 6, 6, 'F');
            doc.addImage(barImg, 'PNG', M, gY, BAR_W, BAR_H);
            /* label do gráfico (abaixo) */
            fnt('normal', 8.5); tc(120, 118, 170);
            doc.text('Investimento  vs  Receita Estimada', M + leftW / 2, gY + BAR_H + 16, { align: 'center' });

            /* painel direito: donut + funil */
            const RX = M + leftW + 14, RW = W - M - RX;
            const donutPanH = gH / 2 - 6;
            fill(14, 13, 40); doc.roundedRect(RX, gY, RW, donutPanH, 6, 6, 'F');
            /* donut quadrado, centralizado no painel superior direito */
            const dSide = Math.min(DON_S, donutPanH - 10);
            const dImgX = RX + (RW - dSide) / 2, dImgY = gY + (donutPanH - dSide) / 2;
            doc.addImage(donutImg, 'PNG', dImgX, dImgY, dSide, dSide);
            /* texto ROAS no centro do donut */
            const [rr, rg, rb] = roas >= 3 ? [0, 200, 100] : roas >= 1 ? [255, 204, 0] : [255, 64, 96];
            fnt('bold', 18); tc(rr, rg, rb);
            doc.text(roas.toFixed(2) + 'x', RX + RW / 2, gY + donutPanH / 2 + 7, { align: 'center' });
            fnt('normal', 8); tc(150, 148, 195);
            doc.text('ROAS  (meta: 3x)', RX + RW / 2, gY + donutPanH / 2 + 20, { align: 'center' });

            /* painel funil */
            const funPanY = gY + donutPanH + 12, funPanH = gH - donutPanH - 12;
            fill(14, 13, 40); doc.roundedRect(RX, funPanY, RW, funPanH, 6, 6, 'F');
            /* embed funil com ratio exato canvas 2×FUN_W : 2×FUN_H = FUN_W : FUN_H */
            doc.addImage(funImg, 'PNG', RX, funPanY, FUN_W, FUN_H);
            /* badge conv */
            const cvRGB = conv >= 10 ? [0, 200, 100] : conv >= 3 ? [255, 204, 0] : [255, 64, 96];
            fnt('bold', 8); tc(...cvRGB);
            doc.text('Conversao: ' + conv.toFixed(1) + '%', RX + RW / 2, funPanY + funPanH - 8, { align: 'center' });

            /* ══════════ RESUMO DE RESULTADOS ══════════ */
            const aY = gY + gH + 10, aH = 140;
            const rMetrics = [
                { l: 'CAMPANHA', v: (rec.campaignName || 'Campanha Principal').substring(0, 30), c: [200, 198, 255] },
                { l: 'PERÍODO', v: period, c: [255, 200, 80] },
                { l: 'INVESTIMENTO', v: fmtV(bgt), c: [64, 144, 255] },
                { l: 'LEADS GERADOS', v: lds > 0 ? lds.toLocaleString() : '—', c: [160, 96, 255] },
                { l: 'CPL', v: cpl > 0 ? fmtV(cpl) : '—', c: cpl <= 0 ? [180,178,220] : cpl <= 50 ? [0,200,100] : cpl <= 100 ? [255,204,0] : [255,64,96] },
            ];
            const rmW = (W - M * 2 - (rMetrics.length - 1) * 12) / rMetrics.length;
            rMetrics.forEach((m, i) => {
                const [cr, cg, cb] = m.c;
                const mx = M + i * (rmW + 12);
                fill(16, 15, 48); doc.roundedRect(mx, aY, rmW, aH, 7, 7, 'F');
                fill(cr, cg, cb); doc.rect(mx, aY, rmW, 5, 'F');
                doc.roundedRect(mx, aY, rmW, 5, 7, 7, 'F');
                fnt('normal', 8); tc(130, 128, 178); doc.text(m.l, mx + rmW / 2, aY + 24, { align: 'center' });
                dc2(cr, cg, cb); doc.setLineWidth(0.5); doc.line(mx + 18, aY + 32, mx + rmW - 18, aY + 32);
                const vLines = doc.splitTextToSize(m.v, rmW - 20);
                fnt('bold', vLines.length > 1 ? 15 : 20); tc(cr, cg, cb);
                doc.text(vLines, mx + rmW / 2, vLines.length > 1 ? aY + 66 : aY + 78, { align: 'center' });
                fnt('normal', 8); tc(60, 58, 105);
                doc.text('Neos Digital', mx + rmW / 2, aY + aH - 14, { align: 'center' });
            });

            /* ══════════ FOOTER ══════════ */
            const fY = aY + aH + 8;
            fill(14, 13, 42); doc.rect(0, fY, W, H - fY, 'F');

        /* ── PDF PERFORMANCE ────────────────────────────────── */
        async function gerarPDFPerformance(rec, client) {
            if (typeof window.jspdf === 'undefined') { alert('Biblioteca jsPDF nao carregada. Verifique sua conexao e recarregue a pagina.'); return; }
            const { jsPDF } = window.jspdf;
            const flw = parseInt(rec.followers) || 0;
            const gained = parseInt(rec.followersGained) || 0;
            const reach = parseInt(rec.reach) || 0;
            const imp = parseInt(rec.impressions) || 0;
            const likes = parseInt(rec.likes) || 0;
            const comments = parseInt(rec.comments) || 0;
            const shares = parseInt(rec.shares) || 0;
            const saves = parseInt(rec.saves) || 0;
            const posts = parseInt(rec.posts) || 0;
            const stories = parseInt(rec.stories) || 0;
            const reels = parseInt(rec.reels) || 0;
            const totalEng = likes + comments + shares + saves;
            const engRate = reach > 0 ? (totalEng / reach) * 100 : 0;
            const growthRate = flw > 0 ? (gained / flw) * 100 : 0;
            const period = MESES_SHORT[(rec.month || 1) - 1] + '/' + (rec.year || new Date().getFullYear());
            const platC = PLATFORM_COLORS[rec.platform] || { hex: '#ff0040', rgb: [255, 0, 64] };
            const fmtN = n => n.toLocaleString('pt-BR');

            const BAR_W = 790, BAR_H = 256, DON_S = 200, FUN_W = 410, FUN_H = 120;

            /* Chart 1: engagement metrics bar */
            const bc = document.createElement('canvas');
            bc.width = BAR_W * 2; bc.height = BAR_H * 2;
            const bctx = bc.getContext('2d');
            bctx.fillStyle = '#0d0c25'; bctx.fillRect(0, 0, bc.width, bc.height);
            const ch1 = new Chart(bctx, {
                type: 'bar',
                data: {
                    labels: ['Curtidas', 'Comentarios', 'Compart.', 'Salvamentos'],
                    datasets: [{
                        data: [likes, comments, shares, saves],
                        backgroundColor: ['rgba(225,48,108,.85)', 'rgba(64,144,255,.85)', 'rgba(0,200,100,.85)', 'rgba(255,204,0,.85)'],
                        borderColor: ['#E1306C', '#4090ff', '#00c864', '#ffcc00'], borderWidth: 3, borderRadius: 14
                    }]
                },
                options: {
                    animation: false, responsive: false, plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: 'rgba(255,255,255,.6)', font: { size: 22 } }, border: { color: 'transparent' } },
                        x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,.8)', font: { size: 26, weight: 'bold' } }, border: { color: 'transparent' } }
                    }
                }
            });

            /* Chart 2: donut engagement rate */
            const dc = document.createElement('canvas');
            dc.width = DON_S * 2; dc.height = DON_S * 2;
            const dctx = dc.getContext('2d');
            dctx.fillStyle = '#0d0c25'; dctx.fillRect(0, 0, dc.width, dc.height);
            const engHex = engRate >= 5 ? '#00c864' : engRate >= 2 ? '#ffcc00' : '#ff4060';
            const engRGB = engRate >= 5 ? [0, 200, 100] : engRate >= 2 ? [255, 204, 0] : [255, 64, 96];
            const ch2 = new Chart(dctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [Math.min(engRate, 10), Math.max(10 - Math.min(engRate, 10), 0.01)],
                        backgroundColor: [engHex + 'cc', 'rgba(255,255,255,.05)'],
                        borderColor: [engHex, 'rgba(255,255,255,.08)'], borderWidth: 4, hoverOffset: 0
                    }]
                },
                options: { animation: false, responsive: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, layout: { padding: 12 } }
            });

            /* Chart 3: horizontal — reach vs impressions */
            const fc = document.createElement('canvas');
            fc.width = FUN_W * 2; fc.height = FUN_H * 2;
            const fctx = fc.getContext('2d');
            fctx.fillStyle = '#0d0c25'; fctx.fillRect(0, 0, fc.width, fc.height);
            const ch3 = new Chart(fctx, {
                type: 'bar',
                data: {
                    labels: ['Alcance', 'Impressoes'],
                    datasets: [{
                        data: [reach, imp],
                        backgroundColor: [platC.hex + 'cc', 'rgba(160,96,255,.85)'],
                        borderColor: [platC.hex, '#a060ff'], borderWidth: 3, borderRadius: 10, indexAxis: 'y'
                    }]
                },
                options: {
                    animation: false, responsive: false, indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: 'rgba(255,255,255,.6)', font: { size: 20 } }, border: { color: 'transparent' } },
                        y: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,.8)', font: { size: 22, weight: 'bold' } }, border: { color: 'transparent' } }
                    }
                }
            });

            await new Promise(r => setTimeout(r, 240));
            const barImg = bc.toDataURL('image/png'), donutImg = dc.toDataURL('image/png'), funImg = fc.toDataURL('image/png');
            ch1.destroy(); ch2.destroy(); ch3.destroy();

            /* logo */
            let logoData = null, logoNW = 0, logoNH = 0;
            try {
                const img = new Image(); img.src = 'images/LOGOTIPO 2 copiar 2.png';
                await new Promise(r => { img.onload = r; img.onerror = r; setTimeout(r, 1600); });
                if (img.naturalWidth > 0) { logoNW = img.naturalWidth; logoNH = img.naturalHeight; const lc = document.createElement('canvas'); lc.width = logoNW; lc.height = logoNH; lc.getContext('2d').drawImage(img, 0, 0); logoData = lc.toDataURL('image/png'); }
            } catch { }

            const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [1280, 720] });
            const W = 1280, H = 720, M = 22;
            const fill = (r, g, b) => doc.setFillColor(r, g, b);
            const tc = (r, g, b) => doc.setTextColor(r, g, b);
            const dc2 = (r, g, b) => doc.setDrawColor(r, g, b);
            const fnt = (st, sz) => { doc.setFont('helvetica', st); doc.setFontSize(sz); };

            fill(10, 9, 28); doc.rect(0, 0, W, H, 'F');

            /* HEADER */
            fill(15, 14, 42); doc.rect(0, 0, W, 72, 'F');
            fill(...platC.rgb); doc.rect(0, 0, W, 5, 'F');
            let logoEndX = M;
            if (logoData && logoNW > 0) { const lgH = 48, lgW = (logoNW / logoNH) * lgH; doc.addImage(logoData, 'PNG', M, 12, lgW, lgH); logoEndX = M + lgW + 16; }
            else { fnt('bold', 30); tc(...platC.rgb); doc.text('NEOS', M, 54); logoEndX = M + 88; }
            fnt('bold', 18); tc(255, 255, 255); doc.text(client.name || 'Cliente', logoEndX, 34);
            fnt('normal', 10); tc(160, 160, 210); doc.text((rec.platform || 'Social Media') + '  ·  ' + period, logoEndX, 52);

            const chips = [
                { l: 'Seguidores', v: fmtN(flw) }, { l: '+Ganhos', v: '+' + fmtN(gained) },
                { l: 'Alcance', v: fmtN(reach) }, { l: 'Impressoes', v: fmtN(imp) },
                { l: 'Curtidas', v: fmtN(likes) }, { l: 'Coments.', v: fmtN(comments) },
                { l: 'Comparts.', v: fmtN(shares) }, { l: 'Eng.Rate', v: engRate.toFixed(2) + '%' },
            ];
            const chipW = 108, chipH = 48, chipG = 7;
            const chipX0 = W - M - chips.length * chipW - (chips.length - 1) * chipG;
            chips.forEach((ch, i) => {
                const cx = chipX0 + i * (chipW + chipG), cy = 12;
                fill(24, 22, 64); doc.roundedRect(cx, cy, chipW, chipH, 5, 5, 'F');
                fnt('normal', 8); tc(130, 130, 175); doc.text(ch.l, cx + chipW / 2, cy + 16, { align: 'center' });
                fnt('bold', 11); tc(225, 225, 255); doc.text(ch.v, cx + chipW / 2, cy + 36, { align: 'center' });
            });
            dc2(40, 38, 90); doc.setLineWidth(1); doc.line(0, 72, W, 72);

            /* KPI CARDS */
            const cardY = 80, cardH = 130, cardG = 10, cardW = (W - M * 2 - 3 * cardG) / 4;
            const kpis = [
                { l: 'Total Seguidores', v: fmtN(flw), sub: gained > 0 ? '+' + fmtN(gained) + ' no mes' : '', rgb: platC.rgb, bar: Math.min(flw / 100000, 1) },
                { l: 'Crescimento', v: '+' + growthRate.toFixed(2) + '%', sub: fmtN(gained) + ' novos seguidores', rgb: [0, 200, 100], bar: Math.min(growthRate / 10, 1) },
                { l: 'Alcance', v: fmtN(reach), sub: flw > 0 ? ((reach / flw) * 100).toFixed(0) + '% dos segs' : '', rgb: [160, 96, 255], bar: Math.min(reach / 500000, 1) },
                { l: 'Taxa Engajamento', v: engRate.toFixed(2) + '%', sub: engRate >= 5 ? 'Excelente (meta: 5%)' : engRate >= 2 ? 'Dentro da media' : 'Abaixo do ideal', rgb: engRGB, bar: Math.min(engRate / 10, 1) },
            ];
            kpis.forEach((k, i) => {
                const kx = M + i * (cardW + cardG);
                fill(16, 15, 46); doc.roundedRect(kx, cardY, cardW, cardH, 6, 6, 'F');
                fill(...k.rgb); doc.rect(kx, cardY, 5, cardH, 'F');
                fnt('normal', 8.5); tc(150, 148, 200); doc.text(k.l.toUpperCase(), kx + 16, cardY + 22);
                fnt('bold', 26); tc(...k.rgb); doc.text(k.v, kx + 16, cardY + 62);
                fnt('normal', 8); tc(140, 138, 188); if (k.sub) doc.text(k.sub, kx + 16, cardY + 80);
                const bw = cardW - 32;
                fill(32, 30, 72); doc.roundedRect(kx + 16, cardY + 92, bw, 8, 4, 4, 'F');
                if (k.bar > 0) { fill(...k.rgb); doc.roundedRect(kx + 16, cardY + 92, bw * k.bar, 8, 4, 4, 'F'); }
            });

            /* CHARTS */
            const gY = 220, gH = 270, leftW = 790;
            fill(14, 13, 40); doc.roundedRect(M, gY, leftW, gH, 6, 6, 'F');
            doc.addImage(barImg, 'PNG', M, gY, BAR_W, BAR_H);
            fnt('normal', 8.5); tc(120, 118, 170);
            doc.text('Metricas de Engajamento — Curtidas / Comentarios / Compartilhamentos / Salvamentos', M + leftW / 2, gY + BAR_H + 16, { align: 'center' });

            const RX = M + leftW + 14, RW = W - M - RX, donutPanH = gH / 2 - 6;
            fill(14, 13, 40); doc.roundedRect(RX, gY, RW, donutPanH, 6, 6, 'F');
            const dSide = Math.min(DON_S, donutPanH - 10);
            doc.addImage(donutImg, 'PNG', RX + (RW - dSide) / 2, gY + (donutPanH - dSide) / 2, dSide, dSide);
            fnt('bold', 18); tc(...engRGB); doc.text(engRate.toFixed(2) + '%', RX + RW / 2, gY + donutPanH / 2 + 7, { align: 'center' });
            fnt('normal', 8); tc(150, 148, 195); doc.text('Taxa de Engajamento', RX + RW / 2, gY + donutPanH / 2 + 20, { align: 'center' });

            const funPanY = gY + donutPanH + 12, funPanH = gH - donutPanH - 12;
            fill(14, 13, 40); doc.roundedRect(RX, funPanY, RW, funPanH, 6, 6, 'F');
            doc.addImage(funImg, 'PNG', RX, funPanY, FUN_W, FUN_H);
            fnt('bold', 8); tc(...platC.rgb); doc.text('Alcance vs Impressoes', RX + RW / 2, funPanY + funPanH - 8, { align: 'center' });

            /* ANALYSIS */
            const aY = gY + gH + 10, aH = 160, insW = (W - M * 2 - 3 * cardG) / 4;
            const insights = [
                growthRate >= 5 ? { t: '+' + growthRate.toFixed(2) + '% crescimento  Excelente. Estrategia de conteudo funcionando.', s: 1 }
                    : growthRate >= 2 ? { t: '+' + growthRate.toFixed(2) + '% crescimento  Crescimento saudavel. Mantenha a consistencia.', s: 0 }
                        : { t: '+' + growthRate.toFixed(2) + '% crescimento  Baixo. Revisar estrategia de aquisicao.', s: -1 },
                engRate >= 5 ? { t: engRate.toFixed(2) + '% engajamento  Excelente. Audiencia altamente engajada.', s: 1 }
                    : engRate >= 2 ? { t: engRate.toFixed(2) + '% engajamento  Dentro da media do mercado (2-5%).', s: 0 }
                        : { t: engRate.toFixed(2) + '% engajamento  Abaixo da media. Revisar qualidade dos posts.', s: -1 },
                reach > 0 && flw > 0
                    ? (reach / flw >= 0.5 ? { t: fmtN(reach) + ' alcance  Otimo. Conteudo alcancou >50% dos seguidores.', s: 1 }
                        : reach / flw >= 0.2 ? { t: fmtN(reach) + ' alcance  Normal. Alcancou ' + ((reach / flw) * 100).toFixed(0) + '% dos segs.', s: 0 }
                            : { t: fmtN(reach) + ' alcance  Baixo. Algoritmo pode estar limitando a entrega.', s: -1 })
                    : { t: 'Sem dados de alcance suficientes para analise.', s: 0 },
                (posts + stories + reels) > 0
                    ? { t: 'Publicacoes: ' + posts + ' posts / ' + stories + ' stories / ' + reels + ' reels', s: posts >= 8 ? 1 : posts >= 4 ? 0 : -1 }
                    : { t: 'Sem dados de publicacoes para este periodo.', s: 0 },
            ];
            insights.forEach((ins, i) => {
                const ix = M + i * (insW + cardG);
                const bg3 = ins.s === 1 ? [0, 40, 20] : ins.s === -1 ? [50, 5, 14] : [36, 34, 5];
                const fg3 = ins.s === 1 ? [0, 200, 100] : ins.s === -1 ? [255, 80, 100] : [255, 210, 50];
                const ic = ins.s === 1 ? '+' : ins.s === -1 ? '!' : '>';
                fill(...bg3); doc.roundedRect(ix, aY, insW, aH, 6, 6, 'F');
                dc2(...fg3); doc.setLineWidth(1.5); doc.roundedRect(ix, aY, insW, aH, 6, 6, 'S');
                fill(...fg3); doc.circle(ix + 24, aY + 30, 13, 'F');
                fnt('bold', 14); tc(10, 9, 28); doc.text(ic, ix + 24, aY + 35, { align: 'center' });
                fnt('bold', 10); tc(...fg3);
                const lines = doc.splitTextToSize(ins.t, insW - 50); doc.text(lines, ix + 44, aY + 24);
                const lbl = ins.s === 1 ? 'POSITIVO' : ins.s === -1 ? 'ATENCAO' : 'NEUTRO';
                fill(...fg3); doc.roundedRect(ix + 14, aY + aH - 28, insW - 28, 18, 4, 4, 'F');
                fnt('bold', 9); tc(10, 9, 28); doc.text(lbl, ix + insW / 2, aY + aH - 15, { align: 'center' });
            });

            /* FOOTER */
            const fY = aY + aH + 8;
            fill(14, 13, 42); doc.rect(0, fY, W, H - fY, 'F');
            dc2(40, 38, 90); doc.setLineWidth(1); doc.line(M, fY, W - M, fY);
            fnt('normal', 9.5); tc(100, 98, 150);
            doc.text('Neos Dashboard  |  Relatorio de Performance — ' + (rec.platform || 'Social Media'), M, fY + 22);
            doc.text('Gerado em ' + new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) + '  |  Documento Confidencial', W - M, fY + 22, { align: 'right' });
            if (client.company) { fnt('normal', 8.5); tc(80, 78, 130); doc.text(client.company, M, fY + 38); }
            fill(...platC.rgb); doc.rect(0, H - 5, W, 5, 'F');
            doc.save('performance-' + (client.name || 'cliente').replace(/[^a-z0-9]/gi, '-') + '-' + (rec.platform || 'social').replace(/[^a-z0-9]/gi, '-') + '-' + period.replace('/', '-') + '.pdf');
        }

                        const leads = getMetaInsightVal(ins, 'lead') || getMetaInsightVal(ins, 'onsite_conversion.messaging_first_reply');
                        const spend = parseFloat(ins.spend) || 0;
                        return { ...c, spend, reach: parseInt(ins.reach)||0, impressions: parseInt(ins.impressions)||0, clicks: parseInt(ins.clicks)||0, ctr: parseFloat(ins.ctr)||0, cpm: parseFloat(ins.cpm)||0, cpc: parseFloat(ins.cpc)||0, leads, cpl: leads>0&&spend>0 ? spend/leads : 0 };
                    });
                    setCampaigns(camps);
                    const totSpend = camps.reduce((s,c)=>s+c.spend,0);
                    const totImpr = camps.reduce((s,c)=>s+c.impressions,0);
                    const totClicks = camps.reduce((s,c)=>s+c.clicks,0);
                    const totLeads = camps.reduce((s,c)=>s+c.leads,0);
                    setOverview({ spend:totSpend, impressions:totImpr, clicks:totClicks, leads:totLeads, ctr: totImpr>0?totClicks/totImpr*100:0, cpm: totImpr>0?totSpend/totImpr*1000:0, cpc: totClicks>0?totSpend/totClicks:0, cpl: totLeads>0?totSpend/totLeads:0 });
                    renderChart(camps);
                } catch(e) { setError(e.message); }
                setLoading(false);
            };

            const renderChart = camps => {
                if (!chartRef.current) return;
                const top = [...camps].sort((a,b)=>b.spend-a.spend).slice(0,8);
                const ctx = chartRef.current.getContext('2d');
                if (chartInst.current) chartInst.current.destroy();
                chartInst.current = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: top.map(c=>c.name.length>20?c.name.slice(0,20)+'…':c.name), datasets: [{ label: 'Gasto (R$)', data: top.map(c=>c.spend.toFixed(2)), backgroundColor: 'rgba(24,119,242,.7)', borderColor: '#1877f2', borderWidth: 2, borderRadius: 6 }, { label: 'Leads', data: top.map(c=>c.leads), backgroundColor: 'rgba(0,200,100,.5)', borderColor: '#00c864', borderWidth: 2, borderRadius: 6, yAxisID: 'y2' }] },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: 'rgba(255,255,255,.6)', font: { size: 11 } } } }, scales: { x: { ticks: { color: 'rgba(255,255,255,.5)', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,.05)' } }, y: { ticks: { color: 'rgba(255,255,255,.5)', callback: v => 'R$'+v }, grid: { color: 'rgba(255,255,255,.06)' } }, y2: { position: 'right', ticks: { color: 'rgba(0,200,100,.7)' }, grid: { display: false } } } }
                });
            };

            const loadAdsForAdset = async adsetId => {
                try {
                    const data = await metaGraph(`${adsetId}/ads`, token, { fields: 'name,status,creative{thumbnail_url,image_url,title}', limit: 20 });
                    const ads = (data.data || []).map(ad => ({ id: ad.id, name: ad.name, status: ad.status, thumbnail: ad.creative?.thumbnail_url || ad.creative?.image_url || null }));
                    setAdsetAds(p => ({ ...p, [adsetId]: ads }));
                } catch {}
            };

            const loadAdsets = async campId => {
                if (adsets[campId]) { setExpanded(expanded === campId ? null : campId); return; }
                setLoadingAdsets(campId);
                try {
                    const f = 'name,status,daily_budget,lifetime_budget,insights{spend,reach,impressions,clicks,ctr,actions}';
                    const data = await metaGraph(`${campId}/adsets`, token, { fields: f, limit: 50 });
                    const sets = (data.data||[]).map(s => { const ins = s.insights?.data?.[0]||{}; return { ...s, spend:parseFloat(ins.spend)||0, impressions:parseInt(ins.impressions)||0, clicks:parseInt(ins.clicks)||0, ctr:parseFloat(ins.ctr)||0, leads: getMetaInsightVal(ins,'lead') }; });
                    setAdsets(p=>({...p,[campId]:sets}));
                    setExpanded(campId);
                    sets.forEach(s => loadAdsForAdset(s.id));
                } catch(e) { /* ignore */ }
                setLoadingAdsets(null);
            };

            const gerarPDFCampanha = async camp => {
                if (typeof window.jspdf === 'undefined') { alert('jsPDF não carregado.'); return; }
                const { jsPDF } = window.jspdf;
                setPdfLoadingCamp(camp.id);
                try {
                    const W=1280, H=720, M=42;
                    const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:[W,H] });
                    const fill=(r,g,b)=>doc.setFillColor(r,g,b);
                    const clr=(r,g,b)=>doc.setTextColor(r,g,b);
                    const fnt=(s,sz)=>{doc.setFont('helvetica',s);doc.setFontSize(sz);};
                    const BAR_CLRS=[[24,119,242],[160,96,255],[0,188,212],[255,152,0],[233,30,99],[0,200,83],[255,107,53],[76,175,80]];

                    // ── helpers ──
                    const fetchImgData = async url => {
                        try {
                            const resp=await fetch(url,{mode:'cors'});
                            const blob=await resp.blob();
                            const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
                            const dims=await new Promise(res=>{const im=new Image();im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>res({w:1,h:1});im.src=b64;});
                            return {b64,...dims};
                        } catch {return null;}
                    };
                    const containFit=(iw,ih,bw,bh)=>{const sc=Math.min(bw/iw,bh/ih);return{fw:iw*sc,fh:ih*sc,ox:(bw-iw*sc)/2,oy:(bh-ih*sc)/2};};
                    const tryImg=(data,x,y,bw,bh)=>{
                        if(!data||!data.b64||!data.w||data.w<=0)return false;
                        const {fw,fh,ox,oy}=containFit(data.w,data.h,bw,bh);
                        const fmt=data.b64.includes('image/png')?'PNG':'JPEG';
                        try{doc.addImage(data.b64,fmt,x+ox,y+oy,fw,fh);}catch{}
                        return true;
                    };

                    // ── load Neos logo ──
                    let neosImg=null;
                    try {
                        const ni=new Image(); ni.src='images/LOGOTIPO 2 copiar 2.png';
                        await new Promise(r=>{ni.onload=r;ni.onerror=r;setTimeout(r,1500);});
                        if(ni.naturalWidth>0){
                            const cv=document.createElement('canvas');
                            cv.width=ni.naturalWidth; cv.height=ni.naturalHeight;
                            cv.getContext('2d').drawImage(ni,0,0);
                            neosImg={b64:cv.toDataURL('image/png'),w:ni.naturalWidth,h:ni.naturalHeight};
                        }
                    } catch {}

                    // ── load creative thumbnails ──
                    const sets=adsets[camp.id]||[];
                    const adsFlat=sets.flatMap(s=>(adsetAds[s.id]||[]).filter(a=>a.thumbnail).map(a=>({...a,adsetName:s.name,adsetMet:s})));
                    const creativeImgs=[];
                    for(const ad of adsFlat){
                        const img=await fetchImgData(ad.thumbnail);
                        creativeImgs.push({...ad,img});
                    }

                    // ── page base renderer ──
                    const drawBase=()=>{
                        fill(9,9,20); doc.rect(0,0,W,H,'F');
                        // dot grid
                        fill(22,22,44);
                        for(let gx=M;gx<W-M;gx+=38)for(let gy=92;gy<H-28;gy+=38)doc.ellipse(gx,gy,0.55,0.55,'F');
                        // header bar
                        fill(13,13,28); doc.rect(0,0,W,90,'F');
                        // blue left accent
                        fill(24,119,242); doc.rect(0,0,5,H,'F');
                        // header bottom line
                        fill(24,119,242); doc.rect(5,89,W-5,1.5,'F');
                        // Neos logo
                        let lrx=M+10;
                        if(neosImg&&neosImg.w>0){
                            const lh=56,lw=(neosImg.w/neosImg.h)*lh;
                            doc.addImage(neosImg.b64,'PNG',M+10,17,lw,lh);
                            lrx=M+10+lw+16;
                        }
                        // Meta Ads badge
                        const mbx=W-M-96, mby=20;
                        fill(6,104,225); doc.roundedRect(mbx,mby,94,42,7,7,'F');
                        // left lighter strip (faux gradient)
                        fill(50,130,255); doc.rect(mbx,mby,28,42,'F');
                        fill(6,104,225); doc.rect(mbx+20,mby,74,42,'F');
                        // Meta "M" stylized: two white arcs
                        fill(255,255,255);
                        doc.ellipse(mbx+62,mby+14,4,7,'F');
                        doc.ellipse(mbx+74,mby+14,4,7,'F');
                        fill(6,104,225); doc.ellipse(mbx+68,mby+14,2.5,5,'F');
                        // lower merge arc
                        fill(255,255,255); doc.ellipse(mbx+68,mby+24,5,4,'F');
                        // text
                        fnt('bold',14); clr(255,255,255);
                        doc.text('Meta', mbx+8, mby+27);
                        fnt('normal',7.5); clr(190,220,255);
                        doc.text('Ads', mbx+8, mby+36);
                        return lrx;
                    };

                    // ════════════════════════════
                    // PAGE 1
                    // ════════════════════════════
                    const lrx=drawBase();
                    // Campaign title
                    const campTxt=camp.name.length>52?camp.name.slice(0,52)+'…':camp.name;
                    fnt('bold',20); clr(255,255,255);
                    doc.text(campTxt, lrx, 42);
                    // Status badge
                    const stC=camp.status==='ACTIVE'?[0,200,83]:camp.status==='PAUSED'?[255,152,0]:[136,136,136];
                    const stLbl=CAMP_STATUS_LABEL[camp.status]||camp.status;
                    const stBW=stLbl.length*5.2+14;
                    doc.setFillColor(Math.round(stC[0]*.18),Math.round(stC[1]*.18),Math.round(stC[2]*.18));
                    doc.roundedRect(lrx,52,stBW,15,3,3,'F');
                    fnt('bold',8.5); doc.setTextColor(...stC);
                    doc.text(stLbl, lrx+7, 62);
                    if(camp.objective){fnt('normal',8.5);clr(100,108,150);doc.text('·  '+camp.objective, lrx+stBW+6, 62);}
                    // Period + account
                    const pLabel=DATE_PRESETS.find(d=>d.id===datePreset)?.label||datePreset;
                    fnt('normal',9); clr(140,148,190);
                    doc.text(pLabel, W-M-100, 38,{align:'right'});
                    clr(90,96,135);
                    doc.text(conn.metaUserName||'', W-M-100, 52,{align:'right'});
                    doc.text(new Date().toLocaleDateString('pt-BR'), W-M-100, 64,{align:'right'});

                    // ── KPI ROW ──
                    const kpiDefs=[
                        {l:'Gasto Total',v:fmtMeta(camp.spend,'currency'),c:[24,119,242]},
                        {l:'Impressões',v:fmtMeta(camp.impressions,'int'),c:[160,96,255]},
                        {l:'Cliques',v:fmtMeta(camp.clicks,'int'),c:[0,188,212]},
                        {l:'CTR',v:fmtMeta(camp.ctr,'pct'),c:[255,152,0]},
                        {l:'CPM',v:fmtMeta(camp.cpm,'currency'),c:[233,30,99]},
                        {l:'CPC',v:fmtMeta(camp.cpc,'currency'),c:[255,107,53]},
                        {l:'Leads',v:fmtMeta(camp.leads,'int'),c:[0,200,83]},
                        {l:'CPL',v:camp.leads>0?fmtMeta(camp.cpl,'currency'):'—',c:[76,175,80]},
                    ];
                    const kpiY=91,kpiH=92,kpiCW=W/8;
                    kpiDefs.forEach((k,i)=>{
                        const kx=i*kpiCW;
                        fill(Math.round(9+(k.c[0]-9)*.19),Math.round(9+(k.c[1]-9)*.19),Math.round(20+(k.c[2]-20)*.19));
                        doc.rect(kx,kpiY,kpiCW,kpiH,'F');
                        fill(k.c[0],k.c[1],k.c[2]); doc.rect(kx,kpiY,kpiCW,5,'F');
                        if(i<7){fill(9,9,20);doc.rect(kx+kpiCW,kpiY,1,kpiH,'F');}
                        fnt('normal',8.5); doc.setTextColor(k.c[0],k.c[1],k.c[2]);
                        doc.text(k.l.toUpperCase(),kx+kpiCW/2,kpiY+24,{align:'center'});
                        fnt('bold',22); doc.setTextColor(k.c[0],k.c[1],k.c[2]);
                        doc.text(k.v,kx+kpiCW/2,kpiY+68,{align:'center'});
                    });

                    // ── CONTENT (y=185 to y=688) ──
                    const cY=kpiY+kpiH+2,cH=H-28-cY; // ~631 start, 491 height
                    const splitX=Math.round(W*0.52); // 665

                    // ── LEFT: Horizontal Bar Chart ──
                    const chX=M+4,chW=splitX-M-4-10;
                    fnt('bold',10); clr(155,165,210);
                    doc.text('GASTO POR CONJUNTO DE ANÚNCIOS',chX,cY+17);
                    fill(24,119,242); doc.rect(chX,cY+20,222,1.5,'F');

                    const barSets=[...sets].sort((a,b)=>b.spend-a.spend).slice(0,7);
                    const maxSp=Math.max(...barSets.map(s=>s.spend),1);
                    const bY=cY+29,bH=Math.min(52,Math.floor((cH-38)/Math.max(barSets.length,1))),bGap=5;
                    const nmW=170,bRx=chX+nmW+8,bMaxW=chW-nmW-8-68;

                    barSets.forEach((s,i)=>{
                        const by=bY+i*(bH+bGap),bc=BAR_CLRS[i];
                        if(i%2===0){fill(14,14,28);doc.rect(chX,by,chW,bH,'F');}
                        // Name
                        const nm=s.name.length>21?s.name.slice(0,21)+'…':s.name;
                        fnt('normal',9); clr(145,155,200);
                        doc.text(nm,chX+nmW,by+bH/2+3.5,{align:'right'});
                        // Track
                        fill(20,20,42); doc.roundedRect(bRx,by+9,bMaxW,bH-18,4,4,'F');
                        // Gradient bar fill
                        const fw=maxSp>0?(s.spend/maxSp)*bMaxW:0;
                        if(fw>5){
                            for(let sl=0;sl<6;sl++){
                                const sx=bRx+sl*(fw/6),sw=fw/6+1,t=sl/5;
                                fill(Math.min(255,Math.round(bc[0]*(1-t*.35)+255*t*.25)),
                                     Math.min(255,Math.round(bc[1]*(1-t*.25)+200*t*.2)),
                                     Math.min(255,Math.round(bc[2]*(1-t*.15)+255*t*.2)));
                                doc.roundedRect(sx,by+9,sw,bH-18,4,4,'F');
                            }
                            // glow dot at end
                            fill(Math.min(255,bc[0]+90),Math.min(255,bc[1]+70),Math.min(255,bc[2]+70));
                            doc.ellipse(bRx+fw,by+bH/2,5,5,'F');
                        }
                        // Spend value
                        fnt('bold',9); doc.setTextColor(bc[0],bc[1],bc[2]);
                        doc.text(fmtMeta(s.spend,'currency'),bRx+bMaxW+6,by+bH/2+3.5);
                        // Secondary metrics (if bar tall enough)
                        if(bH>=44){
                            fnt('normal',7.5); clr(80,88,125);
                            doc.text(fmtMeta(s.impressions,'int')+' impr · '+fmtMeta(s.clicks,'int')+' cliq · '+fmtMeta(s.leads,'int')+' leads',bRx,by+bH-6);
                        }
                    });
                    if(!barSets.length){fnt('italic',10);clr(70,70,100);doc.text('Expanda a campanha para ver o gráfico.',chX,cY+60);}

                    // ── RIGHT: Creatives + metrics ──
                    const rX=splitX+10,rW=W-M-rX;
                    fnt('bold',10); clr(155,165,210);
                    doc.text('CRIATIVOS',rX,cY+17);
                    fill(233,30,99); doc.rect(rX,cY+20,72,1.5,'F');

                    const tbW=112,tbH=82,metX=rX+tbW+10,metW=rW-tbW-10,rowH=tbH+8;
                    const maxRows=Math.floor((cH-30)/rowH);
                    creativeImgs.slice(0,Math.min(maxRows,5)).forEach((ad,i)=>{
                        const ry=cY+28+i*rowH;
                        if(ry+tbH>H-30)return;
                        // thumb box
                        fill(16,16,34); doc.roundedRect(rX,ry,tbW,tbH,5,5,'F');
                        const shown=tryImg(ad.img,rX,ry,tbW,tbH);
                        if(!shown){fnt('normal',7.5);clr(50,50,80);doc.text('Sem prévia',rX+tbW/2,ry+tbH/2,{align:'center'});}
                        // color top strip per creative
                        const cc=BAR_CLRS[i%BAR_CLRS.length];
                        fill(...cc); doc.rect(rX,ry,tbW,3,'F');
                        // ad name
                        fnt('bold',9); clr(210,215,245);
                        doc.text((ad.name||'').length>28?(ad.name||'').slice(0,28)+'…':(ad.name||''), metX, ry+13);
                        // adset
                        fnt('normal',7.5); clr(85,92,128);
                        doc.text('↳ '+((ad.adsetName||'').length>32?(ad.adsetName||'').slice(0,32)+'…':(ad.adsetName||'')), metX, ry+24);
                        // metric pills row 1
                        const met=ad.adsetMet||{};
                        const p1=[{l:'Gasto',v:fmtMeta(met.spend,'currency'),c:[24,119,242]},{l:'Impressões',v:fmtMeta(met.impressions,'int'),c:[160,96,255]},{l:'Cliques',v:fmtMeta(met.clicks,'int'),c:[0,188,212]}];
                        let px=metX;
                        p1.forEach(p=>{
                            const pw=Math.min(58,(metW-8)/3);
                            doc.setFillColor(Math.round(p.c[0]*.14),Math.round(p.c[1]*.14),Math.round(p.c[2]*.14));
                            doc.roundedRect(px,ry+30,pw,18,3,3,'F');
                            fnt('normal',6.5); doc.setTextColor(p.c[0],p.c[1],p.c[2]);
                            doc.text(p.l,px+pw/2,ry+38,{align:'center'});
                            fnt('bold',8); doc.setTextColor(p.c[0],p.c[1],p.c[2]);
                            doc.text(p.v,px+pw/2,ry+46,{align:'center'});
                            px+=pw+4;
                        });
                        // metric pills row 2
                        const cpl2=met.leads>0&&met.spend>0?fmtMeta(met.spend/met.leads,'currency'):'—';
                        const p2=[{l:'CTR',v:fmtMeta(met.ctr,'pct'),c:[255,152,0]},{l:'Leads',v:fmtMeta(met.leads,'int'),c:[0,200,83]},{l:'CPL',v:cpl2,c:[76,175,80]}];
                        px=metX;
                        p2.forEach(p=>{
                            const pw=Math.min(58,(metW-8)/3);
                            doc.setFillColor(Math.round(p.c[0]*.14),Math.round(p.c[1]*.14),Math.round(p.c[2]*.14));
                            doc.roundedRect(px,ry+52,pw,18,3,3,'F');
                            fnt('normal',6.5); doc.setTextColor(p.c[0],p.c[1],p.c[2]);
                            doc.text(p.l,px+pw/2,ry+60,{align:'center'});
                            fnt('bold',8); doc.setTextColor(p.c[0],p.c[1],p.c[2]);
                            doc.text(p.v,px+pw/2,ry+68,{align:'center'});
                            px+=pw+4;
                        });
                        // status dot
                        const adSc=ad.status==='ACTIVE'?[0,200,83]:ad.status==='PAUSED'?[255,152,0]:[136,136,136];
                        fnt('bold',7.5); doc.setTextColor(...adSc);
                        doc.text('● '+(CAMP_STATUS_LABEL[ad.status]||ad.status||''), metX, ry+tbH-2);
                        // separator
                        fill(18,18,38); doc.rect(rX,ry+tbH+3,rW,1,'F');
                    });
                    if(!creativeImgs.length){fnt('italic',9);clr(70,70,100);doc.text('Expanda a campanha para',rX,cY+60);doc.text('carregar os criativos.',rX,cY+75);}

                    // ════════════════════════════
                    // PAGE 2: Full creative grid
                    // ════════════════════════════
                    if(creativeImgs.length>0){
                        doc.addPage([W,H],'landscape');
                        const lrx2=drawBase();
                        fnt('bold',19); clr(255,255,255);
                        doc.text('Todos os Criativos', lrx2, 42);
                        fnt('normal',9); clr(90,96,135);
                        doc.text(camp.name.length>50?camp.name.slice(0,50)+'…':camp.name, lrx2, 60);
                        clr(100,108,150);
                        doc.text(DATE_PRESETS.find(d=>d.id===datePreset)?.label||datePreset, W-M-100, 52,{align:'right'});

                        const cols=4,gapX=10,gapY=12;
                        const tcW=(W-M*2-(cols-1)*gapX)/cols; // ~289
                        const tcH=116,tiH=48,cardH=tcH+tiH+gapY;
                        creativeImgs.forEach((ad,i)=>{
                            const col=i%cols,row=Math.floor(i/cols);
                            const cx=M+col*(tcW+gapX),cy=96+row*cardH;
                            if(cy+cardH>H-28)return;
                            const cc2=BAR_CLRS[col%BAR_CLRS.length];
                            fill(14,14,30); doc.roundedRect(cx,cy,tcW,tcH,6,6,'F');
                            fill(...cc2); doc.rect(cx,cy,tcW,4,'F');
                            const ok=tryImg(ad.img,cx,cy,tcW,tcH);
                            if(!ok){fnt('normal',9);clr(55,55,85);doc.text('Sem prévia',cx+tcW/2,cy+tcH/2,{align:'center'});}
                            const iy=cy+tcH+5;
                            fnt('bold',9); clr(205,210,242);
                            doc.text((ad.name||'').length>28?(ad.name||'').slice(0,28)+'…':(ad.name||''),cx+4,iy+11);
                            fnt('normal',7.5); clr(88,94,130);
                            doc.text((ad.adsetName||'').length>28?(ad.adsetName||'').slice(0,28)+'…':(ad.adsetName||''),cx+4,iy+22);
                            const m2=ad.adsetMet||{};
                            fnt('normal',8); doc.setTextColor(cc2[0],cc2[1],cc2[2]);
                            doc.text(fmtMeta(m2.spend,'currency')+' · '+fmtMeta(m2.impressions,'int')+' impr · '+fmtMeta(m2.leads,'int')+' leads',cx+4,iy+33);
                            const adSc5=ad.status==='ACTIVE'?[0,200,83]:ad.status==='PAUSED'?[255,152,0]:[136,136,136];
                            fnt('bold',7); doc.setTextColor(...adSc5);
                            doc.text('● '+(CAMP_STATUS_LABEL[ad.status]||ad.status||''),cx+4,iy+43);
                        });
                    }

                    // ── Footer all pages ──
                    const np=doc.internal.getNumberOfPages();
                    for(let p=1;p<=np;p++){
                        doc.setPage(p);
                        fill(10,10,22); doc.rect(0,H-28,W,28,'F');
                        fill(24,119,242); doc.rect(5,H-28,W-5,1,'F');
                        fnt('normal',7.5); clr(70,76,112);
                        doc.text('Neos Dashboard · '+new Date().toLocaleDateString('pt-BR'),M+8,H-10);
                        doc.text('Pág. '+p+' de '+np, W-M,H-10,{align:'right'});
                        fnt('normal',7); clr(50,56,88);
                        doc.text(camp.name.length>60?camp.name.slice(0,60)+'…':camp.name,W/2,H-10,{align:'center'});
                    }

                    const sfn=camp.name.replace(/[^a-z0-9]/gi,'_').slice(0,40);
                    doc.save('meta_'+sfn+'.pdf');
                } catch(e){ console.error(e); alert('Erro ao gerar PDF: '+e.message); }
                setPdfLoadingCamp(null);
            };

            useEffect(() => {

        /* ── POST CREATOR ───────────────────────────────────── */
        function PostCreator() {
            const { store } = useApp();
            const pj = s => { try { return JSON.parse(s || '[]'); } catch { return []; } };
            const [selClientId, setSelClientId] = useState('');
            const [selTaskId, setSelTaskId] = useState('');
            const [headline, setHeadline] = useState('');
            const [conteudo, setConteudo] = useState('');
            const [personagem, setPersonagem] = useState(null);
            const [formato, setFormato] = useState('');
            const [tom, setTom] = useState('');
            const [generated, setGenerated] = useState(null);
            const [copied, setCopied] = useState(false);
            const [copiedImgId, setCopiedImgId] = useState(null);

            const client = store.clients.find(c => c.id === selClientId);
            /* Parse visualStyle JSON ({ s, f, c }) or fall back to plain text */
            const parseVS = raw => { try { const o = JSON.parse(raw || '{}'); if (o && typeof o.s !== 'undefined') return { style: o.s || '', fonts: o.f || [], colors: o.c || [] }; } catch { } return { style: raw || '', fonts: [], colors: [] }; };
            const vs = parseVS(client?.visualStyle);
            const clientFonts = vs.fonts;
            const clientColors = vs.colors;
            const vsText = vs.style;
            const refImages = (store.clientImages || []).filter(i => i.clientId === selClientId && i.type !== 'pessoa');
            const pessoasImages = (store.clientImages || []).filter(i => i.clientId === selClientId && i.type === 'pessoa');
            const postTasks = selClientId ? (store.tasks || []).filter(t => t.clientId === selClientId && t.category === 'Post' && t.status !== 'Concluído') : [];

            const changeClient = id => { setSelClientId(id); setSelTaskId(''); setHeadline(''); setConteudo(''); setPersonagem(null); setFormato(''); setTom(''); setGenerated(null); };
            const pickTask = id => {
                setSelTaskId(id);
                const t = postTasks.find(x => x.id === id);
                if (t) { setHeadline(t.title || ''); setConteudo(t.desc || t.description || ''); }
            };

            const buildPrompt = () => {
                const tmpl = client?.promptTemplate || '';
                let base = tmpl
                    ? tmpl.replace(/Titulo:/gi, headline).replace(/Conteúdo:/gi, conteudo)
                    : `Crie uma imagem para post de Instagram.\n\nTema: ${headline || '(sem headline)'}\n\nConteúdo: ${conteudo || '(sem conteúdo)'}`;
                const specs = [];
                if (vsText) specs.push(`Estilo Visual: ${vsText}`);
                if (clientFonts.length) specs.push(`Fontes: ${clientFonts.join(', ')}`);
                if (clientColors.length) specs.push(`Cores da marca: ${clientColors.join(', ')}`);
                if (formato) specs.push(`Formato: ${formato}`);
                if (tom) specs.push(`Tom: ${tom}`);
                if (personagem === 'sim') specs.push('Incluir um personagem/pessoa humana na composição.');
                if (personagem === 'nao') specs.push('Não incluir nenhuma pessoa ou personagem na composição.');
                return base + (specs.length ? '\n\n' + specs.join('\n') : '');
            };

            const generate = () => { setGenerated({ prompt: buildPrompt(), refs: [...refImages], pessoas: [...pessoasImages] }); setCopied(false); setCopiedImgId(null); };
            const copy = () => { navigator.clipboard.writeText(generated.prompt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2200); }); };
            const copyImgToClipboard = (dataUrl, id) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    canvas.toBlob(async blob => {
                        try {
                            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                            setCopiedImgId(id); setTimeout(() => setCopiedImgId(null), 2000);
                        } catch { setCopiedImgId(id + '_err'); setTimeout(() => setCopiedImgId(null), 2000); }
                    }, 'image/png');
                };
                img.src = dataUrl;
            };
            const canGenerate = selClientId && (headline || conteudo);

            return (
                <div className="glass fade-in" style={{ marginBottom: 24, borderColor: 'rgba(160,96,255,.25)' }}>
                    {/* Header */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '16px 20px', borderBottom: '1px solid rgba(255,255,255,.05)' }}>
                        <div style={{ width: 26, height: 26, borderRadius: 6, background: 'rgba(160,96,255,.15)', border: '1px solid rgba(160,96,255,.3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(180,120,255,.9)" strokeWidth="2"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                        </div>
                        <h3 style={{ fontSize: 14, fontWeight: 700, color: 'rgba(190,140,255,.95)' }}>Criar Post</h3>
                        {generated && <button className="btn-secondary" onClick={() => setGenerated(null)} style={{ marginLeft: 'auto', fontSize: 11, padding: '3px 10px' }}>← Novo</button>}
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0 }}>
                        {/* LEFT — form */}
                        <div style={{ padding: '18px 20px', borderRight: '1px solid rgba(255,255,255,.05)', display: 'flex', flexDirection: 'column', gap: 13 }}>

                            {/* Cliente */}
                            <div>
                                <L>Cliente</L>
                                <select className="input-field" value={selClientId} onChange={e => changeClient(e.target.value)}>
