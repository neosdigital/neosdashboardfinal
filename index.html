                                {error && (
                                    <div style={{ background: 'rgba(255,0,64,.08)', border: '1px solid rgba(255,0,64,.3)', borderRadius: 8, padding: '10px 14px', fontSize: 13, color: '#ff5070', display: 'flex', alignItems: 'center', gap: 8 }}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
                                        {error}
                                    </div>
                                )}
                                <button type="submit" className="btn-primary"
                                    disabled={loading || !username.trim() || !password}
                                    style={{ width: '100%', justifyContent: 'center', padding: '12px', fontSize: 14, marginTop: 4, opacity: (loading || !username.trim() || !password) ? .6 : 1 }}>
                                    {loading
                                        ? <><span style={{ width: 15, height: 15, border: '2px solid rgba(255,255,255,.3)', borderTopColor: '#fff', borderRadius: '50%', display: 'inline-block', animation: 'spin .7s linear infinite' }} />&nbsp;Entrando...</>
                                        : 'Entrar'}
                                </button>
                            </form>
                        </div>
                        <div style={{ textAlign: 'center', marginTop: 22, fontSize: 11, color: 'rgba(255,255,255,.18)' }}>
                            Neos Dashboard v2.0 &mdash; Acesso interno
                        </div>
                    </div>
                </div>
            );
        }

        /* ── EMPLOYEE ACCESS CONTROL ────────────────────────── */
        const EMPLOYEE_BLOCKED = ['dashboard', 'financial'];

        function LockedView() {
            return (
                <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '65vh', gap: 22 }}>
                    <div style={{ width: 76, height: 76, background: 'rgba(255,0,64,.07)', border: '1px solid rgba(255,0,64,.22)', borderRadius: 20, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(255,0,64,.65)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <div style={{ textAlign: 'center' }}>
                        <div style={{ fontSize: 20, fontWeight: 700, color: 'rgba(255,255,255,.8)', marginBottom: 10 }}>Acesso Restrito</div>
                        <div style={{ fontSize: 13, color: 'rgba(255,255,255,.35)', lineHeight: 1.7 }}>Esta seção é exclusiva para administradores.<br />Entre em contato com o responsável.</div>
                    </div>
                </div>
            );
        }

        function BlurVal({ children }) {
            const { userRole } = useApp();
            if (userRole !== 'admin') {
                return <span style={{ filter: 'blur(6px)', userSelect: 'none', pointerEvents: 'none' }}>{children}</span>;
            }
            return <>{children}</>;
        }

        function ModTag({ rec }) {
            if (!rec?.modifiedBy || !rec?.modifiedAt) return null;
            try {
                const d = new Date(rec.modifiedAt);
                const date = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
                const time = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                return <div style={{ fontSize: 9.5, color: 'rgba(255,255,255,.2)', marginTop: 3, lineHeight: 1.3 }}>Modificado por {rec.modifiedBy} em {date} às {time}</div>;
            } catch { return null; }
        }

        /* ── USER BOX (sidebar) ─────────────────────────────── */
        function UserBox() {
            const { onlineUsers } = useApp();
            const [open, setOpen] = useState(false);
            const ref = useRef(null);
            const me = JSON.parse(sessionStorage.getItem('neos_auth') || 'null');
            const myColor = getUserColor(me?.username || '');
            useEffect(() => {
                const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener('mousedown', h);
                return () => document.removeEventListener('mousedown', h);
            }, []);
            return (
                <div ref={ref} style={{ padding: '0 8px 8px', position: 'relative' }}>
                    <div onClick={() => setOpen(v => !v)} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 8, cursor: 'pointer', background: open ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.09)', transition: 'background .2s' }}>
                        <div style={{ width: 26, height: 26, borderRadius: '50%', background: myColor, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 }}>
                            {(me?.name || '?')[0].toUpperCase()}
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 12, fontWeight: 600, color: '#fff', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{me?.name || 'Usuário'}</div>
                            <div style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', marginTop: 1 }}>{onlineUsers.length + 1} online</div>
                        </div>
                        <div style={{ width: 7, height: 7, borderRadius: '50%', background: '#00c864', boxShadow: '0 0 5px #00c864', flexShrink: 0 }} />
                    </div>
                    {open && (
                        <div style={{ position: 'absolute', bottom: '100%', left: 0, right: 0, marginBottom: 6, background: 'rgba(8,8,22,.98)', border: '1px solid rgba(255,255,255,.1)', borderRadius: 10, padding: '10px 12px', zIndex: 500, boxShadow: '0 -8px 30px rgba(0,0,0,.6)' }}>
                            <div style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '.5px', fontWeight: 600 }}>Online agora</div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 5 }}>
                                <div style={{ width: 18, height: 18, borderRadius: '50%', background: myColor, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 700, color: '#fff' }}>{(me?.name || '?')[0]}</div>
                                <span style={{ fontSize: 12, color: '#fff', fontWeight: 600 }}>{me?.name} <span style={{ color: 'rgba(255,255,255,.35)', fontWeight: 400 }}>(você)</span></span>
                            </div>
                            {onlineUsers.map(u => (
                                <div key={u.k} style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 5 }}>
                                    <div style={{ width: 18, height: 18, borderRadius: '50%', background: u.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 700, color: '#fff' }}>{(u.name || '?')[0]}</div>
                                    <span style={{ fontSize: 12, color: 'rgba(255,255,255,.7)' }}>{u.name}</span>
                                </div>
                            ))}
                            <div style={{ borderTop: '1px solid rgba(255,255,255,.07)', marginTop: 8, paddingTop: 8 }}>
                                <button onClick={() => { sessionStorage.removeItem('neos_auth'); window.location.reload(); }}
                                    style={{ width: '100%', background: 'rgba(255,0,64,.07)', border: '1px solid rgba(255,0,64,.18)', color: '#ff6070', borderRadius: 7, padding: '6px 10px', cursor: 'pointer', fontSize: 12, textAlign: 'left', display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
                                    Sair
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ── CHAT ────────────────────────────────────────────── */
        function Chat() {
            const { chatOpen, setChatOpen, chatMessages, sendChatMsg, onlineUsers, userRole } = useApp();
            const [text, setText] = useState('');
            const endRef = useRef(null);
            const me = JSON.parse(sessionStorage.getItem('neos_auth') || 'null');
            const myKey = me?.username || 'anon';
            const isEmployee = userRole !== 'admin';
            useEffect(() => { if (chatOpen && endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatMessages, chatOpen]);
            if (!chatOpen) return null;
            const send = () => { if (!text.trim()) return; sendChatMsg(text.trim()); setText(''); };
            return (
                <div className="glass fade-in" style={{ position: 'fixed', bottom: isEmployee ? 80 : 144, right: 22, zIndex: 198, width: 310, height: 420, display: 'flex', flexDirection: 'column', boxShadow: '0 8px 40px rgba(0,0,0,.55)', borderColor: 'rgba(160,96,255,.3)' }}>
                    <div style={{ padding: '12px 14px', borderBottom: '1px solid rgba(255,255,255,.07)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
                        <div>
                            <div style={{ fontSize: 13, fontWeight: 700 }}>Chat Interno</div>
                            <div style={{ fontSize: 10, color: 'rgba(255,255,255,.4)', marginTop: 1 }}>{onlineUsers.length > 0 ? onlineUsers.map(u => u.name).join(', ') + ' online' : 'Só você online'}</div>
                        </div>
                        <button onClick={() => setChatOpen(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(255,255,255,.4)', padding: 4 }}><Ic n="x" s={14} /></button>
                    </div>
                    <div style={{ flex: 1, overflowY: 'auto', padding: '10px 14px', display: 'flex', flexDirection: 'column', gap: 10 }}>
                        {chatMessages.length === 0 && <div style={{ textAlign: 'center', color: 'rgba(255,255,255,.22)', fontSize: 12, marginTop: 50, lineHeight: 1.8 }}>Nenhuma mensagem ainda.<br /><span style={{ fontSize: 10 }}>Mensagens não são salvas.</span></div>}
                        {chatMessages.map((msg, i) => {
                            const isMe = msg.k === myKey;
                            return (
                                <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: isMe ? 'flex-end' : 'flex-start' }}>
                                    {!isMe && <div style={{ fontSize: 10, color: msg.color, fontWeight: 700, marginBottom: 3 }}>{msg.name}</div>}
                                    <div style={{ maxWidth: '82%', background: isMe ? 'rgba(160,96,255,.22)' : 'rgba(255,255,255,.07)', border: '1px solid ' + (isMe ? 'rgba(160,96,255,.3)' : 'rgba(255,255,255,.1)'), borderRadius: isMe ? '10px 10px 2px 10px' : '10px 10px 10px 2px', padding: '7px 11px', fontSize: 12, lineHeight: 1.45, wordBreak: 'break-word' }}>{msg.text}</div>
                                    <div style={{ fontSize: 9, color: 'rgba(255,255,255,.2)', marginTop: 2 }}>{new Date(msg.ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
                                </div>
                            );
                        })}
                        <div ref={endRef} />
                    </div>
                    <div style={{ padding: '10px 14px', borderTop: '1px solid rgba(255,255,255,.07)', display: 'flex', gap: 8, flexShrink: 0 }}>
                        <input className="input-field" placeholder="Mensagem… (Enter para enviar)" value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()} style={{ fontSize: 12 }} />
                        <button className="btn-primary" onClick={send} disabled={!text.trim()} style={{ padding: '0 12px', flexShrink: 0 }}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
                        </button>
                    </div>
                </div>
            );
        }

        /* ── APP ────────────────────────────────────────────── */
        function App() {
            const { view, userRole, onlineUsers, chatOpen, setChatOpen } = useApp();
            const [quickAdd, setQuickAdd] = useState(false);
            const isEmployee = userRole !== 'admin';
            const ViewMap = { dashboard: Dashboard, clients: Clients, kanban: Kanban, financial: Financial, traffic: Traffic, design: Design, performance: Performance, calendar: CalendarPage };
            const V = (isEmployee && EMPLOYEE_BLOCKED.includes(view)) ? LockedView : (ViewMap[view] || Dashboard);
            const visible = onlineUsers.filter(c => c.view === view);
            return (
                <div style={{ display: 'flex', minHeight: '100vh' }}>
                    <Sidebar />
                    <main style={{ marginLeft: 210, flex: 1, padding: '26px 30px', minHeight: '100vh' }}>
                        <V />
                    </main>
                    {!isEmployee && (
                        <button className="btn-primary pulse" title="Adicionar Cliente" onClick={() => setQuickAdd(true)}
                            style={{ position: 'fixed', bottom: 22, right: 22, zIndex: 200, borderRadius: 50, width: 50, height: 50, padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 30px rgba(255,0,64,.45)' }}>
                            <Ic n="plus" s={20} />
                        </button>
                    )}
                    <button onClick={() => setChatOpen(c => !c)} title="Chat Interno"
                        style={{ position: 'fixed', bottom: isEmployee ? 22 : 82, right: 22, zIndex: 200, borderRadius: 50, width: 44, height: 44, padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: chatOpen ? '#ff0040' : 'rgba(255,255,255,.08)', border: '1px solid ' + (chatOpen ? '#ff0040' : 'rgba(255,255,255,.15)'), cursor: 'pointer', boxShadow: chatOpen ? '0 0 18px rgba(255,0,64,.4)' : 'none', transition: 'all .2s' }}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
                    </button>
                    <Chat />
                    {quickAdd && <ClientModal onClose={() => setQuickAdd(false)} />}
                    <Toast />
                    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9990 }}>
                        {visible.map(c => (
                            <div key={c.k} style={{ position: 'absolute', left: `${c.x * 100}%`, top: `${c.y * 100}%`, transition: 'left 55ms linear, top 55ms linear', pointerEvents: 'none', transform: 'translate(-2px, -2px)' }}>
                                <svg width="18" height="22" viewBox="0 0 18 22" fill="none">
                                    <path d="M2 2L16 10L10 12L7 19L2 2Z" fill={c.color} stroke="#fff" strokeWidth="1.2" strokeLinejoin="round" />
                                </svg>
                                <div style={{ position: 'absolute', top: 18, left: 14, background: c.color, color: '#fff', fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 6, whiteSpace: 'nowrap', boxShadow: '0 2px 10px rgba(0,0,0,.45)' }}>
                                    {c.name}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Root() {
            const [authed, setAuthed] = useState(() => {
                try { return JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); }
                catch { return null; }
            });
            if (!authed) return <LoginScreen onLogin={setAuthed} />;
            return <AppProvider authed={authed}><App /></AppProvider>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>

</html>
