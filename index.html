                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in" style={{ maxWidth: 480 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
                            <h3 style={{ fontSize: 15, fontWeight: 700 }}>{campaign ? 'Editar Campanha' : 'Nova Campanha'}</h3>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer' }}><Ic n="x" s={16} /></button>
                        </div>
                        <form onSubmit={sub} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                            <div><L>Nome da Campanha *</L><input className="input-field" value={f.campaignName} onChange={e => s('campaignName', e.target.value)} required placeholder="Ex: Campanha Maio — Remarketing" /></div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                                <div><L>Mês</L>
                                    <select className="input-field" value={f.month} onChange={e => s('month', parseInt(e.target.value))}>
                                        {MESES.map((m, i) => <option key={i} value={i + 1}>{m}</option>)}
                                    </select>
                                </div>
                                <div><L>Ano</L><input className="input-field" type="number" value={f.year} onChange={e => s('year', parseInt(e.target.value))} min="2020" max="2035" /></div>
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                                {[['Investimento (R$)', 'budget'], ['CPL (R$)', 'cpl'], ['CPA (R$)', 'cpa'], ['ROAS', 'roas'], ['Leads', 'leads'], ['Vendas', 'sales']].map(([l, k]) => (
                                    <div key={k}><L>{l}</L><input className="input-field" type="number" value={f[k]} onChange={e => s(k, e.target.value)} placeholder="0" /></div>
                                ))}

                                <button type="button" className="btn-secondary" onClick={onClose}>Cancelar</button>
                                <button type="submit" className="btn-primary">{campaign ? 'Salvar' : '+ Criar Campanha'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        /* ── CAMPAIGN COMPARISON MODAL ───────────────────────── */
        function CampaignComparisonModal({ onClose }) {
            const [a, setA] = useState({ nome: 'Campanha A', budget: '', leads: '', sales: '', cpa: '' });
            const [b, setB] = useState({ nome: 'Campanha B', budget: '', leads: '', sales: '', cpa: '' });
            const [result, setResult] = useState(null);
            const [pdfLoad, setPdfLoad] = useState(false);
            const sa = (k, v) => setA(p => ({ ...p, [k]: v }));
            const sb = (k, v) => setB(p => ({ ...p, [k]: v }));
            const compare = () => {
                const calc = f => { const bg = parseFloat(f.budget) || 0, ld = parseInt(f.leads) || 0, sl = parseInt(f.sales) || 0, cp = parseFloat(f.cpa) || 0; return { budget: bg, leads: ld, sales: sl, cpa: cp, cpl: ld > 0 && bg > 0 ? bg / ld : 0, roas: bg > 0 && sl > 0 ? sl * cp / bg : 0, conv: ld > 0 ? (sl / ld) * 100 : 0, rev: sl * cp }; };
                const ra = calc(a), rb = calc(b);
                const diff = k => rb[k] > 0 && ra[k] > 0 ? ((rb[k] - ra[k]) / ra[k] * 100).toFixed(1) : null;
                setResult({ ra, rb, diffs: { cpl: diff('cpl'), roas: diff('roas'), conv: diff('conv'), rev: diff('rev'), leads: diff('leads') } });
            };
            const DiffBadge = ({ v, invert }) => { if (v === null) return <span style={{ color: 'rgba(255,255,255,.3)', fontSize: 11 }}>—</span>; const n = parseFloat(v); const pos = invert ? n < 0 : n > 0; return <span style={{ color: pos ? '#00c864' : '#ff4060', fontSize: 12, fontWeight: 700 }}>{n > 0 ? '+' : ''}{v}%</span>; };
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box fade-in" style={{ maxWidth: 640 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
                            <h3 style={{ fontSize: 15, fontWeight: 700 }}>Comparativo de Campanhas</h3>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer' }}><Ic n="x" s={16} /></button>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
                            {[{ label: 'Campanha A (Antiga)', vals: a, set: sa }, { label: 'Campanha B (Nova)', vals: b, set: sb }].map(({ label, vals, set }) => (
                                <div key={label} style={{ background: 'rgba(255,255,255,.03)', border: '1px solid rgba(255,255,255,.07)', borderRadius: 10, padding: 14 }}>
                                    <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 12, color: 'rgba(255,255,255,.7)' }}>{label}</div>
                                    <input className="input-field" style={{ marginBottom: 8, fontSize: 12 }} placeholder="Nome" value={vals.nome} onChange={e => set('nome', e.target.value)} />
                                    {[['Investimento', 'budget'], ['Leads', 'leads'], ['Vendas', 'sales'], ['CPA (R$)', 'cpa']].map(([l, k]) => (
                                        <div key={k} style={{ marginBottom: 8 }}><div style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', marginBottom: 3, fontWeight: 700, textTransform: 'uppercase', letterSpacing: .4 }}>{l}</div><input className="input-field" type="number" style={{ fontSize: 12 }} placeholder="0" value={vals[k]} onChange={e => set(k, e.target.value)} /></div>

        /* ── LOGIN SCREEN ───────────────────────────────────── */
        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [showPwd, setShowPwd] = useState(false);

            const handleLogin = async e => {
                e.preventDefault();
                if (!username.trim() || !password) return;
                setLoading(true);
                setError('');
                try {
                    const hash = await hashPassword(password);
                    const timeout = new Promise((_, rej) =>
                        setTimeout(() => rej(new Error('timeout')), 10000)
                    );
                    const { data, error } = await Promise.race([
                        supabase
                            .from('login_users')
                            .select('id, name, username, role')
                            .eq('username', username.trim().toLowerCase())
                            .eq('password_hash', hash)
                            .maybeSingle(),
                        timeout
                    ]);
                    if (error || !data) {
                        setError('Usuário ou senha inválidos.');
                    } else {
                        sessionStorage.setItem('neos_auth', JSON.stringify({ id: data.id, name: data.name, username: data.username, role: data.role }));
                        onLogin(data);
                    }
                } catch (err) {
                    if (err.message === 'timeout') {
                        setError('Servidor demorando para responder — tente novamente em alguns segundos.');
                    } else {
                        setError('Erro de conexão. Verifique sua internet.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div style={{ minHeight: '100vh', background: '#07070f', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden' }}>
                    <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse 80% 50% at 50% -5%, rgba(255,0,64,.14) 0%, transparent 70%)', pointerEvents: 'none' }} />
                    <div style={{ position: 'absolute', bottom: 0, left: '50%', transform: 'translateX(-50%)', width: 600, height: 300, background: 'radial-gradient(ellipse at center, rgba(255,0,64,.05) 0%, transparent 70%)', pointerEvents: 'none' }} />

        /* ── META ADS HELPERS ── */
        const META_V = 'v19.0';
        const metaGraph = async (path, token, params = {}) => {
            const qs = new URLSearchParams({ access_token: token, ...params }).toString();
            const r = await fetch(`https://graph.facebook.com/${META_V}/${path}?${qs}`);
            const d = await r.json();
            if (d.error) throw new Error(d.error.user_message || d.error.message);
            return d;
        };
        const initFB = appId => new Promise(resolve => {
            window._fbAppId = appId;
            if (window.FB) { FB.init({ appId, cookie: true, xfbml: false, version: META_V }); resolve(FB); return; }
            const orig = window.fbAsyncInit;
            window.fbAsyncInit = () => { FB.init({ appId, cookie: true, xfbml: false, version: META_V }); if (orig) orig(); resolve(FB); };
            if (document.querySelector('script[src*="connect.facebook.net"]')) { setTimeout(() => window.FB && resolve(window.FB), 1000); }
        });
        const metaLogin = (appId, scope) => new Promise((resolve, reject) => {
            initFB(appId).then(fb => {
                fb.login(resp => {
                    if (resp.authResponse) resolve(resp.authResponse);
                    else reject(new Error('Login cancelado'));
                }, { scope, auth_type: 'rerequest' });
            }).catch(reject);

                </div>
                {showAnalysisFromModal && <StrategicAnalysisModal lead={f} onClose={()=>setShowAnalysisFromModal(false)} />}
            </React.Fragment>
            );
        }

        /* Timer ao vivo de "há quanto tempo esse lead chegou". Nas primeiras
           24h atualiza a cada segundo (mm:ss ou Hh MMm); depois disso vira
           um rótulo estático em dias, sem manter interval rodando à toa. */
        function LeadAgeTimer({ createdAt }) {
            const createdMs = createdAt ? new Date(createdAt).getTime() : null;
            const isRecent = createdMs ? (Date.now() - createdMs) < 24 * 3600 * 1000 : false;
            const [now, setNow] = useState(Date.now());
            useEffect(() => {
                if (!isRecent) return;
                const iv = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(iv);
            }, [isRecent]);
            if (!createdMs) return null;
            const diffMs = Math.max(0, (isRecent ? now : Date.now()) - createdMs);
            const totalSec = Math.floor(diffMs / 1000);
            const d = Math.floor(totalSec / 86400);
            const h = Math.floor((totalSec % 86400) / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            let label;
            if (d > 0) label = `há ${d}d`;
            else if (h > 0) label = `há ${h}h ${String(m).padStart(2, '0')}m`;
            else label = `há ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            const urgent = totalSec < 3600;
            return (
                <div style={{ fontSize: 9.5, fontWeight: 700, color: urgent ? '#ff4060' : 'rgba(255,255,255,.35)', marginBottom: 3, display: 'flex', alignItems: 'center', gap: 4, fontVariantNumeric: 'tabular-nums' }}>
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" strokeLinecap="round" /></svg>
                    {label}
                </div>
            );
        }

        function LeadCard({ lead, clr, onDragStart, onClick, onDelete, lastInt, selected }) {
            const fmtV = v => v >= 1000 ? 'R$'+(v/1000).toFixed(1)+'k' : v > 0 ? 'R$'+v : null;
            const score5 = Math.round((lead.score||0)/20);
            return (
                <div draggable onDragStart={e=>onDragStart(e,lead)} onClick={onClick}
                    style={{ background: selected ? clr+'18' : 'rgba(255,255,255,.04)', border: selected ? `1.5px solid ${clr}88` : `1px solid ${clr}22`, borderLeft:`3px solid ${clr}`, borderRadius:8, padding:'10px 12px', cursor:'pointer', transition:'background .12s', position:'relative' }}
                    onMouseEnter={e=>e.currentTarget.style.background= selected ? clr+'28' : 'rgba(255,255,255,.08)'}

                        onMouseEnter={e=>e.currentTarget.style.color='#ff4060'} onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,.28)'}>✕</button>
                    <LeadAgeTimer createdAt={lead.createdAt} />
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:4, paddingRight:14 }}>
                        <div style={{ fontSize:12.5, fontWeight:600, lineHeight:1.3, flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginRight:6 }}>{lead.name}</div>
                        {lead.priority && <div style={{ width:7, height:7, borderRadius:'50%', background:LEAD_PCOL[lead.priority]||'#666', flexShrink:0, marginTop:3 }} title={lead.priority} />}
                    </div>
                    {lead.company && <div style={{ fontSize:10.5, color:'rgba(255,255,255,.42)', marginBottom:4, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{lead.company}</div>}
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: lead.score > 0 ? 5 : 0 }}>
                        {fmtV(parseFloat(lead.value)||0) ? <span style={{ fontSize:11, color:clr, fontWeight:700 }}>{fmtV(parseFloat(lead.value)||0)}</span> : <span />}
                        {lead.origin && <span style={{ fontSize:9, background:'rgba(255,255,255,.05)', borderRadius:4, padding:'1px 5px', color:'rgba(255,255,255,.35)' }}>{lead.origin}</span>}
                    </div>
                    {lead.score > 0 && <div style={{ display:'flex', gap:2, marginBottom:5 }}>{[1,2,3,4,5].map(s=><div key={s} style={{ height:3, flex:1, borderRadius:2, background: s<=score5 ? clr : 'rgba(255,255,255,.1)' }} />)}</div>}
                    {lastInt && <div style={{ fontSize:9, color:'rgba(255,255,255,.26)', marginTop:3 }}>Últ: {lastInt.type} · {lastInt.date ? new Date(lastInt.date+'T12:00').toLocaleDateString('pt-BR') : ''}</div>}
                    {lead.responsible && <div style={{ fontSize:9.5, color:'rgba(255,255,255,.28)', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>→ {lead.responsible}</div>}
                    {lead.qualification && <div style={{ display:'inline-block', marginTop:3, fontSize:9, padding:'1px 6px', borderRadius:10, background:(LEAD_QUAL_CLR[lead.qualification]||'#888')+'22', color:LEAD_QUAL_CLR[lead.qualification]||'#888', border:`1px solid ${(LEAD_QUAL_CLR[lead.qualification]||'#888')}44` }}>{lead.qualification}</div>}
                </div>
            );
        }

        /* ── STRATEGIC ANALYSIS MODAL ─────────────────────────── */
        const _SA_OBJECTIVES = ['Gerar mais leads','Aumentar vendas','Fortalecer marca','Crescer nas redes sociais','Melhorar posicionamento','Melhorar conversão','Lançar produto','Outros'];
        const _SA_STEP_LABELS = ['Informações Básicas','Identidade da Marca','Objetivos','Presença Digital'];

        function StrategicAnalysisModal({ lead, onClose }) {
            const now2 = new Date();
            const blank2 = { companyName: lead?.company||'', responsible: lead?.name||'', segment:'', cityState:'', website:'', instagram:'', facebook:'', linkedin:'', tiktok:'', youtube:'', companyDesc:'', valueProposition:'', differentials:'', targetAudience:'', productsServices:'', competitors:'', objectives:[], postsPerWeek:'2', paidTraffic:false, marketingTeam:false, visualIdentity:false, contentStrategy:false, hasCRM:false, hasAutomations:false, logoData:null, logoName:'', observations:'' };
            const [fd, setFd] = useState(blank2);
            const [step, setStep] = useState(1);
            const [generating, setGenerating] = useState(false);
            const [progress, setProgress] = useState('');
            const [pct, setPct] = useState(0);

            const sf = (k, v) => setFd(p => ({ ...p, [k]: v }));
            const togObj = o => setFd(p => ({ ...p, objectives: p.objectives.includes(o) ? p.objectives.filter(x => x !== o) : [...p.objectives, o] }));
            const togBool = k => setFd(p => ({ ...p, [k]: !p[k] }));

            const handleLogo = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => { sf('logoData', ev.target.result); sf('logoName', file.name); };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            const calcScore = () => {
                let s = 0;
                const p = parseInt(fd.postsPerWeek) || 0;
                if (p >= 7) s += 40; else if (p >= 5) s += 34; else if (p >= 3) s += 26; else if (p >= 1) s += 14; else s += 0;
                if (fd.paidTraffic) s += 15;
                if (fd.marketingTeam) s += 10;
                if (fd.visualIdentity) s += 12;
                if (fd.contentStrategy) s += 12;
                if (fd.hasCRM) s += 6;
                if (fd.hasAutomations) s += 5;
                return Math.min(s, 100);
            };

            const scoreInfo = sc => {
                if (sc <= 20) return { label:'Crítico', color:'#ff4060', rgb:[255,64,96] };
                if (sc <= 40) return { label:'Baixo', color:'#ff8030', rgb:[255,128,48] };
                if (sc <= 60) return { label:'Médio', color:'#ffcc00', rgb:[255,204,0] };
                if (sc <= 80) return { label:'Bom', color:'#00c864', rgb:[0,200,100] };
                return { label:'Excelente', color:'#4090ff', rgb:[64,144,255] };
            };

            const generatePDF = async () => {
                if (typeof window.jspdf === 'undefined') { alert('jsPDF não carregado.'); return; }
                setGenerating(true);
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
                    const W = 595.28, H = 841.89, M = 42, CW = W - M * 2;
                    let y = M, pg = 1;
                    const score = calcScore();
                    const si = scoreInfo(score);
                    const today = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

                    /* helpers */
                    const hr = hex => [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
                    const setFill = hex => { const [r,g,b]=hr(hex); doc.setFillColor(r,g,b); };
                    const setTxt = hex => { const [r,g,b]=hr(hex); doc.setTextColor(r,g,b); };
                    const setStroke = hex => { const [r,g,b]=hr(hex); doc.setDrawColor(r,g,b); };

                    /* NEOS logo load */
                    let nL=null, nW=0, nH=0;
                    try {
                        const img=new Image(); img.src='images/LOGOTIPO 2 copiar 2.png';
                        await new Promise(r=>{img.onload=r;img.onerror=r;setTimeout(r,2000);});
                        if (img.naturalWidth>0){
                            const rat=Math.min(110/img.naturalWidth,38/img.naturalHeight);
                            nW=img.naturalWidth*rat; nH=img.naturalHeight*rat;
                            const lc=document.createElement('canvas'); lc.width=img.naturalWidth; lc.height=img.naturalHeight;
                            lc.getContext('2d').drawImage(img,0,0); nL=lc.toDataURL('image/png');
                        }
                    } catch {}

                    /* client logo load */
                    let cL=null, cLW=0, cLH=0;
                    if (fd.logoData) {
                        try {
                            const img=new Image(); img.src=fd.logoData;
                            await new Promise(r=>{img.onload=r;img.onerror=r;setTimeout(r,1500);});
                            if (img.naturalWidth>0){
                                const rat=Math.min(150/img.naturalWidth,70/img.naturalHeight);
                                cLW=img.naturalWidth*rat; cLH=img.naturalHeight*rat;
                                cL=fd.logoData;
                            }
                        } catch {}
                    }

                    const pgHeader = (section) => {
                        doc.setFillColor(13,12,37); doc.rect(0,0,W,33,'F');
                        doc.setFillColor(230,51,85); doc.rect(0,32,W,2,'F');
                        if (nL) doc.addImage(nL,'PNG',M,(33-nH)/2,nW,nH);
                        else { doc.setFont('helvetica','bold'); doc.setFontSize(8); setTxt('#e63355'); doc.text('NEOS',M,21); }
                        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); setTxt('#7777aa');
                        doc.text('ANÁLISE ESTRATÉGICA — '+(fd.companyName||'').toUpperCase(),W/2,20,{align:'center'});
                        doc.text(String(pg),W-M,21,{align:'right'});
                        doc.setDrawColor(60,60,100); doc.setLineWidth(0.4);
                        doc.line(M,H-18,W-M,H-18);
                        doc.setFontSize(7); setTxt('#555577');
                        doc.text('Desenvolvido por NEOS Digital — Análise Estratégica de Posicionamento Digital',W/2,H-9,{align:'center'});
                    };

                    const np = (section) => { doc.addPage(); pg++; y=50; pgHeader(section); };
                    const chk = (n,sec) => { if (y+n>H-40) np(sec); };

                    const secTitle = (title,sub) => {
                        chk(52,title);
                        doc.setFont('helvetica','bold'); doc.setFontSize(16); setTxt('#1a1a2e');
                        doc.text(title,M,y); y+=sub?18:22;
                        if (sub){ doc.setFont('helvetica','normal'); doc.setFontSize(9); setTxt('#8888aa'); doc.text(sub,M,y); y+=16; }
                        setFill('#e63355'); doc.rect(M,y,48,2.5,'F');
                        setFill('#e8e8f0'); doc.rect(M+50,y,CW-50,2.5,'F');
                        y+=14;
                    };

                    const subHdr = (title,color) => {
                        chk(28,title);
                        const col=color||'#1a1a2e';
                        setFill('#f0f2ff'); doc.rect(M,y,CW,20,'F');
                        const [r,g,b]=hr(color||'#e63355'); doc.setFillColor(r,g,b); doc.rect(M,y,3,20,'F');
                        doc.setFont('helvetica','bold'); doc.setFontSize(9); setTxt(col);
                        doc.text(title.toUpperCase(),M+10,y+13); y+=27;
                    };

                    const para = (text,sec) => {
                        const lines=doc.splitTextToSize(text,CW);
                        chk(lines.length*13+6,sec||'');
                        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); setTxt('#333355');
                        doc.text(lines,M,y); y+=lines.length*13+8;
                    };

                    const bul = (text,color,sec) => {
                        const lines=doc.splitTextToSize(text,CW-18);
                        chk(lines.length*13+5,sec||'');
                        const [r,g,b]=hr(color||'#e63355');
                        doc.setFillColor(r,g,b); doc.circle(M+4,y-2.5,2.5,'F');
                        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); setTxt('#333355');
                        doc.text(lines,M+14,y); y+=lines.length*13+5;
                    };

                    const mCard = (lbl,val,color,x,w,h) => {
                        const [r,g,b]=hr(color);
                        doc.setFillColor(248,248,255); doc.roundedRect(x,y,w,h||50,5,5,'F');
                        doc.setFillColor(r,g,b); doc.rect(x,y,3,h||50,'F');
                        setStroke(color); doc.setLineWidth(0.4); doc.roundedRect(x,y,w,h||50,5,5,'D');
                        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); setTxt('#888888');
                        doc.text(lbl,x+9,y+14);
                        doc.setFont('helvetica','bold');
                        const vs=String(val); doc.setFontSize(vs.length>10?9:vs.length>6?12:17);
                        doc.setTextColor(r,g,b); doc.text(vs,x+9,y+35);
                    };

                    const name  = fd.companyName||'a empresa';
                    const seg   = fd.segment||'seu segmento';
                    const city  = fd.cityState||'';
                    const posts = parseInt(fd.postsPerWeek)||0;
                    const socials = [fd.instagram,fd.facebook,fd.linkedin,fd.tiktok,fd.youtube].filter(Boolean);
                    const objs  = fd.objectives;

                    /* ══ CAPA ══════════════════════════════════════════════ */
                    setProgress('Gerando capa...'); setPct(5);
                    doc.setFillColor(13,12,37); doc.rect(0,0,W,H,'F');
                    doc.setFillColor(230,51,85); doc.rect(0,0,W,5,'F');
                    doc.setFillColor(230,51,85); doc.rect(0,H-5,W,5,'F');
                    doc.setFillColor(26,26,60); doc.rect(W*0.62,0,W*0.4,H,'F');

                    if (nL) doc.addImage(nL,'PNG',W-M-nW*1.3,22,nW*1.3,nH*1.3);
                    else { doc.setFont('helvetica','bold'); doc.setFontSize(9); setTxt('#e63355'); doc.text('NEOS DIGITAL',W-M,30,{align:'right'}); }

                    if (cL) doc.addImage(cL,'PNG',(W-cLW)/2,90,cLW,cLH);

                    const titleY = cL ? 185 : 130;
                    doc.setFont('helvetica','bold'); doc.setFontSize(8); setTxt('#e63355');

                    doc.setFont('helvetica','bold'); doc.setFontSize(30); setTxt('#ffffff');
                    const nameLines=doc.splitTextToSize(fd.companyName||'Empresa',CW);
                    nameLines.forEach((nl,i)=>doc.text(nl,W/2,titleY+28+i*34,{align:'center'}));
                    const afterName=titleY+28+nameLines.length*34;
                    doc.setFont('helvetica','normal'); doc.setFontSize(11); setTxt('#aaaacc');

                    doc.setDrawColor(230,51,85); doc.setLineWidth(1.5);
                    doc.line(W/2-70,afterName+22,W/2+70,afterName+22);

                    const infoY=afterName+42;
                    const infoItems=[['Segmento',fd.segment||'—'],['Localização',fd.cityState||'—'],['Responsável',fd.responsible||'—'],['Data',today]].filter(([,v])=>v!=='—');
                    infoItems.forEach(([lbl,val],i)=>{
                        const ix=M+(i%2)*(CW/2+8), iy=infoY+Math.floor(i/2)*44;
                        doc.setFillColor(22,22,54); doc.roundedRect(ix,iy,CW/2,36,4,4,'F');
                        doc.setFont('helvetica','normal'); doc.setFontSize(7); setTxt('#7777aa');
                        doc.text(lbl.toUpperCase(),ix+10,iy+12);
                        doc.setFont('helvetica','bold'); doc.setFontSize(10); setTxt('#ddddee');
                        doc.text(String(val).slice(0,26),ix+10,iy+27);
                    });

                    const scoreY=infoY+Math.ceil(infoItems.length/2)*44+18;
                    const [sr,sg,sb]=si.rgb;
                    doc.setFillColor(22,22,54); doc.roundedRect(M+CW/2-85,scoreY,170,68,6,6,'F');
                    doc.setDrawColor(sr,sg,sb); doc.setLineWidth(1); doc.roundedRect(M+CW/2-85,scoreY,170,68,6,6,'D');
                    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); setTxt('#8888bb');
                    doc.text('SCORE DE PRESENÇA DIGITAL',W/2,scoreY+14,{align:'center'});
                    doc.setFont('helvetica','bold'); doc.setFontSize(32); doc.setTextColor(sr,sg,sb);
                    doc.text(String(score),W/2-10,scoreY+48,{align:'center'});
                    doc.setFontSize(13); doc.text('/100',W/2+20,scoreY+48);
                    doc.setFontSize(10); doc.text(si.label,W/2,scoreY+63,{align:'center'});

                    doc.setFont('helvetica','normal'); doc.setFontSize(8); setTxt('#555577');
                    doc.text('Desenvolvido por NEOS Digital',W/2,H-25,{align:'center'});
                    doc.text('Relatório confidencial — uso exclusivo do destinatário',W/2,H-13,{align:'center'});

                    /* ══ PÁG 2: RESUMO EXECUTIVO ════════════════════════ */
                    setProgress('Resumo executivo...'); setPct(12);
                    doc.addPage(); pg=2; y=50; pgHeader('Resumo Executivo');

                    secTitle('Resumo Executivo','Diagnóstico estratégico da situação atual');

                    subHdr('Situação Atual','#1a1a2e');
                    const isLow=score<41, isMed=score>=41&&score<71, isHigh=score>=71;
                    para(`${name} é uma empresa${seg?` do segmento de ${seg}`:''}${city?', localizada em '+city:''}. O diagnóstico realizado identificou um Score de Presença Digital de ${score}/100, classificado como ${si.label}.`,'Resumo Executivo');
                    if (isLow) para(`A análise evidencia que a marca ainda não estruturou de forma consistente sua estratégia digital. Existem lacunas significativas em pilares fundamentais como frequência de conteúdo, investimento em mídia paga e ferramentas de gestão — fatores que limitam diretamente o crescimento e a visibilidade da empresa.`,'Resumo Executivo');
                    else if (isMed) para(`A empresa possui bases digitais em construção, com alguns pilares já estabelecidos, porém com oportunidades claras de evolução. Há consistência em certas frentes, mas gaps importantes que impedem ${name} de atingir seu pleno potencial de posicionamento e geração de resultados previsíveis.`,'Resumo Executivo');
                    else para(`${name} demonstra maturidade digital acima da média do mercado, com processos e canais bem estruturados. O momento é estratégico para otimizar o que já funciona e escalar resultados, consolidando a posição de autoridade no segmento.`,'Resumo Executivo');
                    if (fd.companyDesc) para(`Contexto da empresa: "${fd.companyDesc.slice(0,180)}${fd.companyDesc.length>180?'...':''}"`, 'Resumo Executivo');
                    y+=4;

                    subHdr('Principais Pontos Fortes','#00c864');
                    if (fd.visualIdentity) bul('Identidade visual definida — transmite profissionalismo e facilita o reconhecimento da marca.','#00c864','Resumo Executivo');
                    if (fd.paidTraffic) bul('Investimento em tráfego pago — visão estratégica e comprometimento com resultados mensuráveis.','#00c864','Resumo Executivo');
                    if (fd.marketingTeam) bul('Equipe de marketing estruturada — diferencial competitivo para execução das estratégias.','#00c864','Resumo Executivo');
                    if (fd.hasCRM) bul('CRM implementado — gestão organizada do relacionamento com clientes e leads.','#00c864','Resumo Executivo');
                    if (fd.hasAutomations) bul('Automações ativas — eficiência operacional que permite escalar sem aumentar custos.','#00c864','Resumo Executivo');
                    if (fd.contentStrategy) bul('Estratégia de conteúdo definida — base para construção de autoridade e relacionamento.','#00c864','Resumo Executivo');

        const parseLeadTexts = raw => {
            const STATUS_MAP = { 'novos': 'Novos Leads', 'novo': 'Novos Leads', 'contato': 'Contato Inicial', 'qualificação': 'Qualificação', 'qualificacao': 'Qualificação', 'proposta': 'Proposta Enviada', 'follow': 'Follow-up', 'follow-up': 'Follow-up', 'negociação': 'Em Negociação', 'negociacao': 'Em Negociação', 'ganho': 'Fechado Ganho', 'fechado': 'Fechado Ganho', 'perdido': 'Perdido' };
            const PRI_MAP = { 'alta': 'Alta', 'alto': 'Alta', 'média': 'Média', 'media': 'Média', 'baixa': 'Baixa', 'baixo': 'Baixa' };
            const ORI_LIST = ['Manual','Site','Indicação','Meta Ads','Google Ads','WhatsApp','E-mail','Instagram','LinkedIn','Outro'];
            const blocks = raw.trim().split(/\n[ \t]*\n+/);
            return blocks.map(block => {
                const lead = { name:'', company:'', phone:'', email:'', status:'Novos Leads', origin:'Manual', responsible:'', value:'', priority:'Média', tags:'', notes:'', nextAction:'', score:0 };
                const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
                for (const line of lines) {
                    const lower = line.toLowerCase();
                    const val = line.split(':').slice(1).join(':').trim();
                    if (lower.startsWith('nome:')) lead.name = val;
                    else if (lower.startsWith('empresa:') || lower.startsWith('company:')) lead.company = val;
                    else if (lower.startsWith('tel:') || lower.startsWith('telefone:') || lower.startsWith('whatsapp:') || lower.startsWith('fone:')) lead.phone = val;
                    else if (lower.startsWith('email:') || lower.startsWith('e-mail:')) lead.email = val;
                    else if (lower.startsWith('status:')) { const k = val.toLowerCase().replace(/\s+/g,''); lead.status = STATUS_MAP[k] || STATUS_MAP[Object.keys(STATUS_MAP).find(s => k.includes(s)) || ''] || 'Novos Leads'; }
                    else if (lower.startsWith('origem:') || lower.startsWith('origin:')) { lead.origin = ORI_LIST.find(o => o.toLowerCase().includes(val.toLowerCase())) || val || 'Manual'; }
                    else if (lower.startsWith('responsável:') || lower.startsWith('responsavel:') || lower.startsWith('resp:')) lead.responsible = val;
                    else if (lower.startsWith('valor:') || lower.startsWith('value:')) lead.value = val.replace(/[^0-9.,]/g, '').replace(',', '.');
                    else if (lower.startsWith('prioridade:') || lower.startsWith('priority:')) lead.priority = PRI_MAP[val.toLowerCase()] || 'Média';
                    else if (lower.startsWith('tags:')) lead.tags = val;
                    else if (lower.startsWith('obs:') || lower.startsWith('observação:') || lower.startsWith('observacao:') || lower.startsWith('notas:') || lower.startsWith('notes:')) lead.notes = val;
                    else if (lower.startsWith('ação:') || lower.startsWith('acao:') || lower.startsWith('próxima ação:') || lower.startsWith('proxima acao:')) lead.nextAction = val;
                    else if (!lead.name && !lower.includes(':') && line.length > 1) lead.name = line;
                }
                return lead;
            }).filter(l => l.name.trim());
        };

        function GoalsPage() {
            const { store, addGoal, editGoal, deleteGoal } = useApp();
            const goals = store.goals || [];
            const leads = store.leads || [];
            const clients = store.clients || [];
            const tasks = store.tasks || [];
            const financials = store.financials || [];
            const trafficData = store.trafficData || [];

            const [tab, setTab] = useState('overview');
            const [showAdd, setShowAdd] = useState(false);
            const [editing, setEditing] = useState(null);
            const [filterCat, setFilterCat] = useState('');
            const [filterPeriod, setFilterPeriod] = useState('');
            const [updateId, setUpdateId] = useState(null);
            const [updateVal, setUpdateVal] = useState('');

            const now = new Date();
            const today = now.toISOString().slice(0, 10);
            const thisMonth = now.toISOString().slice(0, 7);
            const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().slice(0, 7);
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const dayOfMonth = now.getDate();
            const monthProg = dayOfMonth / daysInMonth;

            const fmtR = v => 'R$ ' + (parseFloat(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            const fmtN = (v, u) => { if (!v && v !== 0) return '—'; const n = parseFloat(v); if (u === 'R$') return fmtR(n); return n.toLocaleString('pt-BR') + (u ? ' ' + u : ''); };
            const pctOf = (v, t) => t > 0 ? Math.min((v / t * 100), 100).toFixed(0) : 0;
            const deltaClr = d => parseFloat(d) >= 0 ? '#00c853' : '#ff4060';
            const deltaSign = d => parseFloat(d) >= 0 ? '+' : '';

            /* ── FINANCIAL ── */
            const recMes = financials.filter(f => f.status === 'Pago' && (f.date || '').startsWith(thisMonth)).reduce((s, f) => s + (parseFloat(f.amount) || 0), 0);
            const recUlt = financials.filter(f => f.status === 'Pago' && (f.date || '').startsWith(lastMonth)).reduce((s, f) => s + (parseFloat(f.amount) || 0), 0);
            const recGrowth = recUlt > 0 ? ((recMes - recUlt) / recUlt * 100).toFixed(1) : null;

            /* ── CLIENTS ── */
            const ativos = clients.filter(c => c.status === 'Ativo');
            const mrr = ativos.reduce((s, c) => s + (parseFloat(c.plan) || 0), 0);
            const ticket = ativos.length > 0 ? mrr / ativos.length : 0;
            const churnCt = clients.filter(c => ['Inativo', 'Churned', 'Cancelado', 'Encerrado'].includes(c.status)).length;
            const churnRate = clients.length > 0 ? (churnCt / clients.length * 100).toFixed(1) : 0;
            const retRate = (100 - parseFloat(churnRate)).toFixed(1);

            /* ── LEADS ── */
            const wonLeads = leads.filter(l => l.status === 'Fechado Ganho');
            const leadsThisMon = leads.filter(l => (l.createdAt || '').startsWith(thisMonth));
            const convRate = leads.length > 0 ? (wonLeads.length / leads.length * 100).toFixed(1) : 0;
            const mrrVendido = wonLeads.reduce((s, l) => s + (parseFloat(l.value) || 0), 0);

            /* ── TASKS ── */
            const done = tasks.filter(t => t.status === 'Concluído');
            const overdue = tasks.filter(t => t.dueDate && t.dueDate < today && t.status !== 'Concluído');
            const sla = (done.length + overdue.length) > 0 ? (done.length / (done.length + overdue.length) * 100).toFixed(0) : 100;

            /* ── TRAFFIC ── */
            const tdWithBudget = trafficData.filter(t => parseFloat(t.budget) > 0);
            const totalBudget = tdWithBudget.reduce((s, t) => s + (parseFloat(t.budget) || 0), 0);
            const totalRevEst = tdWithBudget.reduce((s, t) => s + (parseFloat(t.revenueEstimate) || parseFloat(t.revenue) || 0), 0);
            const avgROAS = totalBudget > 0 ? (totalRevEst / totalBudget).toFixed(2) : 0;
            const avgCPL = tdWithBudget.length > 0 ? (tdWithBudget.reduce((s, t) => s + (parseFloat(t.cpl) || 0), 0) / tdWithBudget.filter(t => t.cpl).length || 0).toFixed(2) : 0;

            /* ── GOALS ANALYSIS ── */
            const manualGoals = goals.filter(g => !filterCat || g.category === filterCat).filter(g => !filterPeriod || g.period === filterPeriod);
            const goalsTotal = goals.length;
            const goalsDone = goals.filter(g => parseFloat(g.target) > 0 && parseFloat(g.current) >= parseFloat(g.target)).length;
            const goalsLate = goals.filter(g => {
                if (!g.deadline) return false;
                const tgt = parseFloat(g.target) || 0;
                const cur = parseFloat(g.current) || 0;
                if (tgt === 0 || cur >= tgt) return false;
                const dl = new Date(g.deadline + 'T12:00');
                if (dl < now) return true;
                const totalDays = (dl - new Date(g.createdAt || g.deadline + 'T12:00')) / 86400000;
                const doneDays = (now - new Date(g.createdAt || now)) / 86400000;
                const expectedPct = totalDays > 0 ? doneDays / totalDays : 1;
                return (cur / tgt) < expectedPct * 0.75;
            });
            const goalsOnTrack = goals.filter(g => !goalsLate.includes(g) && parseFloat(g.target) > 0 && parseFloat(g.current) < parseFloat(g.target));
            const avgPct = goalsTotal > 0 ? (goals.reduce((s, g) => { const t = parseFloat(g.target) || 0; const c = parseFloat(g.current) || 0; return s + (t > 0 ? Math.min(c / t, 1) : 0); }, 0) / goalsTotal * 100).toFixed(0) : 0;

            /* ── RANKINGS ── */
            const respMap = {};
            leads.forEach(l => { if (!l.responsible) return; if (!respMap[l.responsible]) respMap[l.responsible] = { leads: 0, won: 0, tasks: 0, tasksDone: 0, name: l.responsible }; respMap[l.responsible].leads++; if (l.status === 'Fechado Ganho') respMap[l.responsible].won++; });
            tasks.forEach(t => { const r = t.assignee || t.responsible; if (!r) return; if (!respMap[r]) respMap[r] = { leads: 0, won: 0, tasks: 0, tasksDone: 0, name: r }; respMap[r].tasks++; if (t.status === 'Concluído') respMap[r].tasksDone++; });
            const rankings = Object.values(respMap).map(r => ({ ...r, score: r.won * 10 + r.tasksDone * 2 + r.leads, conv: r.leads > 0 ? (r.won / r.leads * 100).toFixed(0) : 0, eff: r.tasks > 0 ? (r.tasksDone / r.tasks * 100).toFixed(0) : 0 })).sort((a, b) => b.score - a.score);

            /* ── ALERTS ── */
            const alerts = [];
            const alertPriClr = { Alta: '#ff4060', Média: '#ffcc00', Baixa: '#4090ff' };
            if (leadsThisMon.length === 0) alerts.push({ p: 'Alta', cat: 'Comercial', msg: 'Nenhum lead gerado este mês', action: 'Intensificar prospecção' });
            if (overdue.length >= 3) alerts.push({ p: 'Média', cat: 'Operação', msg: `${overdue.length} tarefas atrasadas no Kanban`, action: 'Revisar prioridades urgentes' });
            if (parseFloat(churnRate) > 10) alerts.push({ p: 'Alta', cat: 'Retenção', msg: `Churn em ${churnRate}% — acima do aceitável`, action: 'Contatar clientes em risco' });
            if (parseFloat(convRate) < 10 && leads.length > 5) alerts.push({ p: 'Média', cat: 'Comercial', msg: `Conversão de leads em ${convRate}% — abaixo da meta`, action: 'Revisar processo comercial' });
            goalsLate.forEach(g => alerts.push({ p: 'Média', cat: 'Metas', msg: `Meta "${g.name}" está abaixo do ritmo esperado`, action: 'Ajustar plano de ação' }));
            if (recMes < recUlt * 0.8 && recUlt > 0) alerts.push({ p: 'Alta', cat: 'Financeiro', msg: `Receita este mês (${fmtR(recMes)}) abaixo do mês anterior`, action: 'Revisar pipeline financeiro' });
            if (ativos.length === 0) alerts.push({ p: 'Alta', cat: 'Clientes', msg: 'Nenhum cliente ativo cadastrado', action: 'Cadastrar clientes na aba Clientes' });

            /* ── PROJECTIONS ── */
            const projReceita = monthProg > 0 ? recMes / monthProg : 0;
            const projLeads = monthProg > 0 ? leadsThisMon.length / monthProg : 0;
            const daysLeft = daysInMonth - dayOfMonth;

            const TABS = [{ id: 'overview', label: 'Visão Geral' }, { id: 'metas', label: 'Central de Metas' }, { id: 'kpis', label: 'KPIs por Setor' }, { id: 'rankings', label: 'Rankings & Alertas' }];

            const cardStyle = (clr) => ({ background: `${clr}0d`, border: `1px solid ${clr}33`, borderRadius: 12, padding: '14px 16px' });
            const labelSt = { fontSize: 10.5, color: 'rgba(255,255,255,.4)', marginBottom: 4, textTransform: 'uppercase', letterSpacing: .5, fontWeight: 600 };
            const valSt = (clr) => ({ fontSize: 24, fontWeight: 800, color: clr, lineHeight: 1.1, marginBottom: 4 });
            const secHead = { fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,.3)', textTransform: 'uppercase', letterSpacing: .6, marginBottom: 12, marginTop: 20 };
            const kpiCard = (clr) => ({ background: 'rgba(255,255,255,.03)', border: `1px solid ${clr}22`, borderRadius: 10, padding: '12px 14px' });

            return (
                <div className="fade-in" style={{ paddingBottom: 40 }}>
                    {/* HEADER */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18, flexWrap: 'wrap', gap: 10 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                            <Ic n="goals" s={20} />
                            <div>
                                <h1 style={{ fontSize: 20, fontWeight: 700 }}>Metas & KPIs</h1>
                                <p style={{ fontSize: 11, color: 'rgba(255,255,255,.35)', marginTop: 1 }}>Centro estratégico · {goalsTotal} metas · {alerts.length} alertas ativos</p>
                            </div>
                        </div>
                        <button className="btn-primary" onClick={() => setShowAdd(true)} style={{ fontSize: 12 }}><Ic n="plus" s={13} />Nova Meta</button>
                    </div>

                    {/* TABS */}
                    <div style={{ display: 'flex', gap: 4, marginBottom: 20, borderBottom: '1px solid rgba(255,255,255,.07)', paddingBottom: 0 }}>
                        {TABS.map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: '8px 16px', background: 'none', border: 'none', borderBottom: tab === t.id ? '2px solid #ff0040' : '2px solid transparent', color: tab === t.id ? '#fff' : 'rgba(255,255,255,.4)', cursor: 'pointer', fontSize: 12.5, fontWeight: tab === t.id ? 700 : 400, transition: 'all .12s', marginBottom: -1 }}>{t.label}{t.id === 'rankings' && alerts.length > 0 ? ` (${alerts.length})` : ''}</button>
                        ))}
                    </div>

                    {/* ═══ TAB: VISÃO GERAL ═══ */}
                    {tab === 'overview' && (
                        <div>
                            <div style={secHead}>Overview Executivo</div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 12, marginBottom: 24 }}>
                                <div style={cardStyle('#00c853')}>
                                    <div style={labelSt}>MRR Atual</div>
                                    <div style={valSt('#00c853')}>{fmtR(mrr)}</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>{ativos.length} clientes ativos</div>
                                </div>
                                <div style={cardStyle('#4090ff')}>
                                    <div style={labelSt}>Receita Este Mês</div>
                                    <div style={valSt('#4090ff')}>{fmtR(recMes)}</div>
                                    {recGrowth !== null && <div style={{ fontSize: 10.5, color: deltaClr(recGrowth), fontWeight: 600 }}>{deltaSign(recGrowth)}{recGrowth}% vs mês anterior</div>}
                                </div>
                                <div style={cardStyle('#a060ff')}>
                                    <div style={labelSt}>Ticket Médio</div>
                                    <div style={valSt('#a060ff')}>{fmtR(ticket)}</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>por cliente ativo</div>
                                </div>
                                <div style={cardStyle('#ff9800')}>
                                    <div style={labelSt}>Conversão Leads</div>
                                    <div style={valSt('#ff9800')}>{convRate}%</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>{wonLeads.length} de {leads.length} leads</div>
                                </div>
                                <div style={cardStyle('#e91e63')}>
                                    <div style={labelSt}>Churn Rate</div>
                                    <div style={valSt(parseFloat(churnRate) > 10 ? '#ff4060' : '#e91e63')}>{churnRate}%</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>Retenção: {retRate}%</div>
                                </div>
                                <div style={cardStyle('#00bcd4')}>
                                    <div style={labelSt}>Leads Este Mês</div>
                                    <div style={valSt('#00bcd4')}>{leadsThisMon.length}</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>Total: {leads.length}</div>
                                </div>
                                <div style={cardStyle('#ff6b35')}>
                                    <div style={labelSt}>MRR Vendido</div>
                                    <div style={valSt('#ff6b35')}>{fmtR(mrrVendido)}</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>de leads ganhos</div>
                                </div>
                                <div style={cardStyle(parseFloat(sla) < 70 ? '#ff4060' : '#4caf50')}>
                                    <div style={labelSt}>SLA Operação</div>
                                    <div style={valSt(parseFloat(sla) < 70 ? '#ff4060' : '#4caf50')}>{sla}%</div>
                                    <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.35)' }}>{overdue.length} tarefas atrasadas</div>
                                </div>
                            </div>

                            {/* Projeções */}
                            <div style={secHead}>Projeções do Mês ({dayOfMonth}/{daysInMonth} dias — {(monthProg * 100).toFixed(0)}% do mês)</div>
                            <div className="glass" style={{ padding: '16px 20px', borderRadius: 12, marginBottom: 20 }}>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 16 }}>
                                    <div>
                                        <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 6 }}>Projeção de Receita</div>
                                        <div style={{ fontSize: 20, fontWeight: 700, color: '#4090ff', marginBottom: 4 }}>{fmtR(projReceita)}</div>
                                        <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.4)' }}>Mantendo ritmo atual ({fmtR(recMes)} realizados)</div>
                                        <div style={{ height: 4, borderRadius: 2, background: 'rgba(255,255,255,.07)', marginTop: 8 }}>
                                            <div style={{ height: '100%', width: `${Math.min(monthProg * 100, 100)}%`, background: '#4090ff', borderRadius: 2, transition: 'width .5s' }} />
                                        </div>
                                    </div>
                                    <div>
                                        <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 6 }}>Projeção de Leads</div>
                                        <div style={{ fontSize: 20, fontWeight: 700, color: '#00bcd4', marginBottom: 4 }}>{projLeads.toFixed(0)} leads</div>
                                        <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.4)' }}>Projeção para o mês cheio</div>
                                        <div style={{ height: 4, borderRadius: 2, background: 'rgba(255,255,255,.07)', marginTop: 8 }}>
                                            <div style={{ height: '100%', width: `${Math.min(monthProg * 100, 100)}%`, background: '#00bcd4', borderRadius: 2 }} />
                                        </div>
                                    </div>
                                    <div>
                                        <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 6 }}>Média das Metas</div>
                                        <div style={{ fontSize: 20, fontWeight: 700, color: parseFloat(avgPct) >= 70 ? '#00c853' : '#ff9800', marginBottom: 4 }}>{avgPct}% concluído</div>
                                        <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.4)' }}>{goalsDone} metas atingidas de {goalsTotal}</div>
                                        <div style={{ height: 4, borderRadius: 2, background: 'rgba(255,255,255,.07)', marginTop: 8 }}>
                                            <div style={{ height: '100%', width: `${avgPct}%`, background: parseFloat(avgPct) >= 70 ? '#00c853' : '#ff9800', borderRadius: 2 }} />
                                        </div>
                                    </div>
                                </div>
                                <div style={{ marginTop: 14, padding: '10px 14px', background: 'rgba(255,255,255,.03)', borderRadius: 8, fontSize: 12, color: 'rgba(255,255,255,.55)', fontStyle: 'italic' }}>
                                    {monthProg > 0
                                        ? `Mantendo o ritmo atual, a agência fechará ${MESES[now.getMonth()]} com ${fmtR(projReceita)} de receita e ${projLeads.toFixed(0)} novos leads. Restam ${daysLeft} dias no mês.`
                                        : 'Dados insuficientes para projeção.'}
                                </div>
                            </div>

                            {/* Funil de Metas por Categoria */}
                            <div style={secHead}>Funil de Metas por Setor</div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 12 }}>
                                {GOAL_CATS.map(cat => {
                                    const catGoals = goals.filter(g => g.category === cat);
                                    if (catGoals.length === 0) return null;
                                    const clr = GOAL_CAT_CLR[cat] || '#888';
                                    const avgCatPct = catGoals.reduce((s, g) => { const t = parseFloat(g.target) || 0; const c = parseFloat(g.current) || 0; return s + (t > 0 ? Math.min(c / t, 1) : 0); }, 0) / catGoals.length * 100;
                                    const catDone = catGoals.filter(g => parseFloat(g.target) > 0 && parseFloat(g.current) >= parseFloat(g.target)).length;
                                    return (
                                        <div key={cat} style={cardStyle(clr)}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                                <div style={{ fontSize: 12, fontWeight: 700, color: clr }}>{cat}</div>
                                                <div style={{ fontSize: 10, background: clr + '22', color: clr, borderRadius: 10, padding: '2px 8px', fontWeight: 700 }}>{catGoals.length} metas</div>
                                            </div>
                                            <div style={{ fontSize: 22, fontWeight: 800, color: '#fff', marginBottom: 6 }}>{avgCatPct.toFixed(0)}%</div>
                                            <div style={{ height: 6, borderRadius: 3, background: 'rgba(255,255,255,.08)', marginBottom: 6 }}>
                                                <div style={{ height: '100%', width: `${avgCatPct}%`, background: avgCatPct >= 100 ? '#00c853' : avgCatPct >= 70 ? clr : '#ff6b35', borderRadius: 3, transition: 'width .5s' }} />
                                            </div>
                                            <div style={{ fontSize: 10, color: 'rgba(255,255,255,.4)' }}>{catDone} atingidas · {catGoals.length - catDone} em andamento</div>
                                        </div>
                                    );
                                })}
                                {goals.length === 0 && (
                                    <div style={{ gridColumn: '1/-1', textAlign: 'center', padding: 32, color: 'rgba(255,255,255,.3)', fontSize: 13 }}>
                                        Cadastre metas para visualizar o funil por setor
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ═══ TAB: CENTRAL DE METAS ═══ */}
                    {tab === 'metas' && (
                        <div>
                            {/* Filters */}
                            <div style={{ display: 'flex', gap: 8, marginBottom: 18, flexWrap: 'wrap', alignItems: 'center' }}>
                                <select className="input-field" style={{ fontSize: 12, padding: '6px 10px', width: 'auto' }} value={filterCat} onChange={e => setFilterCat(e.target.value)}>
                                    <option value="">Todas categorias</option>
                                    {GOAL_CATS.map(c => <option key={c}>{c}</option>)}
                                </select>
                                <select className="input-field" style={{ fontSize: 12, padding: '6px 10px', width: 'auto' }} value={filterPeriod} onChange={e => setFilterPeriod(e.target.value)}>
                                    <option value="">Todos períodos</option>
                                    {GOAL_PERIODS.map(p => <option key={p}>{p}</option>)}
                                </select>
                                {(filterCat || filterPeriod) && <button className="btn-secondary" style={{ fontSize: 11 }} onClick={() => { setFilterCat(''); setFilterPeriod(''); }}>Limpar filtros</button>}
                                <div style={{ marginLeft: 'auto', display: 'flex', gap: 16, fontSize: 11, color: 'rgba(255,255,255,.4)' }}>
                                    <span style={{ color: '#00c853' }}>● {goalsDone} atingidas</span>
                                    <span style={{ color: '#ff9800' }}>● {goalsOnTrack.length} no ritmo</span>
                                    <span style={{ color: '#ff4060' }}>● {goalsLate.length} atrasadas</span>
                                </div>
                            </div>

                            {manualGoals.length === 0 ? (
                                <div className="glass" style={{ padding: '48px 24px', textAlign: 'center', color: 'rgba(255,255,255,.28)' }}>
                                    <div style={{ fontSize: 36, marginBottom: 12 }}>🎯</div>
                                    <div style={{ fontSize: 14, marginBottom: 6 }}>Nenhuma meta cadastrada{filterCat || filterPeriod ? ' com esses filtros' : ''}.</div>
                                    <button className="btn-primary" style={{ fontSize: 12, marginTop: 8 }} onClick={() => setShowAdd(true)}><Ic n="plus" s={12} />Criar primeira meta</button>
                                </div>
                            ) : (
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: 14 }}>
                                    {manualGoals.map(goal => {
                                        const clr = goal.color || GOAL_CAT_CLR[goal.category] || '#4090ff';
                                        const tgt = parseFloat(goal.target) || 0;
                                        const cur = parseFloat(goal.current) || 0;
                                        const pct = tgt > 0 ? Math.min((cur / tgt) * 100, 100) : 0;
                                        const isOver = cur >= tgt && tgt > 0;
                                        const isLate = goalsLate.includes(goal);
                                        const daysLeftGoal = goal.deadline ? Math.ceil((new Date(goal.deadline + 'T12:00') - now) / 86400000) : null;
                                        const pace = tgt > 0 && monthProg > 0 ? (cur / (tgt * monthProg) * 100).toFixed(0) : null;
                                        const isUpdating = updateId === goal.id;
                                        return (
                                            <div key={goal.id} className="glass" style={{ padding: '16px 18px', borderRadius: 12, borderColor: isLate ? '#ff406044' : clr + '33', position: 'relative', borderLeft: `3px solid ${isOver ? '#00c853' : isLate ? '#ff4060' : clr}` }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                                                    <div style={{ flex: 1, marginRight: 8 }}>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                                                            <span style={{ fontSize: 9.5, background: clr + '22', color: clr, borderRadius: 10, padding: '1px 7px', fontWeight: 700 }}>{goal.category}</span>
                                                            {goal.period && <span style={{ fontSize: 9.5, color: 'rgba(255,255,255,.35)' }}>{goal.period}</span>}
                                                            {isOver && <span style={{ fontSize: 11 }}>🏆</span>}
                                                            {isLate && !isOver && <span style={{ fontSize: 10, color: '#ff4060', fontWeight: 700 }}>ATRASADA</span>}
                                                        </div>
                                                        <div style={{ fontSize: 13.5, fontWeight: 700, lineHeight: 1.3 }}>{goal.name}</div>
                                                        {goal.responsible && <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.4)', marginTop: 3 }}>→ {goal.responsible}</div>}
                                                    </div>
                                                    <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                                                        <button onClick={() => setEditing(goal)} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.35)', cursor: 'pointer', padding: '2px 4px' }}><Ic n="edit" s={12} /></button>
                                                        <button onClick={() => { if (confirm('Excluir esta meta?')) deleteGoal(goal.id); }} style={{ background: 'none', border: 'none', color: 'rgba(255,0,64,.45)', cursor: 'pointer', padding: '2px 4px' }}><Ic n="trash" s={12} /></button>
                                                    </div>
                                                </div>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 12 }}>
                                                    <span style={{ color: 'rgba(255,255,255,.5)' }}>{fmtN(cur, goal.unit)} <span style={{ color: 'rgba(255,255,255,.25)' }}>/ {fmtN(tgt, goal.unit)}</span></span>
                                                    <span style={{ fontWeight: 700, color: isOver ? '#00c853' : isLate ? '#ff4060' : clr }}>{pct.toFixed(0)}%</span>
                                                </div>
                                                <div style={{ height: 6, borderRadius: 3, background: 'rgba(255,255,255,.07)', marginBottom: 8 }}>
                                                    <div style={{ height: '100%', width: `${pct}%`, borderRadius: 3, background: isOver ? '#00c853' : isLate ? '#ff4060' : pct >= 70 ? clr : '#ff6b35', transition: 'width .5s' }} />
                                                </div>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'rgba(255,255,255,.35)', marginBottom: 8 }}>
                                                    <span>{daysLeftGoal !== null ? (daysLeftGoal < 0 ? `${Math.abs(daysLeftGoal)}d expirada` : `${daysLeftGoal}d restantes`) : '—'}</span>
                                                    {pace !== null && <span>Ritmo: <span style={{ color: parseFloat(pace) >= 80 ? '#00c853' : '#ff9800', fontWeight: 600 }}>{pace}% do esperado</span></span>}
                                                </div>
                                                {isUpdating ? (
                                                    <div style={{ display: 'flex', gap: 6 }}>
                                                        <input className="input-field" type="number" value={updateVal} onChange={e => setUpdateVal(e.target.value)} placeholder="Novo valor" style={{ fontSize: 12, flex: 1 }} />
                                                        <button className="btn-primary" style={{ fontSize: 11, padding: '4px 10px' }} onClick={() => { editGoal(goal.id, { current: parseFloat(updateVal) || 0 }); setUpdateId(null); setUpdateVal(''); }}>OK</button>
                                                        <button className="btn-secondary" style={{ fontSize: 11, padding: '4px 8px' }} onClick={() => setUpdateId(null)}>✕</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => { setUpdateId(goal.id); setUpdateVal(String(cur)); }} style={{ background: 'none', border: `1px solid ${clr}33`, borderRadius: 6, color: clr, cursor: 'pointer', fontSize: 11, padding: '4px 10px', width: '100%', transition: 'background .12s' }} onMouseEnter={e => e.currentTarget.style.background = clr + '15'} onMouseLeave={e => e.currentTarget.style.background = 'none'}>Atualizar progresso</button>
                                                )}
                                                {goal.notes && <div style={{ fontSize: 10, color: 'rgba(255,255,255,.3)', marginTop: 8, fontStyle: 'italic' }}>{goal.notes}</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {/* ═══ TAB: KPIs POR SETOR ═══ */}
                    {tab === 'kpis' && (
                        <div>
                            {/* COMERCIAL */}
                            <div style={secHead}>Comercial</div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(170px, 1fr))', gap: 10, marginBottom: 20 }}>
                                {[
                                    { label: 'Taxa de Conversão', val: convRate + '%', sub: `${wonLeads.length} de ${leads.length} leads`, clr: '#4090ff' },
                                    { label: 'Leads Este Mês', val: leadsThisMon.length, sub: 'novos leads', clr: '#00bcd4' },
                                    { label: 'MRR Vendido', val: fmtR(mrrVendido), sub: 'de leads ganhos', clr: '#00c853' },
                                    { label: 'Leads Em Aberto', val: leads.filter(l => !['Fechado Ganho', 'Perdido'].includes(l.status)).length, sub: 'no pipeline', clr: '#ff9800' },
                                    { label: 'Leads Perdidos', val: leads.filter(l => l.status === 'Perdido').length, sub: 'total', clr: '#ff4060' },
                                    { label: 'Ticket Médio Leads', val: wonLeads.length > 0 ? fmtR(wonLeads.reduce((s, l) => s + (parseFloat(l.value) || 0), 0) / wonLeads.length) : '—', sub: 'de leads ganhos', clr: '#a060ff' },
                                ].map(k => (
                                    <div key={k.label} style={kpiCard(k.clr)}>
                                        <div style={{ fontSize: 10, color: 'rgba(255,255,255,.38)', marginBottom: 4 }}>{k.label}</div>
                                        <div style={{ fontSize: 20, fontWeight: 800, color: k.clr, lineHeight: 1.1, marginBottom: 2 }}>{k.val}</div>
                                        <div style={{ fontSize: 10, color: 'rgba(255,255,255,.3)' }}>{k.sub}</div>
                                    </div>
                                ))}
                            </div>

                            {/* OPERAÇÃO */}
                            <div style={secHead}>Operação</div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(170px, 1fr))', gap: 10, marginBottom: 20 }}>

        /* ── ALERT MONITOR (módulos 03 e 04) ──────────────── */
        function AlertMonitor() {
            const { store, addNotif } = useApp();
            useEffect(() => {
                const check = () => {
                    const me = JSON.parse(sessionStorage.getItem('neos_auth')||'null');
                    if (!me) return;
                    const today = new Date().toISOString().slice(0,10);
                    const now = new Date();
                    const alertKey = k => {
                        const sent = JSON.parse(localStorage.getItem('neos_alerts')||'{}');
                        if (sent[k]===today) return false;
                        sent[k]=today; localStorage.setItem('neos_alerts',JSON.stringify(sent)); return true;
                    };
                    const isAdm = me.role==='admin'||_ADMIN_IDS.includes(me.username);

                    /* Módulo 03 — alertas de relacionamento */
                    if (isAdm) {
                        (store.clients||[]).filter(c=>c.status==='Ativo').forEach(cl => {
                            const cId=cl.id, cNm=(cl.name||'').toLowerCase();
                            const evDts=(store.calEvents||[]).filter(e=>e.clientId===cId||(e.clientName||'').toLowerCase()===cNm).map(e=>new Date(e.date+'T12:00').getTime()).filter(n=>!isNaN(n));
                            const lastMs=evDts.length?Math.max(...evDts):0;
                            const days=lastMs?Math.floor((now-lastMs)/86400000):999;
                            const clTasks=(store.tasks||[]).filter(t=>t.clientId===cId&&t.assignee);
                            const respId=clTasks.length?_toUserId(clTasks[clTasks.length-1].assignee):me.username;
                            if (days>=10&&alertKey('rel_'+cId+'_10d')) {
                                addNotif(respId,'client_risk','🚨 PRIORIDADE MÁXIMA',cl.name+' há '+days+' dias sem contato!',cId,'client');
                                _ADMIN_IDS.forEach(u=>{if(u!==respId)addNotif(u,'client_risk','🚨 PRIORIDADE MÁXIMA',cl.name+' há '+days+' dias sem contato!',cId,'client');});
                            } else if (days>=7&&alertKey('rel_'+cId+'_7d')) {
                                addNotif(respId,'client_risk','⚠️ Cliente em Risco',cl.name+' há '+days+'d sem interação.',cId,'client');
                                _ADMIN_IDS.forEach(u=>{if(u!==respId)addNotif(u,'client_risk','⚠️ Cliente em Risco',cl.name+' há '+days+'d sem interação.',cId,'client');});
                            } else if (days>=5&&alertKey('rel_'+cId+'_5d')) {
                                addNotif(respId,'client_attention','⚠️ Cliente Esfriando',cl.name+' há '+days+'d sem contato.',cId,'client');
                                _ADMIN_IDS.forEach(u=>{if(u!==respId)addNotif(u,'client_attention','⚠️ Cliente Esfriando',cl.name+' há '+days+'d sem contato.',cId,'client');});
                            } else if (days>=3&&alertKey('rel_'+cId+'_3d')) {
                                addNotif(respId,'client_follow','📬 Lembrete de Contato','Entre em contato com '+cl.name+' ('+days+'d sem interação).',cId,'client');
                            }
                        });
                    }

                    /* Módulo 04 — alertas de vencimento de tarefas */
                    (store.tasks||[]).filter(t=>t.status!=='Concluído'&&t.dueDate&&t.assignee).forEach(task=>{
                        const due=new Date(task.dueDate+'T23:59:59');
                        const dl=Math.ceil((due-now)/86400000);
                        const aId=_toUserId(task.assignee);
                        if (!aId) return;
                        if (dl<0&&alertKey('task_'+task.id+'_ov')) {
                            addNotif(aId,'task_overdue','🔴 Tarefa Atrasada','"'+task.title+'" está '+Math.abs(dl)+'d atrasada.',task.id,'task');
                            _ADMIN_IDS.forEach(u=>{if(u!==aId)addNotif(u,'task_overdue','🔴 Tarefa Atrasada','"'+task.title+'" ('+task.assignee+') '+Math.abs(dl)+'d atraso.',task.id,'task');});
                        } else if (dl===0&&alertKey('task_'+task.id+'_0d')) {
                            addNotif(aId,'task_due','⏰ Vence Hoje!','"'+task.title+'" deve ser entregue hoje.',task.id,'task');
                        } else if (dl===1&&alertKey('task_'+task.id+'_1d')) {
                            addNotif(aId,'task_due','📅 Vence Amanhã','"'+task.title+'" vence amanhã.',task.id,'task');
                        } else if (dl<=3&&dl>1&&alertKey('task_'+task.id+'_3d')) {
                            addNotif(aId,'task_due','📅 Prazo em '+dl+' Dias','"'+task.title+'" vence em '+dl+' dias.',task.id,'task');
                        } else if (dl<=7&&dl>3&&alertKey('task_'+task.id+'_7d')) {
                            addNotif(aId,'task_due','📅 Prazo em '+dl+' Dias','"'+task.title+'" vence em '+dl+' dias.',task.id,'task');
                        }
                    });
                };
                const t=setTimeout(check,4000);
                const iv=setInterval(check,30*60*1000);
                return ()=>{ clearTimeout(t); clearInterval(iv); };
            }, [store.tasks?.length, store.clients?.length]);
            return null;
        }
