<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neos Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.7/dist/dexie.min.js"></script>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #07070f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
            opacity: 0.4;
        }

        .glass {
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 64, .13);
            border-radius: 12px
        }

        .glass-hover:hover {
            border-color: rgba(255, 0, 64, .35);
            box-shadow: 0 0 20px rgba(255, 0, 64, .08);
            transform: translateY(-1px)
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff0040, #cc0030);
            border: none;
            color: #fff;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all .2s
        }

        .btn-primary:hover {
            box-shadow: 0 0 22px rgba(255, 0, 64, .5);
            transform: translateY(-1px)
        }

        .btn-secondary {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all .2s
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, .1)
        }

        .btn-danger {
            background: rgba(255, 0, 64, .15);
            border: 1px solid rgba(255, 0, 64, .35);
            color: #ff4060;
            padding: 6px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all .2s
        }

        .btn-danger:hover {
            background: rgba(255, 0, 64, .3)
        }

        .input-field {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 8px;
            padding: 10px 13px;
            color: #fff;
            width: 100%;
            font-size: 13px;
            transition: border-color .2s;
            outline: none
        }

        .input-field:focus {
            border-color: rgba(255, 0, 64, .5);
            box-shadow: 0 0 10px rgba(255, 0, 64, .1)
        }

        .input-field option {
            background: #1a1a2e;
            color: #fff
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden
        }

        .modal-box {
            background: rgba(8, 8, 22, .97);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 0, 64, .28);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: min(580px, calc(100vw - 40px));
            max-height: 90vh;
            overflow-y: auto;
            overflow-x: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
            box-sizing: border-box;
            flex-shrink: 1;
            min-width: 0;
            box-shadow: 0 0 60px rgba(255, 0, 64, .12)
        }

        .sidebar {
            background: rgba(4, 4, 18, .92);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 0, 64, .08);
            position: fixed;
            left: 0;
            top: 0;
            width: 210px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 10px;
            z-index: 100
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            color: rgba(255, 255, 255, .45);
            font-size: 13.5px;
            font-weight: 500;
            border-left: 2px solid transparent
        }

        .nav-item:hover {
            background: rgba(255, 0, 64, .08);
            color: rgba(255, 255, 255, .85)
        }

        .nav-item.active {
            background: rgba(255, 0, 64, .13);
            color: #ff4060;
            border-left-color: #ff0040
        }

        .kanban-col {
            background: rgba(255, 255, 255, .02);
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 12px;
            min-height: 450px;
            min-width: 230px;
            padding: 12px;
            transition: border-color .2s, background .2s
        }

        .kanban-col.drag-over {
            border-color: rgba(255, 0, 64, .5);
            background: rgba(255, 0, 64, .04)
        }

        .task-card {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 9px;
            padding: 12px;
            cursor: grab;
            transition: all .2s;
            margin-bottom: 8px
        }

        .task-card:hover {
            border-color: rgba(255, 0, 64, .3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3)
        }

        .task-card.dragging {
            opacity: .4;
            cursor: grabbing
        }

        .badge {
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .badge-active {
            background: rgba(0, 200, 100, .13);
            color: #00c864
        }

        .badge-inactive {
            background: rgba(120, 120, 120, .13);
            color: #999
        }

        .badge-paused {
            background: rgba(255, 180, 0, .13);
            color: #ffb400
        }

        .badge-pending {
            background: rgba(255, 200, 0, .13);
            color: #ffcc00
        }

        .badge-paid {
            background: rgba(0, 200, 100, .13);
            color: #00c864
        }

        .badge-overdue {
            background: rgba(255, 0, 64, .15);
            color: #ff4060
        }

        .badge-open {
            background: rgba(60, 130, 255, .13);
            color: #4090ff
        }

        .badge-review {
            background: rgba(180, 80, 255, .13);
            color: #c060ff
        }

        .badge-completed {
            background: rgba(0, 200, 100, .13);
            color: #00c864
        }

        .badge-closed {
            background: rgba(120, 120, 120, .13);
            color: #888
        }

        .metric-card {
            padding: 18px 20px;
            border-radius: 12px;
            transition: all .2s
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 64, .25);
            border-radius: 2px
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .fade-in {
            animation: fadeIn .25s ease-out
        }

        @keyframes pulse-red {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 64, .3)
            }

            50% {
                box-shadow: 0 0 26px rgba(255, 0, 64, .65)
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .pulse {
            animation: pulse-red 2s infinite
        }

        .tbl th {
            padding: 11px 14px;
            text-align: left;
            font-size: 11px;
            color: rgba(255, 255, 255, .38);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid rgba(255, 255, 255, .05)
        }

        .tbl td {
            padding: 11px 14px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, .03)
        }

        .tbl tr:last-child td {
            border-bottom: none
        }

        .tbl tr:hover td {
            background: rgba(255, 255, 255, .02)
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">

        if (!window.supabase || !window.supabase.createClient) {
            console.error('[Neos] ERRO: biblioteca Supabase não carregou. Verifique a CDN.');
        }
        const supabase = window.supabase.createClient(
            'https://edlusjxoalqjkieugwce.supabase.co',
            'sb_publishable_OfZfNYJUrtOqVUpv8bvU4Q_HyGHHIyx'
        )
        /* teste de conectividade no boot */
        supabase.from('clients').select('id', { count: 'exact', head: true }).then(({ count, error }) => {
            if (error) console.error('[Neos] Supabase ERRO de conexão:', error.message, error.code);
            else console.log('[Neos] Supabase conectado ✓ — clients:', count);
        });

        const { useState, useEffect, useContext, useRef } = React;

        /* ── CONSTANTS ─────────────────────────────────────── */
        const COLS = ["Backlog", "A Fazer", "Em Andamento", "Em Revisão", "Concluído"];
        const TEAM = ['Arthur Lemos', 'Lavinia Wallery', 'Miguel Lemos'];
        const genId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
        const fmt = n => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n || 0);
        const fmtD = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
        const isOverdue = d => { if (!d) return false; return new Date(d + 'T23:59:59') < new Date(); };
        const daysLeft = d => { if (!d) return null; return Math.ceil((new Date(d + 'T23:59:59') - new Date()) / 86400000); };
        const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const MESES_SHORT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        const PLATFORMS = ['Instagram', 'Facebook', 'TikTok', 'YouTube', 'LinkedIn', 'Twitter/X'];
        const PLATFORM_COLORS = {
            'Instagram': { hex: '#E1306C', rgb: [225, 48, 108], bg: 'rgba(225,48,108,.15)' },
            'Facebook': { hex: '#1877F2', rgb: [24, 119, 242], bg: 'rgba(24,119,242,.15)' },
            'TikTok': { hex: '#69C9D0', rgb: [105, 201, 208], bg: 'rgba(105,201,208,.15)' },
            'YouTube': { hex: '#FF0000', rgb: [255, 0, 0], bg: 'rgba(255,0,0,.15)' },
            'LinkedIn': { hex: '#0077B5', rgb: [0, 119, 181], bg: 'rgba(0,119,181,.15)' },
            'Twitter/X': { hex: '#1DA1F2', rgb: [29, 161, 242], bg: 'rgba(29,161,242,.15)' },
        };

        const CURSOR_COLORS = ['#a060ff', '#4090ff', '#00c864', '#ffcc00', '#E1306C', '#69C9D0', '#ff8030', '#20c0d0'];
        const getUserColor = u => { let h = 0; for (let c of (u || '')) h = (h * 31 + c.charCodeAt(0)) % CURSOR_COLORS.length; return CURSOR_COLORS[Math.abs(h) % CURSOR_COLORS.length]; };
        const getModUser = () => { try { const s = JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); return { modifiedBy: s?.name || '?', modifiedAt: new Date().toISOString() }; } catch { return { modifiedBy: '?', modifiedAt: new Date().toISOString() }; } };

        /* ── DATABASE (IndexedDB via Dexie) ─────────────────── */
        let _backupFileHandle = null;
        const db = new Dexie('NeosDatabase');
        db.version(1).stores({
            clients: 'id, name, status, company, createdAt',
            tasks: 'id, clientId, status, priority, assignee, createdAt',
            financials: 'id, clientId, status, type, date, createdAt',
            trafficData: 'id, clientId',
            designReqs: 'id, clientId, status, assignee, createdAt'
        });
        db.version(2).stores({
            performance: 'id, clientId, platform, month, year, createdAt'
        });
        db.version(3).stores({ calEvents: 'id, date, type, source, googleEventId, createdAt', costs: 'id, type, category, date, createdAt' });
        db.version(4).stores({ clientImages: 'id, clientId, type, createdAt' });
        const EMPTY_STORE = { clients: [], tasks: [], financials: [], trafficData: [], designReqs: [], performance: [], calEvents: [], costs: [], clientImages: [] };

        /* ── SUPABASE HELPERS ───────────────────────────────── */
        const _stripCol = (err, obj) => {
            const msg = err?.message || '';
            const m = msg.match(/[Cc]olumn ['"]?([\w]+)['"]?/);
            const col = m?.[1];
            if (col && Object.prototype.hasOwnProperty.call(obj, col)) {
                const copy = { ...obj }; delete copy[col]; return copy;
            }
            return null;
        };
        const supaSave = async (table, record) => {
            let r = { ...record };
            for (let i = 0; i < 12; i++) {
                const { error } = await supabase.from(table).upsert([r]);
                if (!error) return;
                const next = _stripCol(error, r);
                if (next) { r = next; } else { console.error(`[Neos] Supabase save (${table}):`, error.message); _neosNotifyRef.current?.(`Erro ao salvar (${table}): ${error.message.slice(0, 60)}`, 'warn'); return; }
            }
        };
        const supaUpdate = async (table, id, data) => {
            let d = { ...data };
            for (let i = 0; i < 12; i++) {
                const { error } = await supabase.from(table).update(d).eq('id', id);
                if (!error) return;
                const next = _stripCol(error, d);
                if (next) { d = next; } else { console.error(`[Neos] Supabase update (${table}):`, error.message); _neosNotifyRef.current?.(`Erro ao atualizar (${table}): ${error.message.slice(0, 60)}`, 'warn'); return; }
            }
        };
        const supaDelete = async (table, id) => {
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) console.error(`[Neos] Supabase delete error (${table}):`, error.message || error);
        };

        async function hashPassword(pwd) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function loadFromDB() {
            try {
                const [
                    { data: clients }, { data: tasks }, { data: financials },
                    { data: trafficData }, { data: designReqs }, { data: performance },
                    { data: calEvents }, { data: costs }, { data: clientImages }
                ] = await Promise.all([
                    supabase.from('clients').select('*'),
                    supabase.from('tasks').select('*'),
                    supabase.from('financials').select('*'),
                    supabase.from('trafficData').select('*'),
                    supabase.from('designReqs').select('*'),
                    supabase.from('performance').select('*'),
                    supabase.from('calEvents').select('*'),
                    supabase.from('costs').select('*'),
                    supabase.from('clientImages').select('*'),
                ]);
                const store = {
                    clients: clients || [], tasks: tasks || [], financials: financials || [],
                    trafficData: trafficData || [], designReqs: designReqs || [],
                    performance: performance || [], calEvents: calEvents || [], costs: costs || [],
                    clientImages: clientImages || []
                };
                const hasData = Object.values(store).some(arr => arr.length > 0);
                if (!hasData) {
                    const local = await loadFromIndexedDB();
                    if (local && Object.values(local).some(arr => arr.length > 0)) return local;
                }
                return store;
            } catch (e) {
                console.error('[Neos] Erro ao carregar do Supabase, usando IndexedDB:', e);
                return await loadFromIndexedDB();
            }
        }

        async function loadFromIndexedDB() {
            try {
                const [clients, tasks, financials, trafficData, designReqs, performance, calEvents, costs, clientImages] = await Promise.all([
                    db.clients.toArray(), db.tasks.toArray(), db.financials.toArray(),
                    db.trafficData.toArray(), db.designReqs.toArray(),
                    db.performance.toArray(), db.calEvents.toArray(), db.costs.toArray(),
                    db.clientImages.toArray()
                ]);
                return { clients, tasks, financials, trafficData, designReqs, performance, calEvents, costs, clientImages };
            } catch (e) { return null; }
        }
        async function saveToDB(store) {
            await db.transaction('rw', db.clients, db.tasks, db.financials, db.trafficData, db.designReqs, db.performance, db.calEvents, db.costs, db.clientImages, async () => {
                await db.clients.clear(); await db.clients.bulkPut(store.clients);
                await db.tasks.clear(); await db.tasks.bulkPut(store.tasks);
                await db.financials.clear(); await db.financials.bulkPut(store.financials);
                await db.trafficData.clear(); await db.trafficData.bulkPut(store.trafficData);
                await db.designReqs.clear(); await db.designReqs.bulkPut(store.designReqs);
                await db.performance.clear(); await db.performance.bulkPut(store.performance || []);
                await db.calEvents.clear(); await db.calEvents.bulkPut(store.calEvents || []);
                await db.costs.clear(); await db.costs.bulkPut(store.costs || []);
                await db.clientImages.clear(); await db.clientImages.bulkPut(store.clientImages || []);
            });
        }
        async function migrateFromLocalStorage() {
            const LS_KEY = 'agency_v3';
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (!raw) return null;
                const data = JSON.parse(raw);
                if (!data || !Array.isArray(data.clients)) return null;
                await saveToDB({ clients: data.clients || [], tasks: data.tasks || [], financials: data.financials || [], trafficData: data.trafficData || [], designReqs: data.designReqs || [], performance: [], calEvents: [], costs: [] });
                localStorage.removeItem(LS_KEY);
                console.log('[Neos] Dados migrados do localStorage para IndexedDB ✓');
                return data;
            } catch { return null; }
        }

        /* ── CONTEXT ────────────────────────────────────────── */
        const Ctx = React.createContext(null);
        const useApp = () => useContext(Ctx);
        const _neosNotifyRef = { current: null };

        function AppProvider({ children, authed }) {
            const userRole = authed?.role || 'employee';
            const [store, setStore] = useState(EMPTY_STORE);
            const [dbReady, setDbReady] = useState(false);
            const [view, setView] = useState(userRole === 'admin' ? 'dashboard' : 'kanban');
            const [toast, setToast] = useState(null);
            const [calFocusDate, setCalFocusDate] = useState(null);
            const [supaStatus, setSupaStatus] = useState('connecting');
            const [onlineUsers, setOnlineUsers] = useState([]);
            const [chatOpen, setChatOpen] = useState(false);
            const [chatMessages, setChatMessages] = useState([]);
            const viewRef = useRef(view);
            const chatChannelRef = useRef(null);
            useEffect(() => { viewRef.current = view; }, [view]);

            useEffect(() => {
                supabase.from('clients').select('id', { count: 'exact', head: true })
                    .then(({ error }) => setSupaStatus(error ? 'error' : 'ok'))
                    .catch(() => setSupaStatus('error'));
            }, []);

            useEffect(() => {
                (async () => {
                    const existing = await loadFromDB();
                    const hasData = existing.clients.length + existing.tasks.length + existing.financials.length + existing.trafficData.length + existing.designReqs.length + (existing.performance || []).length > 0;
                    if (!hasData) {
                        const migrated = await migrateFromLocalStorage();
                        if (migrated) { setStore({ clients: migrated.clients || [], tasks: migrated.tasks || [], financials: migrated.financials || [], trafficData: migrated.trafficData || [], designReqs: migrated.designReqs || [], performance: [], calEvents: [], costs: [] }); }
                        else setStore(EMPTY_STORE);
                    } else {
                        setStore(existing);
                    }
                    setDbReady(true);
                })();
            }, []);

            useEffect(() => {
                if (!dbReady) return;
                saveToDB(store).catch(e => console.error('[Neos] Erro ao salvar no DB:', e));
            }, [store]);

            /* ── SUPABASE REALTIME ── */
            useEffect(() => {
                const TABLES = ['clients', 'tasks', 'financials', 'trafficData', 'designReqs', 'performance', 'calEvents', 'costs', 'clientImages'];
                const channel = supabase.channel('neos-db-changes');
                TABLES.forEach(tbl => {
                    channel.on('postgres_changes', { event: '*', schema: 'public', table: tbl }, ({ eventType, new: n, old: o }) => {
                        setStore(p => {
                            const arr = p[tbl] || [];
                            if (eventType === 'INSERT') {
                                if (arr.some(r => r.id === n.id)) return p;
                                return { ...p, [tbl]: [...arr, n] };
                            }
                            if (eventType === 'UPDATE') return { ...p, [tbl]: arr.map(r => r.id === n.id ? n : r) };
                            if (eventType === 'DELETE') return { ...p, [tbl]: arr.filter(r => r.id !== o?.id) };
                            return p;
                        });
                    });
                });
                channel.subscribe(status => {
                    if (status === 'SUBSCRIBED') console.log('[Neos] Realtime conectado ✓');
                    if (status === 'CHANNEL_ERROR') console.warn('[Neos] Realtime: verifique a publicação no Supabase');
                });
                return () => { supabase.removeChannel(channel); };
            }, [dbReady]);

            /* ── PRESENCE (cursors + online users) ── */
            useEffect(() => {
                const me = JSON.parse(sessionStorage.getItem('neos_auth') || 'null');
                const myKey = me?.username || 'anon';
                const myName = me?.name || myKey;
                const myColor = getUserColor(myKey);
                const ch = supabase.channel('neos-cursors', { config: { presence: { key: myKey } } });
                const syncOnline = () => {
                    const all = Object.values(ch.presenceState()).flat();
                    const byKey = {};
                    for (const u of all) byKey[u.k] = u;
                    setOnlineUsers(Object.values(byKey).filter(u => u.k !== myKey));
                };
                ch.on('presence', { event: 'sync' }, syncOnline);
                ch.on('presence', { event: 'join' }, syncOnline);
                ch.on('presence', { event: 'leave' }, syncOnline);
                let lastT = 0;
                const onMove = e => {
                    const now = Date.now();
                    if (now - lastT < 50) return;
                    lastT = now;
                    ch.track({ k: myKey, name: myName, view: viewRef.current, x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight, color: myColor });
                };
                ch.subscribe(async s => {
                    if (s === 'SUBSCRIBED') {
                        await ch.track({ k: myKey, name: myName, view: viewRef.current, x: 0, y: 0, color: myColor });
                        window.addEventListener('mousemove', onMove);
                    }
                });
                return () => { window.removeEventListener('mousemove', onMove); supabase.removeChannel(ch); };
            }, []);

            /* ── CHAT (broadcast, ephemeral) ── */
            useEffect(() => {
                const me = JSON.parse(sessionStorage.getItem('neos_auth') || 'null');
                const myKey = me?.username || 'anon';
                const ch = supabase.channel('neos-chat');
                ch.on('broadcast', { event: 'msg' }, ({ payload }) => {
                    if (payload.k !== myKey) setChatMessages(p => [...p.slice(-99), payload]);
                });
                ch.subscribe();
                chatChannelRef.current = ch;
                return () => { supabase.removeChannel(ch); chatChannelRef.current = null; };
            }, []);

            const sendChatMsg = text => {
                const me = JSON.parse(sessionStorage.getItem('neos_auth') || 'null');
                const msg = { k: me?.username || 'anon', name: me?.name || '?', color: getUserColor(me?.username || ''), text, ts: new Date().toISOString() };
                if (chatChannelRef.current) chatChannelRef.current.send({ type: 'broadcast', event: 'msg', payload: msg });
                setChatMessages(p => [...p.slice(-99), msg]);
            };

            const refreshData = async () => {
                try {
                    const [
                        { data: clients }, { data: tasks }, { data: financials },
                        { data: trafficData }, { data: designReqs }, { data: performance },
                        { data: calEvents }, { data: costs }
                    ] = await Promise.all([
                        supabase.from('clients').select('*'),
                        supabase.from('tasks').select('*'),
                        supabase.from('financials').select('*'),
                        supabase.from('trafficData').select('*'),
                        supabase.from('designReqs').select('*'),
                        supabase.from('performance').select('*'),
                        supabase.from('calEvents').select('*'),
                        supabase.from('costs').select('*'),
                    ]);
                    const merge = (remote, local) => {
                        const remoteIds = new Set((remote || []).map(r => r.id));
                        const localOnly = (local || []).filter(r => !remoteIds.has(r.id));
                        return [...(remote || []), ...localOnly];
                    };
                    setStore(prev => ({
                        clients: merge(clients, prev.clients),
                        tasks: merge(tasks, prev.tasks),
                        financials: merge(financials, prev.financials),
                        trafficData: merge(trafficData, prev.trafficData),
                        designReqs: merge(designReqs, prev.designReqs),
                        performance: merge(performance, prev.performance),
                        calEvents: merge(calEvents, prev.calEvents),
                        costs: merge(costs, prev.costs),
                    }));
                    notify('Dados atualizados ✓');
                } catch { notify('Erro ao atualizar dados', 'warn'); }
            };

            const exportJSON = async () => {
                const ts = new Date();
                const tsStr = ts.toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const gcClientId = localStorage.getItem('gcClientId') || '';
                const data = { exportadoEm: ts.toISOString(), versao: 'neos-v1', ...store, gcClientId };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                if ('showSaveFilePicker' in window) {
                    try {
                        let fh = _backupFileHandle;
                        if (fh) {
                            const perm = await fh.queryPermission({ mode: 'readwrite' });
                            if (perm !== 'granted') {
                                const req = await fh.requestPermission({ mode: 'readwrite' });
                                if (req !== 'granted') fh = null;
                            }
                        }
                        if (!fh) {
                            fh = await window.showSaveFilePicker({
                                suggestedName: `neos-backup-${tsStr}.json`,
                                types: [{ description: 'Neos Backup', accept: { 'application/json': ['.json'] } }]
                            });
                            _backupFileHandle = fh;
                        }
                        const writable = await fh.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        localStorage.setItem('lastBackupAt', ts.toISOString());
                    } catch (e) {
                        if (e.name !== 'AbortError') {
                            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                            a.download = `neos-backup-${tsStr}.json`;
                            document.body.appendChild(a); a.click();
                            document.body.removeChild(a); URL.revokeObjectURL(a.href);
                            localStorage.setItem('lastBackupAt', ts.toISOString());
                        }
                    }
                } else {
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `neos-backup-${tsStr}.json`;
                    document.body.appendChild(a); a.click();
                    document.body.removeChild(a); URL.revokeObjectURL(a.href);
                    localStorage.setItem('lastBackupAt', ts.toISOString());
                }
                notify('Backup exportado ✓');
            };
            const importJSON = async (file) => {
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    const newStore = {
                        clients: Array.isArray(data.clients) ? data.clients : [],
                        tasks: Array.isArray(data.tasks) ? data.tasks : [],
                        financials: Array.isArray(data.financials) ? data.financials : [],
                        trafficData: Array.isArray(data.trafficData) ? data.trafficData : [],
                        designReqs: Array.isArray(data.designReqs) ? data.designReqs : [],
                        performance: Array.isArray(data.performance) ? data.performance : [],
                        calEvents: Array.isArray(data.calEvents) ? data.calEvents : [],
                        costs: Array.isArray(data.costs) ? data.costs : [],
                    };
                    await saveToDB(newStore);
                    setStore(newStore);
                    if (data.gcClientId) localStorage.setItem('gcClientId', data.gcClientId);
                    notify(`Backup restaurado — ${newStore.clients.length} clientes, ${newStore.tasks.length} tarefas ✓`);
                    return true;
                } catch (e) { notify('Arquivo inválido. Use um backup gerado pelo Neos.', 'warn'); return false; }
            };

            const notify = (msg, type = 'ok') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };
            useEffect(() => { _neosNotifyRef.current = (msg, type = 'warn') => { setToast({ msg, type }); setTimeout(() => setToast(null), 4000); }; return () => { _neosNotifyRef.current = null; }; }, []);
            const upd = fn => setStore(p => ({ ...p, ...fn(p) }));

            /* ── CLIENTS ── */
            const addClient = async data => {
                const c = { id: genId(), createdAt: new Date().toISOString(), ...getModUser(), ...data };
                setStore(p => ({ ...p, clients: [...p.clients, c] }));
                try {
                    const { error } = await supabase.from('clients').insert([c]);
                    if (error) {
                        console.error('[Neos] addClient Supabase error:', error);
                        notify('Supabase: ' + (error.message || error.code || 'Erro ao salvar. Verifique o console (F12).'), 'warn');
                    } else {
                        notify('Cliente adicionado ✓');
                    }
                } catch (e) {
                    console.error('[Neos] addClient exception:', e);
                    notify('Erro de conexão com Supabase. Dados salvos localmente.', 'warn');
                }
            };
            const editClient = (id, data) => {
                const m = getModUser();
                upd(p => ({
                    clients: p.clients.map(c => c.id === id ? { ...c, ...data, ...m } : c),
                    financials: p.financials.map(f => f.clientId === id ? { ...f, amount: parseFloat(data.plan) || f.amount, clientName: data.name || f.clientName } : f),
                    tasks: p.tasks.map(t => t.clientId === id ? { ...t, clientName: data.name || t.clientName } : t),
                }));
                supaUpdate('clients', id, { ...data, ...m });
                notify('Cliente atualizado ✓');
            };
            const deleteClient = id => {
                upd(p => ({ clients: p.clients.filter(c => c.id !== id), tasks: p.tasks.filter(t => t.clientId !== id), financials: p.financials.filter(f => f.clientId !== id), trafficData: p.trafficData.filter(t => t.clientId !== id), designReqs: p.designReqs.filter(d => d.clientId !== id), performance: (p.performance || []).filter(r => r.clientId !== id) }));
                supaDelete('clients', id);
                notify('Cliente excluído', 'warn');
            };

            /* ── TASKS ── */
            const addTask = data => { const t = { id: genId(), createdAt: new Date().toISOString(), ...getModUser(), ...data }; upd(p => ({ tasks: [...p.tasks, t] })); supaSave('tasks', t); notify('Tarefa criada ✓'); };
            const editTask = (id, data) => { const m = getModUser(); upd(p => ({ tasks: p.tasks.map(t => t.id === id ? { ...t, ...data, ...m } : t) })); supaUpdate('tasks', id, { ...data, ...m }); };
            const deleteTask = id => { upd(p => ({ tasks: p.tasks.filter(t => t.id !== id) })); supaDelete('tasks', id); notify('Tarefa excluída', 'warn'); };
            const moveTask = (id, status) => { upd(p => ({ tasks: p.tasks.map(t => t.id === id ? { ...t, status } : t) })); supaUpdate('tasks', id, { status }); };
            const resetTasks = () => { upd(p => { p.tasks.forEach(t => supaDelete('tasks', t.id)); return { tasks: [] }; }); notify('Todas as tarefas foram resetadas', 'warn'); };

            /* ── FINANCIALS ── */
            const addFin = data => { const f = { id: genId(), createdAt: new Date().toISOString(), ...getModUser(), ...data }; upd(p => ({ financials: [...p.financials, f] })); supaSave('financials', f); notify('Registro adicionado ✓'); };
            const editFin = (id, data) => { const m = getModUser(); upd(p => ({ financials: p.financials.map(f => f.id === id ? { ...f, ...data, ...m } : f) })); supaUpdate('financials', id, { ...data, ...m }); notify('Registro atualizado ✓'); };
            const deleteFin = id => { upd(p => ({ financials: p.financials.filter(f => f.id !== id) })); supaDelete('financials', id); notify('Registro excluído', 'warn'); };

            const saveTraffic = data => {
                upd(p => {
                    const ex = p.trafficData.find(t => t.clientId === data.clientId);
                    if (ex) { supaUpdate('trafficData', ex.id, data); return { trafficData: p.trafficData.map(t => t.clientId === data.clientId ? { ...t, ...data } : t) }; }
                    const n = { id: genId(), ...data }; supaSave('trafficData', n); return { trafficData: [...p.trafficData, n] };
                });
                notify('Dados de tráfego salvos ✓');
            };

            /* ── DESIGN ── */
            const addDesign = data => { const d = { id: genId(), revisions: 0, createdAt: new Date().toISOString(), ...getModUser(), ...data }; upd(p => ({ designReqs: [...p.designReqs, d] })); supaSave('designReqs', d); notify('Solicitação de design criada ✓'); };
            const editDesign = (id, data) => { const m = getModUser(); upd(p => ({ designReqs: p.designReqs.map(d => d.id === id ? { ...d, ...data, ...m } : d) })); supaUpdate('designReqs', id, { ...data, ...m }); notify('Atualizado ✓'); };
            const deleteDesign = id => { upd(p => ({ designReqs: p.designReqs.filter(d => d.id !== id) })); supaDelete('designReqs', id); notify('Excluído', 'warn'); };

            /* ── PERFORMANCE ── */
            const addPerformance = data => { const r = { id: genId(), createdAt: new Date().toISOString(), ...getModUser(), ...data }; upd(p => ({ performance: [...(p.performance || []), r] })); supaSave('performance', r); notify('Registro de performance criado ✓'); };
            const editPerformance = (id, data) => { const m = getModUser(); upd(p => ({ performance: (p.performance || []).map(r => r.id === id ? { ...r, ...data, ...m } : r) })); supaUpdate('performance', id, { ...data, ...m }); notify('Atualizado ✓'); };
            const deletePerformance = id => { upd(p => ({ performance: (p.performance || []).filter(r => r.id !== id) })); supaDelete('performance', id); notify('Excluído', 'warn'); };

            /* ── CALENDAR EVENTS ── */
            const addCalEvent = (data, silent = false) => {
                const e = { id: genId(), createdAt: new Date().toISOString(), source: 'local', ...data };
                const clientEntry = (data.clientId && data.clientId !== '__outro__')
                    ? store.clients.find(c => c.id === data.clientId) : null;
                const clientName = clientEntry?.name || data.clientCustomName || data.clientName || '';
                const task = {
                    id: genId(), createdAt: new Date().toISOString(),
                    title: data.title, desc: data.desc || '',
                    status: 'A Fazer', dueDate: data.date,
                    clientId: clientEntry ? data.clientId : '', clientName,
                    priority: 'Média', assignee: '',
                    category: data.category || '', fromCalendar: true,
                };
                upd(p => ({ calEvents: [...(p.calEvents || []), e], tasks: [...p.tasks, task] }));
                supaSave('calEvents', e);
                supaSave('tasks', task);
                if (!silent) notify('Evento criado ✓ — tarefa adicionada ao Kanban');
            };
            const editCalEvent = (id, data) => { const m = getModUser(); upd(p => ({ calEvents: (p.calEvents || []).map(e => e.id === id ? { ...e, ...data, ...m } : e) })); supaUpdate('calEvents', id, { ...data, ...m }); notify('Evento atualizado ✓'); };
            const deleteCalEvent = id => { upd(p => ({ calEvents: (p.calEvents || []).filter(e => e.id !== id) })); supaDelete('calEvents', id); notify('Evento excluído', 'warn'); };

            /* ── CLIENT IMAGES ── */
            const addClientImage = (clientId, imgData) => { const img = { id: genId(), clientId, ...imgData, createdAt: new Date().toISOString() }; upd(p => ({ clientImages: [...(p.clientImages || []), img] })); supaSave('clientImages', img); };
            const deleteClientImage = id => { upd(p => ({ clientImages: (p.clientImages || []).filter(i => i.id !== id) })); supaDelete('clientImages', id); };

            /* ── COSTS ── */
            const addCost = data => { const c = { id: genId(), createdAt: new Date().toISOString(), ...getModUser(), ...data }; upd(p => ({ costs: [...(p.costs || []), c] })); supaSave('costs', c); notify('Custo adicionado ✓'); };
            const editCost = (id, data) => { const m = getModUser(); upd(p => ({ costs: (p.costs || []).map(c => c.id === id ? { ...c, ...data, ...m } : c) })); supaUpdate('costs', id, { ...data, ...m }); notify('Custo atualizado ✓'); };
            const deleteCost = id => { upd(p => ({ costs: (p.costs || []).filter(c => c.id !== id) })); supaDelete('costs', id); notify('Custo excluído', 'warn'); };

            /* ── CAMPAIGNS (Tráfego Pago) ── */
            const addCampaign = data => {
                upd(p => {
                    const camp = { id: genId(), createdAt: new Date().toISOString(), ...data };
                    const updates = { trafficData: [...p.trafficData, camp] };
                    supaSave('trafficData', camp);

                    /* Se o cliente for Neos, adiciona automaticamente em Custos e Financeiro */
                    if (data.clientName === 'Neos' && parseFloat(data.budget) > 0) {
                        const campLabel = `${data.campaignName || 'Campanha'} — ${MESES[(data.month || 1) - 1]}/${data.year || new Date().getFullYear()}`;
                        const today = new Date().toISOString().slice(0, 10);

                        const newCost = {
                            id: genId(), createdAt: new Date().toISOString(),
                            name: `Tráfego Pago: ${campLabel}`,

                            date: today, notes: `Gerado automaticamente da campanha "${campLabel}"`
                        };
                        const newFin = {
                            id: genId(), createdAt: new Date().toISOString(),
                            clientName: 'Neos', clientId: data.clientId,
                            amount: parseFloat(data.budget), type: 'Avulso', status: 'Pendente',
                            date: today, notes: `Investimento em tráfego pago: ${campLabel}`
                        };
                        supaSave('costs', newCost);
                        supaSave('financials', newFin);
                        updates.costs = [...(p.costs || []), newCost];
                        updates.financials = [...p.financials, newFin];
                    }
                    return updates;
                });
                notify('Campanha criada ✓');
            };
            const editCampaign = (id, data) => { const m = getModUser(); upd(p => ({ trafficData: p.trafficData.map(t => t.id === id ? { ...t, ...data, ...m } : t) })); supaUpdate('trafficData', id, { ...data, ...m }); notify('Campanha atualizada ✓'); };
            const deleteCampaign = id => { upd(p => ({ trafficData: p.trafficData.filter(t => t.id !== id) })); supaDelete('trafficData', id); notify('Campanha excluída', 'warn'); };

            if (!dbReady) return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 16, background: '#07070f', color: 'rgba(255,255,255,.6)' }}>
                    <div style={{ width: 36, height: 36, border: '3px solid rgba(255,0,64,.3)', borderTopColor: '#ff0040', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    <span style={{ fontSize: 13 }}>Carregando banco de dados...</span>
                    <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
                </div>
            );

            return (
                <Ctx.Provider value={{ store, view, setView, toast, dbReady, supaStatus, userRole, onlineUsers, chatOpen, setChatOpen, chatMessages, sendChatMsg, refreshData, exportJSON, importJSON, addClient, editClient, deleteClient, addTask, editTask, deleteTask, moveTask, resetTasks, addFin, editFin, deleteFin, saveTraffic, addDesign, editDesign, deleteDesign, addPerformance, editPerformance, deletePerformance, addCalEvent, editCalEvent, deleteCalEvent, addCost, editCost, deleteCost, addCampaign, editCampaign, deleteCampaign, calFocusDate, setCalFocusDate, notify, addClientImage, deleteClientImage }}>
                    {children}
                </Ctx.Provider>
            );
        }

        /* ── ICONS ──────────────────────────────────────────── */

        /* ── TOAST ──────────────────────────────────────────── */
        function Toast() {
            const { toast } = useApp();
            if (!toast) return null;
            const ok = toast.type !== 'warn';
            return (
                <div className="fade-in" style={{ position: 'fixed', top: 20, right: 20, zIndex: 9999, background: ok ? 'rgba(0,200,100,.12)' : 'rgba(255,180,0,.12)', border: '1px solid ' + (ok ? '#00c864' : '#ffb400'), borderRadius: 10, padding: '11px 18px', fontSize: 13, fontWeight: 500, backdropFilter: 'blur(20px)', display: 'flex', alignItems: 'center', gap: 8, boxShadow: '0 4px 30px rgba(0,0,0,.3)' }}>

                    const reader = new FileReader();
                    reader.onload = ev => setF(p => ({ ...p, images: [...(p.images || []), ev.target.result] }));
                    reader.readAsDataURL(file);
                });
                e.target.value = '';

                const req = store.designReqs.find(r => r.id === reqId);

                const subtasks = [...(req.subtasks || [])];

                                        </div>
                                    ))}

                            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 20 }}>

                                <button type="submit" className="btn-primary">{task ? 'Salvar' : '+ Adicionar Task'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        /* ── DASHBOARD ──────────────────────────────────────── */
        function Dashboard() {
            const { store, setView } = useApp();
            const { clients, tasks, financials, trafficData } = store;
            const active = clients.filter(c => c.status === 'Ativo').length;
            const paid = financials.filter(f => f.status === 'Pago').reduce((s, f) => s + (f.amount || 0), 0);
            const pending = financials.filter(f => f.status === 'Pendente').reduce((s, f) => s + (f.amount || 0), 0);
            const overdue = financials.filter(f => f.status === 'Atrasado').reduce((s, f) => s + (f.amount || 0), 0);
            const avgTicket = active ? (clients.filter(c => c.status === 'Ativo').reduce((s, c) => s + (parseFloat(c.plan) || 0), 0) / active) : 0;
            const avgRoas = trafficData.length ? (trafficData.reduce((s, t) => s + (parseFloat(t.roas) || 0), 0) / trafficData.length) : 0;
            const overdueTasks = tasks.filter(t => t.dueDate && isOverdue(t.dueDate) && t.status !== 'Concluído');
            const nearDue = tasks.filter(t => { const d = daysLeft(t.dueDate); return d !== null && d >= 0 && d <= 3 && t.status !== 'Concluído'; });

            const revRef = useRef(null); const revChart = useRef(null);
            useEffect(() => {
                if (!revRef.current) return;
                if (revChart.current) revChart.current.destroy();
                const map = {};
                financials.forEach(f => { if (!map[f.clientName]) map[f.clientName] = { paid: 0, pending: 0, overdue: 0 }; if (f.status === 'Pago') map[f.clientName].paid += f.amount || 0; else if (f.status === 'Pendente') map[f.clientName].pending += f.amount || 0; else if (f.status === 'Atrasado') map[f.clientName].overdue += f.amount || 0; });
                const labels = Object.keys(map).slice(0, 10);
                revChart.current = new Chart(revRef.current, { type: 'bar', data: { labels: labels.length ? labels : ['No data'], datasets: [{ label: 'Pago', data: labels.length ? labels.map(l => map[l].paid) : [0], backgroundColor: 'rgba(0,200,100,.65)', borderRadius: 5 }, { label: 'Pendente', data: labels.length ? labels.map(l => map[l].pending) : [0], backgroundColor: 'rgba(255,200,0,.65)', borderRadius: 5 }, { label: 'Atrasado', data: labels.length ? labels.map(l => map[l].overdue) : [0], backgroundColor: 'rgba(255,60,60,.65)', borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: 'rgba(255,255,255,.6)', font: { size: 11 } } } }, scales: { x: { ticks: { color: 'rgba(255,255,255,.4)' }, grid: { color: 'rgba(255,255,255,.04)' } }, y: { ticks: { color: 'rgba(255,255,255,.4)', callback: v => 'R$' + v.toLocaleString('pt-BR') }, grid: { color: 'rgba(255,255,255,.04)' } } } } });
                return () => { if (revChart.current) revChart.current.destroy(); };
            }, [financials]);

            const doRef = useRef(null); const doChart = useRef(null);
            useEffect(() => {
                if (!doRef.current) return;
                if (doChart.current) doChart.current.destroy();
                const counts = COLS.map(c => tasks.filter(t => t.status === c).length);
                doChart.current = new Chart(doRef.current, { type: 'doughnut', data: { labels: COLS, datasets: [{ data: counts, backgroundColor: ['rgba(120,120,200,.75)', 'rgba(100,160,255,.75)', 'rgba(255,200,0,.75)', 'rgba(180,80,255,.75)', 'rgba(0,200,100,.75)'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'bottom', labels: { color: 'rgba(255,255,255,.5)', font: { size: 11 }, padding: 10 } } } } });
                return () => { if (doChart.current) doChart.current.destroy(); };
            }, [tasks]);

            const [hidden, setHidden] = React.useState({});
            const MC = ({ id, label, value, sub, color, icon }) => {
                const isHidden = !!hidden[id];
                return (
                    <div className="glass metric-card glass-hover">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                            <span style={{ fontSize: 10.5, color: 'rgba(255,255,255,.45)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: .5 }}>{label}</span>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                <button onClick={() => setHidden(h => ({ ...h, [id]: !h[id] }))} style={{ background: 'none', border: 'none', cursor: 'pointer', color: isHidden ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.2)', padding: 0, display: 'flex', alignItems: 'center', transition: 'color .2s' }} title={isHidden ? 'Mostrar valor' : 'Ocultar valor'}>
                                    <Ic n={isHidden ? 'eyeOff' : 'eye'} s={13} />
                                </button>
                                <span style={{ color, opacity: .7 }}><Ic n={icon} s={15} /></span>
                            </div>
                        </div>
                        <div style={{ fontSize: 24, fontWeight: 700, color, lineHeight: 1, letterSpacing: isHidden ? 2 : 0 }}>{isHidden ? '• • • •' : value}</div>
                        {sub && <div style={{ fontSize: 11, color: 'rgba(255,255,255,.35)', marginTop: 5 }}>{isHidden ? '——' : sub}</div>}
                    </div>
                );
            };

            return (
                <div className="fade-in">
                    <div style={{ marginBottom: 20 }}>
                        <h1 style={{ fontSize: 21, fontWeight: 700 }}>Dashboard</h1>
                        <p style={{ fontSize: 13, color: 'rgba(255,255,255,.38)', marginTop: 3 }}>{new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                    </div>
                    {(overdueTasks.length > 0 || nearDue.length > 0) && (
                        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
                            {overdueTasks.length > 0 && <div onClick={() => setView('kanban')} style={{ background: 'rgba(255,0,64,.1)', border: '1px solid rgba(255,0,64,.3)', borderRadius: 8, padding: '8px 14px', fontSize: 12, color: '#ff4060', display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}><Ic n="alert" s={13} />{overdueTasks.length} tarefa{overdueTasks.length > 1 ? 's' : ''} atrasada{overdueTasks.length > 1 ? 's' : ''}</div>}
                            {nearDue.length > 0 && <div style={{ background: 'rgba(255,200,0,.1)', border: '1px solid rgba(255,200,0,.3)', borderRadius: 8, padding: '8px 14px', fontSize: 12, color: '#ffcc00', display: 'flex', alignItems: 'center', gap: 6 }}><Ic n="clock" s={13} />{nearDue.length} tarefa{nearDue.length > 1 ? 's' : ''} com prazo próximo</div>}
                        </div>
                    )}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(170px,1fr))', gap: 14, marginBottom: 18 }}>
                        <MC id="ativos" label="Clientes Ativos" value={active} sub={(clients.length - active) + ' inativos'} color="#00c864" icon="clients" />
                        <MC id="caixa" label="Caixa" value={fmt(paid)} sub="Este período" color="#ff0040" icon="finance" />
                        <MC id="pendente" label="Pendente" value={fmt(pending)} sub={overdue > 0 ? fmt(overdue) + ' atrasado' : 'Em dia'} color="#ffcc00" icon="clock" />
                        <MC id="ticket" label="Ticket Médio" value={fmt(avgTicket)} sub="Por cliente ativo" color="#a060ff" icon="target" />
                        <MC id="tarefas" label="Total de Tarefas" value={tasks.length} sub={tasks.filter(t => t.status === 'Concluído').length + ' concluídas'} color="#4090ff" icon="kanban" />
                        <MC id="roas" label="ROAS Médio" value={(avgRoas || 0).toFixed(2) + 'x'} sub={trafficData.length + ' campanha' + (trafficData.length !== 1 ? 's' : '')} color="#ff8030" icon="trend" />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16, marginBottom: 16 }}>
                        <div className="glass" style={{ padding: 20 }}>
                            <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 14, color: 'rgba(255,255,255,.7)' }}>Receita por Cliente</div>
                            <div style={{ height: 210 }}><canvas ref={revRef} /></div>
                        </div>
                        <div className="glass" style={{ padding: 20 }}>
                            <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 14, color: 'rgba(255,255,255,.7)' }}>Tarefas por Status</div>
                            <div style={{ height: 210 }}><canvas ref={doRef} /></div>
                        </div>
                    </div>

                    {/* ── FUNIL KANBAN + RANKING PÓDIO ── */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>

                        {/* FUNIL */}
                        <div className="glass" style={{ padding: 22 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
                                <div>
                                    <div style={{ fontWeight: 700, fontSize: 13, color: 'rgba(255,255,255,.8)' }}>Funil de Tarefas — Kanban</div>
                                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,.35)', marginTop: 2 }}>{tasks.length} tarefas no total</div>
                                </div>
                                <button onClick={() => setView('kanban')} style={{ background: 'none', border: '1px solid rgba(255,255,255,.1)', borderRadius: 6, color: 'rgba(255,255,255,.4)', fontSize: 11, padding: '4px 10px', cursor: 'pointer' }}>Ver Kanban</button>
                            </div>
                            {(() => {
                                const stages = [
                                    { name: 'Backlog', color: '#7878c8', bg: 'rgba(120,120,200,.15)' },
                                    { name: 'A Fazer', color: '#4090ff', bg: 'rgba(64,144,255,.15)' },
                                    { name: 'Em Andamento', color: '#ffcc00', bg: 'rgba(255,204,0,.15)' },
                                    { name: 'Em Revisão', color: '#b060ff', bg: 'rgba(176,96,255,.15)' },
                                    { name: 'Concluído', color: '#00c864', bg: 'rgba(0,200,100,.15)' },
                                ];
                                const counts = stages.map(s => tasks.filter(t => t.status === s.name).length);
                                const maxCount = Math.max(...counts, 1);
                                const total = tasks.length || 1;
                                return (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                                        {stages.map((s, i) => {
                                            const cnt = counts[i];
                                            const pct = cnt / maxCount;
                                            const widthPct = 55 + pct * 45; /* funil: mín 55%, máx 100% */
                                            return (
                                                <div key={s.name} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                                    {/* rótulo */}
                                                    <div style={{ width: 100, fontSize: 11, color: 'rgba(255,255,255,.55)', fontWeight: 600, flexShrink: 0, textAlign: 'right' }}>{s.name}</div>
                                                    {/* barra funil (fica menor em relação ao máximo) */}
                                                    <div style={{ flex: 1, display: 'flex', alignItems: 'center' }}>
                                                        <div style={{ width: widthPct + '%', height: 34, borderRadius: 6, background: s.bg, border: '1px solid ' + s.color + '44', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 12px', transition: 'width .4s ease', position: 'relative', overflow: 'hidden' }}>
                                                            {/* preenchimento proporcional */}
                                                            <div style={{ position: 'absolute', left: 0, top: 0, height: '100%', width: (cnt / maxCount * 100) + '%', background: 'linear-gradient(90deg,' + s.color + '40,' + s.color + '18)', borderRadius: 6 }} />
                                                            <span style={{ fontSize: 12, fontWeight: 700, color: s.color, position: 'relative' }}>{cnt}</span>
                                                            <span style={{ fontSize: 10, color: 'rgba(255,255,255,.35)', position: 'relative' }}>{total > 0 ? ((cnt / total) * 100).toFixed(0) : 0}%</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {/* taxa de conclusão */}
                                        <div style={{ marginTop: 6, paddingTop: 12, borderTop: '1px solid rgba(255,255,255,.06)', display: 'flex', justifyContent: 'space-between', fontSize: 11 }}>
                                            <span style={{ color: 'rgba(255,255,255,.4)' }}>Taxa de conclusão</span>
                                            <span style={{ fontWeight: 700, color: counts[4] / total >= .5 ? '#00c864' : '#ffcc00' }}>
                                                {total > 0 ? ((counts[4] / total) * 100).toFixed(0) : 0}%
                                            </span>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>

                        {/* RANKING PÓDIO */}
                        <div className="glass" style={{ padding: 22 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>

                                    <div style={{ fontWeight: 700, fontSize: 13, color: 'rgba(255,255,255,.8)' }}>Ranking de Clientes</div>

                                </div>
                                <button onClick={() => setView('clients')} style={{ background: 'none', border: '1px solid rgba(255,255,255,.1)', borderRadius: 6, color: 'rgba(255,255,255,.4)', fontSize: 11, padding: '4px 10px', cursor: 'pointer' }}>Ver Clientes</button>
                            </div>
                            {(() => {
                                const ranked = [...clients].filter(c => parseFloat(c.plan) > 0).sort((a, b) => parseFloat(b.plan) - parseFloat(a.plan));
                                if (ranked.length === 0) return (
                                    <div style={{ textAlign: 'center', padding: '30px 0', color: 'rgba(255,255,255,.25)', fontSize: 13 }}>Nenhum cliente com mensalidade cadastrada.</div>
                                );
                                const podium = ranked.slice(0, 3);
                                const rest = ranked.slice(3, 8);
                                const maxPlan = parseFloat(ranked[0].plan);
                                /* cores do pódio */
                                const medals = [
                                    { bg: 'linear-gradient(135deg,#b8860b,#ffd700)', border: '#ffd700', label: '🥇', h: 80 },
                                    { bg: 'linear-gradient(135deg,#707070,#c0c0c0)', border: '#c0c0c0', label: '🥈', h: 60 },
                                    { bg: 'linear-gradient(135deg,#7b3f00,#cd7f32)', border: '#cd7f32', label: '🥉', h: 44 },
                                ];
                                /* reordena pódio visual: 2º - 1º - 3º */
                                const podiumOrder = [podium[1], podium[0], podium[2]].filter(Boolean);
                                const podiumMedals = podium[1] ? [medals[1], medals[0], medals[2]] : [medals[0], medals[2]].filter(Boolean);
                                return (
                                    <div>
                                        {/* pódio visual */}
                                        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: 8, marginBottom: 16, height: 130 }}>

                                                    <div key={c.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1, maxWidth: 110 }}>

                                                        <div style={{ fontSize: 10, fontWeight: 700, color: m.border, marginBottom: 4 }}>{fmt(c.plan)}</div>
                                                        {/* coluna pódio */}
                                                        <div style={{ width: '100%', height: m.h, background: m.bg, borderRadius: '4px 4px 0 0', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, opacity: .9, boxShadow: 'inset 0 2px 8px rgba(255,255,255,.1)' }}>{m.label}</div>
                                                    </div>

                                        {rest.length > 0 && (
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, borderTop: '1px solid rgba(255,255,255,.06)', paddingTop: 12 }}>
                                                {rest.map((c, i) => {
                                                    const rank = i + 4;
                                                    const barW = (parseFloat(c.plan) / maxPlan) * 100;

        /* ── KANBAN ─────────────────────────────────────────── */
        const PCOL = { Baixa: '#4090ff', Média: '#ffcc00', Alta: '#ff8020', Crítica: '#ff0040' };

            const colColor = { 'Backlog': 'rgba(140,140,210,.7)', 'A Fazer': 'rgba(100,160,255,.7)', 'Em Andamento': 'rgba(255,200,0,.7)', 'Em Revisão': 'rgba(180,80,255,.7)', 'Concluído': 'rgba(0,200,100,.7)' };

                        </div>
                    </div>

                            const ct = allTasks.filter(t => t.status === col);
                            return (
                                <div key={col} className={'kanban-col' + (dragOver === col ? ' drag-over' : '')} style={{ flex: '0 0 232px' }} onDragOver={e => onDO(e, col)} onDrop={e => onDrop(e, col)} onDragLeave={() => setDragOver(null)}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>

                                        <div style={{ background: 'rgba(255,255,255,.08)', borderRadius: 10, padding: '2px 8px', fontSize: 11, fontWeight: 700 }}>{ct.length}</div>
                                    </div>

                                        const dl = daysLeft(t.dueDate);
                                        const over = t.dueDate && isOverdue(t.dueDate) && t.status !== 'Concluído';
                                        return (
                                            <div key={t.id} className={'task-card' + (dragging?.id === t.id ? ' dragging' : '')} draggable onDragStart={e => onDS(e, t)} onDragEnd={() => { setDragging(null); setDragOver(null); }}
                                                style={{ borderLeft: '3px solid ' + (PCOL[t.priority] || '#666'), ...(over ? { borderColor: '#ff0040', boxShadow: '0 0 10px rgba(255,0,64,.22)' } : {}) }}>
                                                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 7, lineHeight: 1.35 }}>{t.title}</div>
                                                {t.clientName && <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 5 }}>👤 {t.clientName}</div>}

                                                </div>
                                                {t.assignee && <div style={{ fontSize: 10, color: 'rgba(255,255,255,.3)', marginTop: 6 }}>→ {t.assignee.split(' ')[0]}</div>}

        /* ── PDF CAMPANHA ───────────────────────────────────── */
        async function gerarPDFCampanha(rec, client) {
            if (typeof window.jspdf === 'undefined') { alert('Biblioteca jsPDF nao carregada. Verifique sua conexao e recarregue a pagina.'); return; }
            const { jsPDF } = window.jspdf;

            /* ── métricas ── */
            const bgt = parseFloat(rec.budget) || 0;
            const lds = parseInt(rec.leads) || 0;
            const sls = parseInt(rec.sales) || 0;

        function PromptTemplateModal({ onClose }) {

            const refImages = (store.clientImages || []).filter(i => i.clientId === selId && i.type !== 'pessoa');
            const pessoasImages = (store.clientImages || []).filter(i => i.clientId === selId && i.type === 'pessoa');
            /* visualStyle column stores { s, f, c } JSON — or plain text (legacy) */
            const parseVS = raw => { try { const o = JSON.parse(raw || '{}'); if (o && typeof o.s !== 'undefined') return { s: o.s || '', f: o.f || [], c: o.c || [] }; } catch { } return { s: raw || '', f: [], c: [] }; };
            const pick = id => {
                setSelId(id); setTab('modelo');
                const cl = store.clients.find(c => c.id === id);
                setTmpl(cl?.promptTemplate || '');
                const vs = parseVS(cl?.visualStyle);
                setVisualStyle(vs.s); setFonts(vs.f); setColors(vs.c);
            };
            const save = () => {
                if (!selId) return;
                const vsEncoded = JSON.stringify({ s: visualStyle, f: fonts, c: colors });
                editClient(selId, { promptTemplate: tmpl, visualStyle: vsEncoded });
                onClose();
            };
            const addFont = () => { const f = newFont.trim(); if (!f || fonts.includes(f)) return; setFonts(p => [...p, f]); setNewFont(''); };
            const addColor = () => setColors(p => [...p, '#6366f1']);
            const updateColor = (i, v) => setColors(p => p.map((c, idx) => idx === i ? v : c));
            const compressImg = file => new Promise(resolve => { const r = new FileReader(); r.onload = e => { const img = new Image(); img.onload = () => { const MAX = 500; let w = img.naturalWidth, h = img.naturalHeight; if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } } const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); resolve(c.toDataURL('image/jpeg', 0.75)); }; img.src = e.target.result; }; r.readAsDataURL(file); });
            const addRefImage = async file => { const data = await compressImg(file); addClientImage(selId, { name: file.name, data, type: 'ref' }); };
            const addPessoaImage = async file => { const data = await compressImg(file); addClientImage(selId, { name: file.name, data, type: 'pessoa' }); };
            return (
