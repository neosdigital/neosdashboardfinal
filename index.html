    <!-- Watchdog de tela preta: roda antes de qualquer CDN, em JS puro (sem depender de React/Babel) -->
    <script>
    (function () {
        var shown = false;
        function showFallback(msg) {
            if (shown) return;
            shown = true;
            var root = document.getElementById('root') || document.body;
            root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#07070f;gap:14px;font-family:system-ui,sans-serif">' +
                '<div style="width:36px;height:36px;border:3px solid rgba(255,0,64,.4);border-top-color:#ff0040;border-radius:50%;animation:neos-spin 1s linear infinite"></div>' +
                '<span style="font-size:13px;color:rgba(255,80,80,.85);font-weight:600">Falha ao carregar o dashboard</span>' +
                '<span style="font-size:11px;color:rgba(255,255,255,.45);max-width:320px;text-align:center">' + (msg || 'Verifique sua conexão com a internet.') + '</span>' +
                '<button onclick="window.location.reload()" style="margin-top:4px;padding:8px 20px;background:rgba(255,0,64,.12);border:1px solid rgba(255,0,64,.3);border-radius:8px;color:rgba(255,80,80,.85);font-size:12px;cursor:pointer;font-weight:600">Recarregar</button>' +
                '</div><style>@keyframes neos-spin{to{transform:rotate(360deg)}}</style>';
        }
        window.addEventListener('error', function (e) {
            var t = e.target;
            if (t && t.tagName === 'SCRIPT' && t.src) {
                showFallback('Não foi possível carregar um recurso externo (' + t.src.split('/')[2] + '). Verifique sua conexão ou desative bloqueadores de anúncio.');
            } else if (!t || t === window) {
                showFallback(e.message);
            }
        }, true);
        setTimeout(function () {
            var root = document.getElementById('root');
            if (root && !root.hasChildNodes()) showFallback('O carregamento demorou demais.');
        }, 15000);
        window._neosShowFallback = showFallback;
    })();
    </script>

    <!-- Railway backend shim — substitui supabase-js -->
    <script>
    /* createNeosClient: client compatível com supabase-js que fala com o backend Railway.
       Implementa: from().select/insert/upsert/update/delete/eq/not/neq/maybeSingle
                   channel().on(postgres_changes|broadcast|presence).subscribe/send/track
                   removeChannel */
    window._createNeosClient = function(apiUrl) {
        const wsUrl = apiUrl.replace(/^https/, 'wss').replace(/^http/, 'ws');
        let _ws = null, _wsReady = false;
        const _pending = [], _channels = new Map();

        function getWs() {
            if (_ws && (_ws.readyState === 0 || _ws.readyState === 1)) return _ws;
            _ws = new WebSocket(wsUrl);
            _ws.onopen = () => {
                _wsReady = true;
                _pending.splice(0).forEach(m => _ws.send(m));
            };
            _ws.onmessage = ({ data }) => {
                try {
                    const msg = JSON.parse(data);
                    _channels.forEach(ch => ch._handle(msg));
                } catch {}
            };
            _ws.onclose = () => { _wsReady = false; setTimeout(getWs, 3000); };
            _ws.onerror = () => {};
            return _ws;
        }

        function wsSend(obj) {
            const s = JSON.stringify(obj);
            if (_wsReady && _ws.readyState === 1) _ws.send(s);
            else { getWs(); _pending.push(s); }
        }

        /* ── QueryBuilder ── */
        class QB {
            constructor(table) {
                this._t = table; this._op = 'select'; this._f = {};
                this._notF = []; this._neqF = []; this._body = null;
                this._single = false; this._head = false;
            }
            select(_, opts) { this._op = 'select'; if (opts && opts.head) this._head = true; return this; }
            insert(d)  { this._op = 'insert';  this._body = Array.isArray(d) ? d[0] : d; return this; }
            upsert(d)  { this._op = 'upsert';  this._body = Array.isArray(d) ? d[0] : d; return this; }
            update(d)  { this._op = 'update';  this._body = d; return this; }
            delete()   { this._op = 'delete';  return this; }
            eq(c, v)   { this._f[c] = v; return this; }
            not(c, op, v) { this._notF.push({ c, op, v }); return this; }
            neq(c, v)  { this._neqF.push({ c, v }); return this; }
            maybeSingle() { this._single = true; return this; }
            then(ok, fail) { return this._run().then(ok, fail); }

            async _run() {
                const { _t, _op, _f, _notF, _neqF, _body, _single, _head } = this;
                /* AbortController: cada request tem timeout de 8s — evita loading infinito */
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 8000);
                const _f2 = (url, opts = {}) => fetch(url, { signal: ctrl.signal, ...opts });
                try {
                    if (_op === 'select') {
                        if (_head) {
                            const r = await _f2(`${apiUrl}/health`);
                            return r.ok ? { count: 0, error: null } : { count: null, error: { message: 'offline' } };
                        }
                        const hasFilters = Object.keys(_f).length || _notF.length || _neqF.length;
                        let url;
                        if (hasFilters) {
                            const p = new URLSearchParams();
                            for (const [k, v] of Object.entries(_f)) p.append(`eq_${k}`, v);
                            for (const { c } of _notF) p.append('not_null', c);
                            for (const { c, v } of _neqF) p.append(`neq_${c}`, v ?? '');
                            url = `${apiUrl}/api/${_t}/filter?${p}`;
                        } else {
                            url = `${apiUrl}/api/${_t}`;
                        }
                        const r = await _f2(url);
                        const j = await r.json();
                        if (!r.ok) return { data: null, error: j };
                        if (_single) return { data: j.data?.[0] ?? null, error: null };
                        return { data: j.data || [], error: null };
                    }
                    if (_op === 'insert') {
                        const r = await _f2(`${apiUrl}/api/${_t}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(_body)
                        });
                        const j = await r.json();
                        return { data: j.data, error: j.error || null };
                    }
                    if (_op === 'upsert') {
                        const r = await _f2(`${apiUrl}/api/${_t}`, {
                            method: 'PUT', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(_body)
                        });
                        const j = await r.json();
                        return { data: j.data, error: j.error || null };
                    }
                    if (_op === 'update') {
                        const id = _f.id;
                        const r = await _f2(`${apiUrl}/api/${_t}/${id}`, {
                            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(_body)
                        });
                        const j = await r.json();
                        return { data: j.data, error: j.error || null };
                    }
                    if (_op === 'delete') {
                        const id = _f.id;
                        const r = await _f2(`${apiUrl}/api/${_t}/${id}`, { method: 'DELETE' });
                        const j = await r.json();
                        return { data: j.data, error: j.error || null };
                    }
                } catch (e) {
                    if (e.name === 'AbortError') return { data: null, error: { message: 'timeout' } };
                    return { data: null, error: { message: e.message } };
                } finally {
                    clearTimeout(tid);
                }
            }
        }

        /* ── Channel (Realtime + Chat + Presence) ── */
        class Channel {
            constructor(name) {
                this._name = name; this._dbListeners = []; this._bcastListeners = [];
                this._presenceCbs = []; this._statusCb = null; this._presenceKey = null;
            }
            on(event, filter, cb) {
                if (event === 'postgres_changes') this._dbListeners.push({ table: filter.table, cb });
                else if (event === 'broadcast') this._bcastListeners.push({ event: filter.event, cb });
                else if (event === 'presence') this._presenceCbs.push({ event: filter.event, cb });
                return this;
            }
            subscribe(statusCb) {
                this._statusCb = statusCb;
                const ws = getWs();
                const check = () => {
                    if (ws.readyState === 1) statusCb?.('SUBSCRIBED');
                    else if (ws.readyState === 0) setTimeout(check, 300);
                    else statusCb?.('CHANNEL_ERROR');
                };
                setTimeout(check, 150);
                return this;
            }
            send({ type, event, payload }) {
                wsSend({ type: 'broadcast', channel: this._name, event, payload });
            }
            track(data) {
                if (!this._presenceKey) this._presenceKey = data.username || Math.random().toString(36).slice(2);
                wsSend({ type: 'presence_track', channel: this._name, key: this._presenceKey, data });
            }
            presenceState() { return this._lastPresenceState || {}; }
            _handle(msg) {
                /* DB change */
                if (msg.eventType && msg.table) {
                    this._dbListeners.forEach(l => {
                        if (!l.table || l.table === msg.table)
                            l.cb({ eventType: msg.eventType, new: msg.new || {}, old: msg.old || {} });
                    });
                }
                /* Broadcast (chat / cursores) */
                if (msg.type === 'broadcast') {
                    this._bcastListeners.forEach(l => {
                        if (l.event === msg.event) l.cb({ payload: msg.payload });
                    });
                }
                /* Presence sync */
                if (msg.type === 'presence_sync' && msg.channel === this._name) {
                    this._lastPresenceState = msg.state || {};
                    this._presenceCbs.forEach(l => { if (l.event === 'sync') l.cb(); });
                }
            }
        }

        return {
            from: t => new QB(t),
            channel: name => { const ch = new Channel(name); _channels.set(name, ch); return ch; },
            removeChannel: ch => { if (ch?._name) _channels.delete(ch._name); }
        };
    };
    </script>

    <script type="text/babel">

        /* ── RAILWAY BACKEND ─────────────────────────────────────
           Substitua NEOS_API_URL pela URL do seu serviço Railway.
           Exemplo: 'https://neos-dashboard-api-production.up.railway.app'
        ────────────────────────────────────────────────────────── */
        const NEOS_API_URL = 'https://neosdashboardfinal-production.up.railway.app';
        const supabase = window._createNeosClient(NEOS_API_URL);

        /* teste de conectividade no boot */
        supabase.from('clients').select('id', { count: 'exact', head: true }).then(({ count, error }) => {
            if (error) console.error('[Neos] Railway ERRO de conexão:', error.message);
            else console.log('[Neos] Railway conectado ✓');
        });

        const { useState, useEffect, useContext, useRef } = React;

        /* ── CONSTANTS ─────────────────────────────────────── */
        const COLS = ["Backlog", "A Fazer", "Em Andamento", "Em Revisão", "Concluído"];
        const TEAM = ['Arthur Lemos', 'Lavinia Wallery', 'Miguel Lemos'];
        const RESPONSAVEIS = ['Arthur Lemos', 'Lavinia Wallery', 'Miguel Lemos', 'Caio', 'Funcionário'];
        const genId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
        const fmt = n => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n || 0);
        const fmtD = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
        const isOverdue = d => { if (!d) return false; return new Date(d + 'T23:59:59') < new Date(); };
        const daysLeft = d => { if (!d) return null; return Math.ceil((new Date(d + 'T23:59:59') - new Date()) / 86400000); };
        const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const MESES_SHORT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        const PLATFORMS = ['Instagram', 'Facebook', 'TikTok', 'YouTube', 'LinkedIn', 'Twitter/X'];
        const PLATFORM_COLORS = {
            'Instagram': { hex: '#E1306C', rgb: [225, 48, 108], bg: 'rgba(225,48,108,.15)' },
            'Facebook': { hex: '#1877F2', rgb: [24, 119, 242], bg: 'rgba(24,119,242,.15)' },
            'TikTok': { hex: '#69C9D0', rgb: [105, 201, 208], bg: 'rgba(105,201,208,.15)' },
            'YouTube': { hex: '#FF0000', rgb: [255, 0, 0], bg: 'rgba(255,0,0,.15)' },
            'LinkedIn': { hex: '#0077B5', rgb: [0, 119, 181], bg: 'rgba(0,119,181,.15)' },
            'Twitter/X': { hex: '#1DA1F2', rgb: [29, 161, 242], bg: 'rgba(29,161,242,.15)' },
        };

        const CURSOR_COLORS = ['#a060ff', '#4090ff', '#00c864', '#ffcc00', '#E1306C', '#69C9D0', '#ff8030', '#20c0d0'];
        const getUserColor = u => { let h = 0; for (let c of (u || '')) h = (h * 31 + c.charCodeAt(0)) % CURSOR_COLORS.length; return CURSOR_COLORS[Math.abs(h) % CURSOR_COLORS.length]; };
        const getModUser = () => { try { const s = JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); return { modifiedBy: s?.name || '?', modifiedAt: new Date().toISOString() }; } catch { return { modifiedBy: '?', modifiedAt: new Date().toISOString() }; } };

        /* ── SOM DE NOTIFICAÇÃO (lead novo) ──────────────────
           Sintetizado via Web Audio, sem depender de nenhum arquivo de
           áudio externo. Três notas curtas em arpejo ascendente (sino),
           timbre e melodia diferentes do "doo-doo" do WhatsApp. */
        let _neosAudioCtx = null;
        function playNewLeadSound() {
            try {
                if (!_neosAudioCtx) _neosAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const ctx = _neosAudioCtx;
                if (ctx.state === 'suspended') ctx.resume();
                const now = ctx.currentTime;
                const notes = [740, 988, 1480]; // F#5, B5, F#6 — arpejo ascendente
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const start = now + i * 0.1;
                    gain.gain.setValueAtTime(0, start);
                    gain.gain.linearRampToValueAtTime(0.2, start + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.34);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.36);
                });
            } catch (e) { /* autoplay bloqueado ou navegador sem suporte — segue sem som */ }
        }

        /* ── SUPABASE HELPERS ───────────────────────────────── */
        const _stripCol = (err, obj) => {
            const msg = err?.message || '';
            const m = msg.match(/[Cc]olumn ['"]?([\w]+)['"]?/);
            const col = m?.[1];
            if (col && Object.prototype.hasOwnProperty.call(obj, col)) {
                const copy = { ...obj }; delete copy[col]; return copy;
            }
            return null;
        };
        const supaSave = async (table, record) => {
            let r = { ...record };
            for (let i = 0; i < 12; i++) {
                const { error } = await supabase.from(table).upsert([r]);
                if (!error) return;
                const next = _stripCol(error, r);
                if (next) { r = next; } else { console.error(`[Neos] Supabase save (${table}):`, error.message); _neosNotifyRef.current?.(`Erro ao salvar (${table}): ${error.message.slice(0, 60)}`, 'warn'); return; }
            }
        };
        const supaUpdate = async (table, id, data) => {
            let d = { ...data };
            for (let i = 0; i < 12; i++) {
                const { error } = await supabase.from(table).update(d).eq('id', id);
                if (!error) return;
                const next = _stripCol(error, d);
                if (next) { d = next; } else { console.error(`[Neos] Supabase update (${table}):`, error.message); _neosNotifyRef.current?.(`Erro ao atualizar (${table}): ${error.message.slice(0, 60)}`, 'warn'); return; }
            }
        };
        const supaDelete = async (table, id) => {

        async function hashPassword(pwd) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const _DB_TABLES = ['clients', 'tasks', 'financials', 'trafficData', 'designReqs', 'performance', 'calEvents', 'costs', 'clientImages', 'leads', 'leadInteractions', 'goals', 'dailyTasks', 'dailyTaskComments', 'dailyTaskChecklists', 'dailyTaskLinks'];
        /* notifications é Dexie-only — a tabela não existe no Supabase e sua subscrição
           derrubava o canal Realtime inteiro, impedindo sync de calEvents/tasks */

        async function loadFromDB(onStatus) {
            for (let attempt = 0; attempt < 3; attempt++) {
                if (attempt > 0) {
                    onStatus?.(`Reconectando... (tentativa ${attempt + 1}/3)`);
                    await new Promise(r => setTimeout(r, 2000 * attempt));
                } else {
                    onStatus?.('Carregando dados do banco...');
                }
                try {
                    const results = await Promise.all(_DB_TABLES.map(t => supabase.from(t).select('*')));
                    const erroredTables = _DB_TABLES.filter((_, i) => results[i].error);

                    if (erroredTables.length === _DB_TABLES.length && attempt < 2) {
                        console.warn(`[Neos] Todas as tabelas falharam (tentativa ${attempt + 1}/3), aguardando...`);
                        continue;
                    }

                    let localCache = null;
                    if (erroredTables.length > 0) {
                        console.warn('[Neos] Tabelas com erro, usando cache local para:', erroredTables.join(', '));
                        localCache = await loadFromIndexedDB();
                    }

                    const store = { taskTimers: [] };
                    _DB_TABLES.forEach((t, i) => {
                        store[t] = results[i].error ? (localCache?.[t] || []) : (results[i].data || []);
                    });
                    /* Notifications são Dexie-only — não existe tabela no Supabase */
                    try { store.notifications = (await db.notifications.toArray()) || []; } catch { store.notifications = localCache?.notifications || []; }
                    return store;
                } catch (e) {
                    console.error(`[Neos] loadFromDB tentativa ${attempt + 1}/3 falhou:`, e.message);
                    if (attempt === 2) {
                        onStatus?.('Usando cache local...');
                        const local = await loadFromIndexedDB();
                        return local || { ..._EMPTY_STORE() };
                    }
                }
            }
            onStatus?.('Usando cache local...');
            const local = await loadFromIndexedDB();
            return local || { ..._EMPTY_STORE() };
        }

            const stopTimer = (timerId, startedAt) => { const now = new Date().toISOString(); const ms = Math.round(new Date(now) - new Date(startedAt)); upd(p => ({ taskTimers: (p.taskTimers || []).map(t => t.id === timerId ? { ...t, endedAt: now, totalMs: ms } : t) })); };

            /* ── COSTS ── */
            const addCost = data => { const c = { id: genId(), createdAt: new Date().toISOString(), ...getModUser(), ...data }; upd(p => ({ costs: [...(p.costs || []), c] })); supaSave('costs', c); notify('Custo adicionado ✓'); };

            const deleteCost = id => { upd(p => ({ costs: (p.costs || []).filter(c => c.id !== id) })); supaDelete('costs', id); notify('Custo excluído', 'warn'); };

            /* ── CAMPAIGNS (Tráfego Pago) ── */
            const addCampaign = data => {
                upd(p => {
                    const camp = { id: genId(), createdAt: new Date().toISOString(), ...data };
                    const updates = { trafficData: [...p.trafficData, camp] };
                    supaSave('trafficData', camp);

                    /* Se o cliente for Neos, adiciona automaticamente em Custos e Financeiro */
                    if (data.clientName === 'Neos' && parseFloat(data.budget) > 0) {
                        const campLabel = `${data.campaignName || 'Campanha'} — ${MESES[(data.month || 1) - 1]}/${data.year || new Date().getFullYear()}`;
                        const today = new Date().toISOString().slice(0, 10);

                        const newCost = {
                            id: genId(), createdAt: new Date().toISOString(),
                            name: `Tráfego Pago: ${campLabel}`,
                            type: 'Único', amount: parseFloat(data.budget),
                            date: today, notes: `Gerado automaticamente da campanha "${campLabel}"`
                        };
                        const newFin = {
                            id: genId(), createdAt: new Date().toISOString(),
                            clientName: 'Neos', clientId: data.clientId,
                            amount: parseFloat(data.budget), type: 'Avulso', status: 'Pendente',
                            date: today, notes: `Investimento em tráfego pago: ${campLabel}`
                        };
                        supaSave('costs', newCost);
                        supaSave('financials', newFin);
                        updates.costs = [...(p.costs || []), newCost];
                        updates.financials = [...p.financials, newFin];
                    }
                    return updates;
                });
                notify('Campanha criada ✓');
            };
            const editCampaign = (id, data) => { const m = getModUser(); upd(p => ({ trafficData: p.trafficData.map(t => t.id === id ? { ...t, ...data, ...m } : t) })); supaUpdate('trafficData', id, { ...data, ...m }); notify('Campanha atualizada ✓'); };
            const deleteCampaign = id => { upd(p => ({ trafficData: p.trafficData.filter(t => t.id !== id) })); supaDelete('trafficData', id); notify('Campanha excluída', 'warn'); };

            if (!dbReady) return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 14, background: '#07070f', color: 'rgba(255,255,255,.55)' }}>
                    <div style={{ width: 36, height: 36, border: '3px solid rgba(255,0,64,.25)', borderTopColor: '#ff0040', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />

                            Tentar novamente
                        </button>
                    )}
                    <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
                </div>
            );

            return (
                <Ctx.Provider value={{ store, view, setView, toast, dbReady, supaStatus, userRole, onlineUsers, chatOpen, setChatOpen, chatMessages, sendChatMsg, refreshData, exportJSON, importJSON, addClient, editClient, deleteClient, addTask, editTask, deleteTask, moveTask, resetTasks, addFin, editFin, deleteFin, saveTraffic, addDesign, editDesign, deleteDesign, addPerformance, editPerformance, deletePerformance, addCalEvent, editCalEvent, deleteCalEvent, addDailyTask, editDailyTask, deleteDailyTask, addDailyComment, deleteDailyComment, addDailyChecklistItem, toggleDailyChecklistItem, deleteDailyChecklistItem, linkDailyTaskToEvent, unlinkDailyTask, addCost, editCost, deleteCost, addCampaign, editCampaign, deleteCampaign, calFocusDate, setCalFocusDate, notify, addClientImage, deleteClientImage, metaConns, saveMetaConn, deleteMetaConn, loadMetaConns, addLead, editLead, deleteLead, moveLead, syncLeads, addLeadInteraction, deleteLeadInteraction, addGoal, editGoal, deleteGoal, addNotif, markNotifRead, markAllNotifsRead, startTimer, stopTimer, newLeadIds, hotLeadQueue, dismissHotLead, leadFocusId, setLeadFocusId }}>
                    {children}

        /* ── BACKUP MODAL ───────────────────────────────────── */
        function BackupModal({ onClose }) {
            const { store, exportJSON, importJSON } = useApp();
            const [importing, setImporting] = useState(false);
            const [result, setResult] = useState(null);
            const inputRef = React.useRef();
            const perf = store.performance || [];
            const cal = store.calEvents || [];
            const costs = store.costs || [];
            const lastBackup = localStorage.getItem('lastBackupAt');
            const total = store.clients.length + store.tasks.length + store.financials.length + store.trafficData.length + store.designReqs.length + perf.length + cal.length + costs.length;
            const handleFile = async e => {
                const file = e.target.files[0];
                if (!file) return;
                setImporting(true); setResult(null);
                const ok = await importJSON(file);
                setImporting(false);
                setResult(ok ? 'ok' : 'err');
                if (ok) setTimeout(() => onClose(), 1800);

                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>

                    </div>

        function Confirm({ msg, onOk, onClose }) {

        /* ── SIDEBAR ────────────────────────────────────────── */
        function Sidebar() {
            const { view, setView, supaStatus, userRole, refreshData, newLeadIds } = useApp();
            const [backupOpen, setBackupOpen] = useState(false);
            const [refreshing, setRefreshing] = useState(false);
            const [diagOpen, setDiagOpen] = useState(false);
            const [diagData, setDiagData] = useState(null);
            const [diagLoading, setDiagLoading] = useState(false);
            const [supUrl, setSupUrl] = useState('');
            const [supKey, setSupKey] = useState('');
            const [recStatus, setRecStatus] = useState('');
            const runDiag = async () => {
                setDiagLoading(true); setDiagData(null);
                try {
                    const health = await fetch(`${NEOS_API_URL}/health`).then(r => r.json()).catch(() => ({ ok: false }));
                    const railwayCounts = {};
                    for (const t of _DB_TABLES) { const { data } = await supabase.from(t).select('*'); railwayCounts[t] = data?.length || 0; }
                    const idbCounts = {};
                    for (const t of _DB_TABLES) { idbCounts[t] = await db[t].count().catch(() => 0); }
                    setDiagData({ online: !!health?.ok, railway: railwayCounts, idb: idbCounts,
                        railwayTotal: Object.values(railwayCounts).reduce((a, b) => a + b, 0),
                        idbTotal: Object.values(idbCounts).reduce((a, b) => a + b, 0) });
                } catch (e) { setDiagData({ error: e.message }); }
                setDiagLoading(false);
            };
            const recoverFromSupabase = async () => {
                if (!supUrl.trim() || !supKey.trim()) return;
                setRecStatus('Conectando ao Supabase...');
                const hdrs = { 'apikey': supKey.trim(), 'Authorization': `Bearer ${supKey.trim()}` };
                let total = 0;
                for (const t of _DB_TABLES) {
                    setRecStatus(`Recuperando ${t}...`);
                    try {
                        const res = await fetch(`${supUrl.trim().replace(/\/$/, '')}/rest/v1/${t}?select=*`, { headers: hdrs });
                        if (!res.ok) continue;
                        const recs = await res.json();
                        if (!Array.isArray(recs) || !recs.length) continue;
                        await fetch(`${NEOS_API_URL}/api/${t}/bulk`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(recs) });
                        total += recs.length;
                    } catch {}
                }
                setRecStatus(total > 0 ? `✓ ${total} registros recuperados! Recarregando...` : '⚠ Nenhum dado encontrado no Supabase.');
                if (total > 0) setTimeout(() => window.location.reload(), 2000);
            };
            const isEmployee = userRole !== 'admin';
            const items = [{ id: 'dashboard', label: 'Dashboard', icon: 'dashboard' }, { id: 'leads', label: 'Leads', icon: 'leads' }, { id: 'goals', label: 'Metas & KPIs', icon: 'goals' }, { id: 'clients', label: 'Clientes', icon: 'clients' }, { id: 'kanban', label: 'Kanban', icon: 'kanban' }, { id: 'financial', label: 'Financeiro', icon: 'finance' }, { id: 'traffic', label: 'Tráfego', icon: 'traffic' }, { id: 'design', label: 'Design', icon: 'design' }, { id: 'performance', label: 'Performance', icon: 'perf' }, { id: 'calendar', label: 'Calendário', icon: 'cal' }];
            return (

                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
                                    <span style={{ fontSize: 15, fontWeight: 700 }}>Diagnóstico Railway</span>
                                    <button onClick={() => setDiagOpen(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(255,255,255,.4)', fontSize: 18, padding: '0 4px' }}>×</button>
                                </div>
                                {diagLoading && <div style={{ textAlign: 'center', padding: '24px 0', color: 'rgba(255,255,255,.4)', fontSize: 13 }}>Verificando conexão e contando registros...</div>}
                                {diagData?.error && <div style={{ padding: '12px', borderRadius: 8, background: 'rgba(255,60,60,.1)', border: '1px solid rgba(255,60,60,.2)', color: 'rgba(255,100,100,.9)', fontSize: 12 }}>Erro: {diagData.error}</div>}
                                {diagData && !diagData.error && (
                                    <div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', borderRadius: 8, marginBottom: 14, background: diagData.online ? 'rgba(0,200,100,.08)' : 'rgba(255,60,60,.08)', border: `1px solid ${diagData.online ? 'rgba(0,200,100,.2)' : 'rgba(255,60,60,.2)'}` }}>
                                            <div style={{ width: 8, height: 8, borderRadius: '50%', background: diagData.online ? '#00c864' : '#ff4060', boxShadow: `0 0 6px ${diagData.online ? '#00c864' : '#ff4060'}` }} />
                                            <span style={{ fontSize: 12, fontWeight: 600, color: diagData.online ? 'rgba(0,200,100,.9)' : 'rgba(255,100,100,.9)' }}>API Railway: {diagData.online ? 'Online ✓' : 'Offline ✗'}</span>
                                            <span style={{ marginLeft: 'auto', fontSize: 11, color: 'rgba(255,255,255,.4)' }}>{NEOS_API_URL.replace('https://', '')}</span>
                                        </div>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto auto', gap: '4px 12px', fontSize: 11, marginBottom: 4 }}>
                                            <span style={{ color: 'rgba(255,255,255,.4)', fontWeight: 600 }}>Tabela</span>
                                            <span style={{ color: 'rgba(64,144,255,.7)', fontWeight: 600, textAlign: 'right' }}>Railway</span>
                                            <span style={{ color: 'rgba(255,200,60,.7)', fontWeight: 600, textAlign: 'right' }}>IndexedDB</span>
                                        </div>
                                        <div style={{ borderTop: '1px solid rgba(255,255,255,.06)', paddingTop: 6, marginBottom: 12 }}>
                                            {_DB_TABLES.map(t => (
                                                <div key={t} style={{ display: 'grid', gridTemplateColumns: '1fr auto auto', gap: '2px 12px', padding: '3px 0', borderBottom: '1px solid rgba(255,255,255,.03)' }}>
                                                    <span style={{ fontSize: 11, color: 'rgba(255,255,255,.55)' }}>{t}</span>
                                                    <span style={{ fontSize: 11, textAlign: 'right', color: diagData.railway[t] > 0 ? 'rgba(64,200,100,.9)' : 'rgba(255,255,255,.2)', fontWeight: diagData.railway[t] > 0 ? 600 : 400 }}>{diagData.railway[t]}</span>
                                                    <span style={{ fontSize: 11, textAlign: 'right', color: diagData.idb[t] > 0 ? 'rgba(255,200,60,.9)' : 'rgba(255,255,255,.2)', fontWeight: diagData.idb[t] > 0 ? 600 : 400 }}>{diagData.idb[t]}</span>
                                                </div>
                                            ))}
                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr auto auto', gap: '2px 12px', padding: '6px 0 0', borderTop: '1px solid rgba(255,255,255,.1)', marginTop: 4 }}>
                                                <span style={{ fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,.7)' }}>TOTAL</span>
                                                <span style={{ fontSize: 11, textAlign: 'right', fontWeight: 700, color: diagData.railwayTotal > 0 ? 'rgba(64,200,100,.9)' : 'rgba(255,60,60,.7)' }}>{diagData.railwayTotal}</span>
                                                <span style={{ fontSize: 11, textAlign: 'right', fontWeight: 700, color: diagData.idbTotal > 0 ? 'rgba(255,200,60,.9)' : 'rgba(255,255,255,.3)' }}>{diagData.idbTotal}</span>
                                            </div>
                                        </div>
                                        {diagData.railwayTotal === 0 && (
                                            <div style={{ borderTop: '1px solid rgba(255,255,255,.07)', paddingTop: 16 }}>
                                                <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 10, color: 'rgba(255,200,60,.9)' }}>⚠ Railway vazio — Recuperar do Supabase antigo</div>
                                                <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 10 }}>Cole as credenciais do seu projeto Supabase (ainda acessíveis até 04/Jul/2026)</div>
                                                <input value={supUrl} onChange={e => setSupUrl(e.target.value)} placeholder="URL Supabase (ex: https://xyz.supabase.co)" style={{ width: '100%', boxSizing: 'border-box', background: 'rgba(255,255,255,.05)', border: '1px solid rgba(255,255,255,.12)', borderRadius: 7, padding: '8px 10px', color: '#fff', fontSize: 11, marginBottom: 6 }} />
                                                <input value={supKey} onChange={e => setSupKey(e.target.value)} placeholder="Anon Key do Supabase" style={{ width: '100%', boxSizing: 'border-box', background: 'rgba(255,255,255,.05)', border: '1px solid rgba(255,255,255,.12)', borderRadius: 7, padding: '8px 10px', color: '#fff', fontSize: 11, marginBottom: 10 }} />
                                                {recStatus && <div style={{ fontSize: 11, color: 'rgba(255,200,60,.9)', marginBottom: 8, padding: '6px 8px', background: 'rgba(255,200,60,.06)', borderRadius: 6 }}>{recStatus}</div>}
                                                <button onClick={recoverFromSupabase} disabled={!supUrl || !supKey || recStatus.startsWith('✓')} style={{ width: '100%', padding: '9px', background: 'rgba(255,200,60,.12)', border: '1px solid rgba(255,200,60,.3)', borderRadius: 8, cursor: 'pointer', color: 'rgba(255,200,60,.9)', fontSize: 12, fontWeight: 600 }}>Recuperar dados do Supabase → Railway</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ── DASHBOARD ──────────────────────────────────────── */
        /* ── REPORT EXPORT MODAL ───────────────────────────────── */
        const _MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const _MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

        function ReportExportModal({ onClose }) {
            const { store } = useApp();
            const now = new Date();
            const [exportAll, setExportAll] = useState(false);
            const [fromMonth, setFromMonth] = useState(1);
            const [fromYear, setFromYear] = useState(now.getFullYear());
            const [toMonth, setToMonth] = useState(now.getMonth() + 1);
            const [toYear, setToYear] = useState(now.getFullYear());
            const [generating, setGenerating] = useState(false);
            const [progress, setProgress] = useState('');

            const generate = async () => {
                if (typeof window.jspdf === 'undefined') { alert('jsPDF não carregado. Verifique sua conexão e recarregue.'); return; }
                setGenerating(true);
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
                    const W = 595.28, H = 841.89, M = 40;
                    const CW = W - M * 2;
                    let y = M, pageNum = 1;

                    /* ── PDF Helpers ── */
                    const addPageHeader = (section) => {
                        doc.setFillColor(13, 12, 37);
                        doc.rect(0, 0, W, 32, 'F');
                        doc.setFillColor(230, 51, 85);
                        doc.rect(0, 31, W, 2, 'F');
                        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(153, 153, 187);
                        doc.text('NEOS DIGITAL — ' + section.toUpperCase(), M, 21);
                        doc.text(periodLabel, W - M, 21, { align: 'right' });
                        doc.setFontSize(7.5); doc.setTextColor(100, 100, 130);
                        doc.text('Pág. ' + pageNum, W / 2, H - 15, { align: 'center' });
                    };

                    const newPage = (section) => {
                        doc.addPage(); pageNum++; y = 48;
                        addPageHeader(section);
                    };

                    const checkY = (need, section) => { if (y + need > H - 40) newPage(section); };

                    const sectionHeader = (title, section) => {
                        checkY(36, section || title);
                        doc.setFillColor(26, 26, 46);
                        doc.rect(M, y, CW, 26, 'F');
                        doc.setFillColor(230, 51, 85);
                        doc.rect(M, y, 4, 26, 'F');
                        doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(255, 255, 255);
                        doc.text(title.toUpperCase(), M + 12, y + 17);
                        y += 34;
                    };

                    const metricCards = (items, colCount) => {
                        const colW = (CW - (colCount - 1) * 8) / colCount;
                        let ci = 0;
                        items.forEach((m, i) => {
                            if (i > 0 && i % colCount === 0) { ci = 0; y += 56; }
                            const mx = M + ci * (colW + 8);
                            const [r, g, b] = hexToRgb(m.color);
                            doc.setFillColor(248, 249, 255); doc.roundedRect(mx, y, colW, 46, 4, 4, 'F');
                            doc.setFillColor(r, g, b); doc.rect(mx, y, 3, 46, 'F');
                            doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(136, 136, 136);
                            doc.text(m.label, mx + 9, y + 14);
                            doc.setFont('helvetica', 'bold');
                            const valStr = String(m.value);
                            doc.setFontSize(valStr.length > 10 ? 10 : valStr.length > 6 ? 13 : 18);
                            doc.setTextColor(r, g, b);
                            doc.text(valStr, mx + 9, y + 36);
                            ci++;
                        });
                        y += 56;
                    };

                    const drawTable = (headers, rows, widths, section) => {
                        checkY(22, section);
                        let x = M;
                        doc.setFillColor(26, 26, 46); doc.rect(M, y, CW, 17, 'F');
                        doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(255, 255, 255);
                        headers.forEach((h, i) => { doc.text(h, x + 4, y + 11); x += widths[i]; });
                        y += 17;
                        rows.slice(0, 60).forEach((row, ri) => {
                            checkY(14, section);
                            x = M;
                            doc.setFillColor(ri % 2 === 0 ? 250 : 255, ri % 2 === 0 ? 250 : 255, ri % 2 === 0 ? 252 : 255);
                            doc.rect(M, y, CW, 14, 'F');
                            doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(51, 51, 51);
                            row.forEach((cell, ci) => {
                                const s = String(cell == null ? '—' : cell).slice(0, Math.floor(widths[ci] / 5.5));
                                doc.text(s, x + 4, y + 9.5); x += widths[ci];
                            });
                            y += 14;
                        });
                        if (rows.length > 60) {
                            doc.setFontSize(7.5); doc.setTextColor(153, 153, 153);
                            doc.text(`... e mais ${rows.length - 60} registros`, M + 4, y + 9);
                            y += 13;
                        }
                        y += 10;
                    };

                    const hexToRgb = (hex) => {
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        return [r, g, b];
                    };

                    const fmtBRL = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    /* ── Data preparation ── */
                    const { clients, tasks, financials, costs, leads, designReqs } = store;

                    const inRange = (dateStr) => {
                        if (exportAll) return true;
                        if (!dateStr) return false;
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return false;
                        const from = new Date(fromYear, fromMonth - 1, 1);
                        const to = new Date(toYear, toMonth, 0, 23, 59, 59);
                        return d >= from && d <= to;
                    };

                    const filtFin = (financials || []).filter(f => inRange(f.date));
                    const filtCosts = (costs || []).filter(c => inRange(c.date));
                    const filtLeads = (leads || []).filter(l => inRange(l.createdAt));
                    const filtTasks = exportAll ? tasks : tasks.filter(t => inRange(t.createdAt) || !t.createdAt);
                    const filtDesign = exportAll ? (designReqs || []) : (designReqs || []).filter(r => inRange(r.createdAt) || !r.createdAt);

                    const revenue  = filtFin.filter(f => f.status === 'Pago').reduce((s, f) => s + (f.amount || 0), 0);
                    const pendingR = filtFin.filter(f => f.status === 'Pendente').reduce((s, f) => s + (f.amount || 0), 0);
                    const overdueR = filtFin.filter(f => f.status === 'Atrasado').reduce((s, f) => s + (f.amount || 0), 0);
                    const totalExp = filtCosts.reduce((s, c) => s + (parseFloat(c.amount) || 0), 0);
                    const netProfit = revenue - totalExp;

                    const activeC = clients.filter(c => c.status === 'Ativo');
                    const avgTicket = activeC.length > 0 ? activeC.reduce((s, c) => s + (parseFloat(c.plan) || 0), 0) / activeC.length : 0;
                    const doneTasks = filtTasks.filter(t => t.status === 'Concluído');
                    const lateTasks = filtTasks.filter(t => t.dueDate && isOverdue(t.dueDate) && t.status !== 'Concluído');
                    const periodLabel = exportAll ? 'Histórico Completo' : `${_MONTHS_PT[fromMonth-1]}/${fromYear} → ${_MONTHS_PT[toMonth-1]}/${toYear}`;

                    // Revenue by client
                    const revByClient = {};
                    filtFin.filter(f => f.status === 'Pago').forEach(f => { const n = f.clientName || 'Sem cliente'; revByClient[n] = (revByClient[n] || 0) + (f.amount || 0); });

                    // Revenue by month
                    const revByMonth = {};
                    filtFin.filter(f => f.status === 'Pago' && f.date).forEach(f => {
                        const d = new Date(f.date); if (isNaN(d)) return;
                        const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                        revByMonth[k] = (revByMonth[k] || 0) + (f.amount || 0);
                    });

                    /* ── PAGE 1: Cover ── */
                    setProgress('Gerando capa...');
                    doc.setFillColor(13, 12, 37); doc.rect(0, 0, W, H, 'F');
                    doc.setFillColor(230, 51, 85); doc.rect(0, 0, W, 5, 'F');
                    doc.setFillColor(230, 51, 85); doc.rect(0, H - 5, W, 5, 'F');

                    // Try logo
                    try {
                        const img = new Image(); img.src = 'images/LOGOTIPO 2 copiar 2.png';
                        await new Promise(r => { img.onload = r; img.onerror = r; setTimeout(r, 2000); });
                        if (img.naturalWidth > 0) {
                            const ratio = Math.min(200 / img.naturalWidth, 80 / img.naturalHeight);
                            const lW = img.naturalWidth * ratio, lH = img.naturalHeight * ratio;
                            const lc = document.createElement('canvas'); lc.width = img.naturalWidth; lc.height = img.naturalHeight;
                            lc.getContext('2d').drawImage(img, 0, 0);
                            doc.addImage(lc.toDataURL('image/png'), 'PNG', (W - lW) / 2, 110, lW, lH);
                        }
                    } catch {}

                    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(102, 102, 170);
                    doc.text('NEOS DIGITAL', W / 2, 100, { align: 'center' });
                    doc.setFontSize(34); doc.setTextColor(255, 255, 255);
                    doc.text('Relatório Gerencial', W / 2, 265, { align: 'center' });
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(153, 153, 187);
                    doc.text(periodLabel, W / 2, 295, { align: 'center' });
                    doc.setDrawColor(230, 51, 85); doc.setLineWidth(1.5);
                    doc.line(W / 2 - 70, 312, W / 2 + 70, 312);
                    doc.setFontSize(9.5); doc.setTextColor(102, 102, 153);
                    doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`, W / 2, 330, { align: 'center' });

                    // Summary box
                    doc.setFillColor(22, 22, 50); doc.roundedRect(M + 40, 370, CW - 80, 120, 8, 8, 'F');
                    doc.setDrawColor(230, 51, 85); doc.setLineWidth(0.8); doc.roundedRect(M + 40, 370, CW - 80, 120, 8, 8, 'D');
                    const summaryItems = [
                        ['Clientes Ativos', activeC.length, '#00c864'],
                        ['Total de Tarefas', filtTasks.length, '#4090ff'],
                        ['Receita do Período', fmtBRL(revenue), '#e63355'],
                        ['Leads', filtLeads.length, '#a060ff'],
                    ];
                    const sumColW = (CW - 80) / 4;
                    summaryItems.forEach((s, i) => {
                        const sx = M + 40 + i * sumColW + 12;
                        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(102, 102, 153);
                        doc.text(s[0], sx, 397);
                        doc.setFont('helvetica', 'bold');
                        const [r, g, b] = hexToRgb(s[2]);
                        doc.setTextColor(r, g, b);
                        doc.setFontSize(String(s[1]).length > 8 ? 11 : 16);
                        doc.text(String(s[1]), sx, 433);
                    });

                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(68, 68, 102);
                    doc.text('Relatório gerado automaticamente pelo sistema Neos Dashboard — Confidencial', W / 2, H - 28, { align: 'center' });

                    /* ── PAGE 2: Executive Summary ── */
                    setProgress('Resumo executivo...');
                    doc.addPage(); pageNum = 2; y = 48;
                    addPageHeader('Resumo Executivo');

                    sectionHeader('Clientes', 'Resumo Executivo');
                    metricCards([
                        { label: 'Total de Clientes', value: clients.length, color: '#4090ff' },
                        { label: 'Ativos', value: activeC.length, color: '#00c864' },
                        { label: 'Pausados', value: clients.filter(c => c.status === 'Pausado').length, color: '#ffcc00' },
                        { label: 'Encerrados', value: clients.filter(c => c.status === 'Encerrado').length, color: '#ff6060' },
                    ], 4);

                    checkY(100, 'Resumo Executivo');
                    sectionHeader('Tarefas', 'Resumo Executivo');
                    metricCards([
                        { label: 'Total de Tarefas', value: filtTasks.length, color: '#a060ff' },
                        { label: 'Concluídas', value: doneTasks.length, color: '#00c864' },
                        { label: 'Em Andamento', value: filtTasks.filter(t => t.status === 'Em Andamento').length, color: '#4090ff' },
                        { label: 'Atrasadas', value: lateTasks.length, color: '#ff6060' },
                    ], 4);

                    checkY(100, 'Resumo Executivo');
                    sectionHeader('Financeiro — ' + periodLabel, 'Resumo Executivo');
                    metricCards([
                        { label: 'Receita (Pago)', value: fmtBRL(revenue), color: '#00c864' },
                        { label: 'Pendente', value: fmtBRL(pendingR), color: '#ffcc00' },
                        { label: 'Despesas', value: fmtBRL(totalExp), color: '#ff8030' },
                        { label: 'Lucro Líquido', value: fmtBRL(netProfit), color: netProfit >= 0 ? '#00c864' : '#ff4060' },
                        { label: 'Ticket Médio', value: fmtBRL(avgTicket), color: '#a060ff' },
                        { label: 'Em Atraso', value: fmtBRL(overdueR), color: '#ff6060' },
                    ], 3);

                    /* ── PAGE 3: Financial ── */
                    setProgress('Seção financeira...');
                    doc.addPage(); pageNum++; y = 48;
                    addPageHeader('Financeiro');

                    sectionHeader('Receita por Cliente', 'Financeiro');
                    const revClientRows = Object.entries(revByClient).sort((a, b) => b[1] - a[1]).map(([n, v]) => [n.slice(0, 36), fmtBRL(v)]);
                    if (revClientRows.length > 0) drawTable(['Empresa / Projeto', 'Receita'], revClientRows, [CW * 0.65, CW * 0.35], 'Financeiro');
                    else { doc.setFontSize(8.5); doc.setTextColor(153, 153, 153); doc.text('Nenhum registro de receita no período.', M, y); y += 18; }

                    checkY(60, 'Financeiro');
                    sectionHeader('Receita Mensal', 'Financeiro');
                    const monthRows = Object.entries(revByMonth).sort().map(([k, v]) => {
                        const [yr, mn] = k.split('-');
                        return [`${_MONTHS_SHORT[parseInt(mn)-1]}/${yr}`, fmtBRL(v)];
                    });
                    if (monthRows.length > 0) drawTable(['Mês', 'Receita (Pago)'], monthRows, [CW * 0.5, CW * 0.5], 'Financeiro');
                    else { doc.setFontSize(8.5); doc.setTextColor(153, 153, 153); doc.text('Nenhuma receita mensal no período.', M, y); y += 18; }

                    checkY(60, 'Financeiro');
                    sectionHeader('Despesas por Categoria', 'Financeiro');
                    const expByCategory = {};
                    filtCosts.forEach(c => { const cat = c.category || 'Outros'; expByCategory[cat] = (expByCategory[cat] || 0) + (parseFloat(c.amount) || 0); });
                    const expRows = Object.entries(expByCategory).sort((a, b) => b[1] - a[1]).map(([cat, v]) => [cat, fmtBRL(v)]);
                    if (expRows.length > 0) drawTable(['Categoria', 'Total'], expRows, [CW * 0.6, CW * 0.4], 'Financeiro');
                    else { doc.setFontSize(8.5); doc.setTextColor(153, 153, 153); doc.text('Nenhuma despesa no período.', M, y); y += 18; }

                    checkY(70, 'Financeiro');
                    sectionHeader('Resultado', 'Financeiro');
                    const [gr, gg, gb] = hexToRgb(netProfit >= 0 ? '#00c864' : '#ff4060');
                    doc.setFillColor(netProfit >= 0 ? 240 : 255, netProfit >= 0 ? 255 : 240, netProfit >= 0 ? 248 : 248);
                    doc.roundedRect(M, y, CW, 52, 6, 6, 'F');
                    doc.setDrawColor(gr, gg, gb); doc.setLineWidth(0.6); doc.roundedRect(M, y, CW, 52, 6, 6, 'D');
                    [[fmtBRL(revenue),'Receita Total','#00c864'],[fmtBRL(totalExp),'Despesas Totais','#ff8030'],[fmtBRL(netProfit),'Lucro Líquido', netProfit >= 0 ? '#00c864' : '#ff4060']].forEach((r, i) => {
                        const rx = M + i * (CW / 3) + 12;
                        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(102, 102, 102);
                        doc.text(r[1], rx, y + 17);
                        const [rr, rg, rb] = hexToRgb(r[2]);
                        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(rr, rg, rb);
                        doc.text(r[0], rx, y + 38);
                    });
                    if (revenue > 0) {
                        const margin = ((netProfit / revenue) * 100).toFixed(1);
                        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(102, 102, 102);
                        doc.text(`Margem de lucro: ${margin}%`, W - M - 8, y + 38, { align: 'right' });
                    }
                    y += 66;

                    /* ── PAGE 4: Clients ── */
                    setProgress('Seção de clientes...');
                    doc.addPage(); pageNum++; y = 48;
                    addPageHeader('Clientes');

                    sectionHeader(`Clientes — Total: ${clients.length}`, 'Clientes');
                    metricCards([
                        { label: 'Ativos', value: activeC.length, color: '#00c864' },
                        { label: 'Pausados', value: clients.filter(c => c.status === 'Pausado').length, color: '#ffcc00' },
                        { label: 'Encerrados', value: clients.filter(c => c.status === 'Encerrado').length, color: '#ff6060' },
                    ], 3);

                    checkY(40, 'Clientes');
                    const clientTableRows = clients.map(c => [
                        (c.name || '—').slice(0, 28),
                        (c.service || '—').slice(0, 20),
                        c.status || '—',
                        c.createdAt ? new Date(c.createdAt).toLocaleDateString('pt-BR') : '—',
                    ]);
                    drawTable(['Empresa', 'Serviço', 'Status', 'Entrada'], clientTableRows, [CW*.40, CW*.30, CW*.17, CW*.13], 'Clientes');

                    /* ── PAGE 5: Tasks ── */
                    setProgress('Seção de tarefas...');
                    doc.addPage(); pageNum++; y = 48;
                    addPageHeader('Tarefas');

                    sectionHeader(`Tarefas — Total: ${filtTasks.length}`, 'Tarefas');
                    metricCards([
                        { label: 'Concluídas', value: doneTasks.length, color: '#00c864' },
                        { label: 'Em Andamento', value: filtTasks.filter(t => t.status === 'Em Andamento').length, color: '#4090ff' },
                        { label: 'A Fazer', value: filtTasks.filter(t => t.status === 'A Fazer').length, color: '#7878c8' },
                        { label: 'Atrasadas', value: lateTasks.length, color: '#ff6060' },
                    ], 4);

                    checkY(20, 'Tarefas');
                    const compRate = filtTasks.length > 0 ? ((doneTasks.length / filtTasks.length) * 100).toFixed(1) : '0';
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(102, 102, 102);
                    doc.text(`Taxa de conclusão: ${compRate}%`, M, y); y += 16;

                    const taskTableRows = filtTasks.map(t => [
                        (t.title || '—').slice(0, 30),
                        (t.assignee || '—').split(' ')[0],
                        (t.status || '—').slice(0, 14),
                        t.dueDate || '—',
                    ]);
                    drawTable(['Tarefa', 'Responsável', 'Status', 'Prazo'], taskTableRows, [CW*.41, CW*.21, CW*.22, CW*.16], 'Tarefas');

                    if (filtDesign.length > 0) {
                        checkY(50, 'Tarefas');
                        sectionHeader(`Solicitações de Design — Total: ${filtDesign.length}`, 'Tarefas');
                        const dsRows = filtDesign.map(r => [(r.title||'—').slice(0,30),(r.clientName||'—').slice(0,22),r.status||'—',r.dueDate||'—']);
                        drawTable(['Título','Cliente','Status','Prazo'], dsRows, [CW*.40,CW*.30,CW*.17,CW*.13], 'Tarefas');
                    }

                    /* ── PAGE 6: Team & Productivity ── */
                    setProgress('Equipe e produtividade...');
                    doc.addPage(); pageNum++; y = 48;
                    addPageHeader('Equipe & Produtividade');

                    sectionHeader('Equipe', 'Equipe & Produtividade');
                    const teamTableRows = TEAM.map(name => {
                        const mt = filtTasks.filter(t => t.assignee === name);
                        const md = mt.filter(t => t.status === 'Concluído').length;
                        const ml = filtLeads.filter(l => l.responsible === name).length;
                        return [name, String(mt.length), String(md), String(ml)];
                    });
                    drawTable(['Colaborador','Tarefas Vinculadas','Concluídas','Leads'], teamTableRows, [CW*.40,CW*.22,CW*.20,CW*.18], 'Equipe');

                    checkY(60, 'Equipe & Produtividade');
                    sectionHeader('Distribuição de Tarefas por Status', 'Equipe & Produtividade');
                    const kanbanRows = COLS.map(s => {
                        const cnt = filtTasks.filter(t => t.status === s).length;
                        const pct = filtTasks.length > 0 ? ((cnt / filtTasks.length) * 100).toFixed(1) : '0';
                        return [s, String(cnt), pct + '%'];
                    });
                    drawTable(['Status Kanban','Quantidade','Percentual'], kanbanRows, [CW*.50,CW*.25,CW*.25], 'Equipe');

                    const timers = (store.taskTimers || []).filter(t => t.endedAt && t.totalMs > 0);
                    if (timers.length > 0) {
                        const fmtMs = ms => { const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000); return h > 0 ? `${h}h ${m}m` : `${m}m`; };
                        checkY(60, 'Equipe & Produtividade');
                        sectionHeader('Registros de Tempo (Timer)', 'Equipe & Produtividade');
                        const avgMs = timers.reduce((s, t) => s + (t.totalMs || 0), 0) / timers.length;
                        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(102,102,102);
                        doc.text(`${timers.length} sessões registradas · Tempo médio: ${fmtMs(avgMs)}`, M, y); y += 14;
                        const byUser = {};
                        timers.forEach(t => { if (!byUser[t.userName]) byUser[t.userName] = { c: 0, total: 0 }; byUser[t.userName].c++; byUser[t.userName].total += t.totalMs || 0; });
                        const timerRows = Object.entries(byUser).sort((a,b) => b[1].total - a[1].total).map(([n, d]) => [n, String(d.c), fmtMs(d.total), fmtMs(d.total/d.c)]);
                        drawTable(['Colaborador','Sessões','Tempo Total','Média/Sessão'], timerRows, [CW*.36,CW*.18,CW*.26,CW*.20], 'Equipe');
                    }

                    /* ── PAGE 7: Marketing / Leads (only if data exists) ── */
                    if (filtLeads.length > 0) {
                        setProgress('Marketing e leads...');
                        doc.addPage(); pageNum++; y = 48;
                        addPageHeader('Marketing & Leads');

                        const wonLeads = filtLeads.filter(l => l.status === 'Fechado Ganho');
                        const convRate = filtLeads.length > 0 ? ((wonLeads.length / filtLeads.length) * 100).toFixed(1) : '0';

                        sectionHeader(`Marketing & Leads — Total: ${filtLeads.length}`, 'Marketing');
                        metricCards([
                            { label: 'Total de Leads', value: filtLeads.length, color: '#4090ff' },
                            { label: 'Fechados (Ganho)', value: wonLeads.length, color: '#00c864' },
                            { label: 'Perdidos', value: filtLeads.filter(l => l.status === 'Perdido').length, color: '#ff6060' },
                            { label: 'Taxa de Conversão', value: convRate + '%', color: '#a060ff' },
                        ], 4);

                        checkY(50, 'Marketing');
                        sectionHeader('Funil de Leads por Etapa', 'Marketing');
                        const LEAD_STAGES = ['Novos Leads','Contato Inicial','Qualificação','Proposta Enviada','Follow-up','Em Negociação','Fechado Ganho','Perdido'];
                        const leadStageRows = LEAD_STAGES.map(s => {
                            const cnt = filtLeads.filter(l => l.status === s).length;
                            return [s, String(cnt), filtLeads.length > 0 ? ((cnt/filtLeads.length)*100).toFixed(1)+'%' : '0%'];
                        });
                        drawTable(['Etapa do Funil', 'Leads', '% do Total'], leadStageRows, [CW*.55, CW*.22, CW*.23], 'Marketing');

                        const totalVal = filtLeads.reduce((s, l) => s + (parseFloat(l.value) || 0), 0);
                        if (totalVal > 0) {
                            checkY(20, 'Marketing');
                            doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(102,102,102);
                            doc.text(`Valor total do pipeline: ${fmtBRL(totalVal)} · Valor ganho: ${fmtBRL(wonLeads.reduce((s,l) => s+(parseFloat(l.value)||0),0))}`, M, y); y += 16;
                        }
                    }

                    /* ── PAGE 8: Insights & Footer ── */
                    setProgress('Gerando insights...');
                    doc.addPage(); pageNum++; y = 48;
                    addPageHeader('Insights & Conclusão');

                    sectionHeader('Observações e Insights Automáticos', 'Insights');

                    const insights = [];
                    if (activeC.length > 0) insights.push(`A agência mantém ${activeC.length} cliente${activeC.length > 1 ? 's' : ''} ativo${activeC.length > 1 ? 's' : ''} no momento.`);
                    if (avgTicket > 0) insights.push(`O ticket médio atual é ${fmtBRL(avgTicket)} por cliente ativo.`);
                    if (revenue > 0 && totalExp > 0) {
                        const m = ((netProfit / revenue) * 100).toFixed(1);
                        insights.push(netProfit > 0 ? `Margem de lucro de ${m}% no período — lucro líquido de ${fmtBRL(netProfit)}.` : `Atenção: resultado negativo no período. Lucro líquido: ${fmtBRL(netProfit)}.`);
                    } else if (revenue > 0) insights.push(`Receita de ${fmtBRL(revenue)} registrada no período.`);

                    const topRevClient = Object.entries(revByClient).sort((a,b) => b[1]-a[1])[0];
                    if (topRevClient) insights.push(`Maior receita por cliente: "${topRevClient[0]}" com ${fmtBRL(topRevClient[1])}.`);

                    if (filtTasks.length > 0) {
                        const cp = ((doneTasks.length / filtTasks.length) * 100).toFixed(0);
                        if (parseInt(cp) >= 70) insights.push(`Alta taxa de conclusão de tarefas: ${cp}%. Ótimo desempenho operacional.`);
                        else if (parseInt(cp) >= 40) insights.push(`Taxa de conclusão de tarefas em ${cp}%. Há espaço para melhoria.`);
                        else insights.push(`Taxa de conclusão de tarefas baixa: ${cp}%. Atenção ao backlog.`);
                    }
                    if (lateTasks.length > 0) insights.push(`Gargalo: ${lateTasks.length} tarefa${lateTasks.length > 1 ? 's' : ''} atrasada${lateTasks.length > 1 ? 's' : ''} aguardando resolução.`);

                    if (filtLeads.length > 0) {
                        const cr = ((filtLeads.filter(l => l.status === 'Fechado Ganho').length / filtLeads.length) * 100).toFixed(1);
                        insights.push(`Taxa de conversão de leads: ${cr}%${parseFloat(cr) >= 30 ? ' — acima da média do mercado.' : '.'}`);
                    }

                    const topTeam = TEAM.map(n => ({ n, done: filtTasks.filter(t => t.assignee === n && t.status === 'Concluído').length })).sort((a,b) => b.done - a.done)[0];
                    if (topTeam && topTeam.done > 0) insights.push(`Colaborador mais produtivo: ${topTeam.n} com ${topTeam.done} tarefa${topTeam.done > 1 ? 's' : ''} concluída${topTeam.done > 1 ? 's' : ''}.`);

                    const topMonthEntry = Object.entries(revByMonth).sort((a,b) => b[1]-a[1])[0];
                    if (topMonthEntry) {
                        const [k, v] = topMonthEntry;
                        const [yr, mn] = k.split('-');
                        insights.push(`Melhor mês de faturamento: ${_MONTHS_SHORT[parseInt(mn)-1]}/${yr} com ${fmtBRL(v)}.`);
                    }

                    if (insights.length === 0) insights.push('Nenhum dado suficiente para gerar insights. Adicione clientes, tarefas e registros financeiros.');

                    insights.forEach(ins => {
                        checkY(28, 'Insights');
                        const [rr, rg, rb] = hexToRgb('#e63355');
                        doc.setFillColor(rr, rg, rb); doc.circle(M + 4, y - 2.5, 2.5, 'F');
                        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(26, 26, 46);
                        const lines = doc.splitTextToSize(ins, CW - 18);
                        doc.text(lines, M + 14, y);
                        y += lines.length * 13 + 9;
                    });

                    // Footer block
                    const footY = Math.max(y + 30, H - 100);
                    doc.setFillColor(13, 12, 37); doc.rect(0, footY, W, H - footY, 'F');
                    doc.setFillColor(230, 51, 85); doc.rect(0, footY, W, 2, 'F');
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(153, 153, 187);
                    doc.text('Relatório gerado automaticamente pelo sistema Neos Dashboard.', W / 2, footY + 22, { align: 'center' });
                    doc.text('Este documento não substitui análises contábeis ou fiscais profissionais.', W / 2, footY + 35, { align: 'center' });
                    doc.setFontSize(7.5); doc.setTextColor(102, 102, 136);
                    doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, W / 2, footY + 50, { align: 'center' });
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(230, 51, 85);
                    doc.text('NEOS DIGITAL', W / 2, footY + 70, { align: 'center' });

                    setProgress('Salvando PDF...');
                    await new Promise(r => setTimeout(r, 80));
                    doc.save(`Relatorio_Agencia_${new Date().toISOString().slice(0, 10)}.pdf`);
                    onClose();
                } catch (err) {
                    console.error('[Neos] Erro ao gerar PDF:', err);
                    alert('Erro ao gerar PDF: ' + err.message);
                } finally {
                    setGenerating(false);
                    setProgress('');
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-box" style={{ width: 500, maxHeight: '90vh', overflowY: 'auto' }} onClick={e => e.stopPropagation()}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18 }}>
                            <div>
                                <h3 style={{ fontSize: 17, fontWeight: 700 }}>📄 Exportar Relatório</h3>
                                <p style={{ fontSize: 11.5, color: 'rgba(255,255,255,.38)', marginTop: 3 }}>Relatório gerencial completo da agência em PDF</p>
                            </div>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.4)', cursor: 'pointer', fontSize: 20, lineHeight: 1 }}>✕</button>
                        </div>

                        {/* Export all */}
                        <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 9, padding: '11px 14px', marginBottom: 12, border: '1px solid rgba(255,255,255,.08)', cursor: 'pointer' }} onClick={() => setExportAll(v => !v)}>
                            <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
                                <input type="checkbox" checked={exportAll} readOnly style={{ width: 16, height: 16, accentColor: '#ff0040', cursor: 'pointer', flexShrink: 0 }} />
                                <div>
                                    <div style={{ fontSize: 13, fontWeight: 600 }}>Exportar histórico completo</div>
                                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,.35)', marginTop: 1 }}>Ignora filtros de data e inclui todos os registros do sistema</div>
                                </div>
                            </label>
                        </div>

                        {/* Period selection */}
                        {!exportAll && (
                            <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 9, padding: '14px', border: '1px solid rgba(255,255,255,.08)', marginBottom: 14 }}>
                                <div style={{ fontSize: 10.5, fontWeight: 700, color: 'rgba(255,255,255,.38)', marginBottom: 12, textTransform: 'uppercase', letterSpacing: .6 }}>Intervalo de Período</div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                                    {[['Mês / Ano Inicial', fromMonth, fromYear, setFromMonth, setFromYear], ['Mês / Ano Final', toMonth, toYear, setToMonth, setToYear]].map(([lbl, mo, yr, setMo, setYr]) => (
                                        <div key={lbl}>
                                            <label style={{ fontSize: 11, color: 'rgba(255,255,255,.45)', display: 'block', marginBottom: 6 }}>{lbl}</label>
                                            <div style={{ display: 'flex', gap: 6 }}>
                                                <select value={mo} onChange={e => setMo(+e.target.value)} style={{ flex: 1, padding: '7px 6px', borderRadius: 7, background: 'rgba(255,255,255,.06)', border: '1px solid rgba(255,255,255,.12)', color: '#fff', fontSize: 11.5 }}>
                                                    {_MONTHS_PT.map((m, i) => <option key={i} value={i+1}>{m}</option>)}
                                                </select>
                                                <select value={yr} onChange={e => setYr(+e.target.value)} style={{ width: 74, padding: '7px 5px', borderRadius: 7, background: 'rgba(255,255,255,.06)', border: '1px solid rgba(255,255,255,.12)', color: '#fff', fontSize: 11.5 }}>
                                                    {[2023,2024,2025,2026,2027].map(y => <option key={y} value={y}>{y}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div style={{ marginTop: 10, padding: '7px 10px', background: 'rgba(255,255,255,.03)', borderRadius: 6, fontSize: 11, color: 'rgba(255,255,255,.38)' }}>
                                    Período selecionado: <strong style={{ color: 'rgba(255,255,255,.7)' }}>{_MONTHS_PT[fromMonth-1]}/{fromYear} → {_MONTHS_PT[toMonth-1]}/{toYear}</strong>
                                </div>
                            </div>
                        )}

                        {/* Sections preview */}
                        <div style={{ background: 'rgba(255,255,255,.03)', borderRadius: 8, padding: '10px 14px', marginBottom: 18, border: '1px solid rgba(255,255,255,.06)' }}>
                            <div style={{ fontSize: 10.5, fontWeight: 700, color: 'rgba(255,255,255,.38)', marginBottom: 8, textTransform: 'uppercase', letterSpacing: .5 }}>Seções do relatório</div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 3 }}>
                                {['📋 Capa','📊 Resumo Executivo','💰 Financeiro','👥 Clientes','✅ Tarefas & Projetos','👤 Equipe & Produtividade','📣 Marketing & Leads','💡 Insights Automáticos'].map(s => (
                                    <div key={s} style={{ fontSize: 11, color: 'rgba(255,255,255,.5)', padding: '2px 0' }}>{s}</div>
                                ))}
                            </div>
                        </div>

                        <div style={{ fontSize: 10.5, color: 'rgba(255,150,150,.6)', background: 'rgba(255,0,0,.04)', border: '1px solid rgba(255,0,0,.12)', borderRadius: 7, padding: '8px 12px', marginBottom: 16 }}>
                            🔒 Dados sensíveis protegidos: telefones, e-mails, CPF, CNPJ e tokens são excluídos automaticamente.
                        </div>

                        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                            <button onClick={onClose} className="btn-secondary" disabled={generating} style={{ opacity: generating ? .5 : 1 }}>Cancelar</button>
                            <button onClick={generate} disabled={generating}
                                style={{ padding: '10px 22px', borderRadius: 8, background: generating ? 'rgba(255,0,64,.06)' : 'rgba(255,0,64,.18)', border: '1px solid rgba(255,0,64,.4)', color: generating ? 'rgba(255,255,255,.3)' : '#ff4060', fontWeight: 700, fontSize: 13, cursor: generating ? 'default' : 'pointer', display: 'flex', alignItems: 'center', gap: 8, minWidth: 160, justifyContent: 'center', transition: 'all .2s' }}>
                                {generating ? (
                                    <><span style={{ display: 'inline-block', width: 13, height: 13, border: '2px solid rgba(255,64,96,.25)', borderTopColor: '#ff4060', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />{progress || 'Gerando...'}</>
                                ) : '📄 Gerar PDF'}
                            </button>
                        </div>

        function Dashboard() {

                return () => { if (revChart.current) revChart.current.destroy(); };

                                            </span>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>

                        {/* RANKING PÓDIO */}
                        <div className="glass" style={{ padding: 22 }}>

                        const byUser = {}; done.forEach(t => { if (!byUser[t.userName]) byUser[t.userName] = { count: 0, total: 0 }; byUser[t.userName].count++; byUser[t.userName].total += t.totalMs || 0; });
                        const byStage = {}; done.forEach(t => { if (!byStage[t.stage]) byStage[t.stage] = { count: 0, total: 0 }; byStage[t.stage].count++; byStage[t.stage].total += t.totalMs || 0; });
                        const avgMs = done.reduce((s, t) => s + (t.totalMs || 0), 0) / done.length;

                                    <div className="glass" style={{ padding: '10px 14px', borderRadius: 8 }}>
                                        <div style={{ fontSize: 10, color: 'rgba(255,255,255,.4)', fontWeight: 700, textTransform: 'uppercase', marginBottom: 8 }}>Por Etapa</div>
                                        {Object.entries(byStage).sort((a, b) => b[1].total - a[1].total).slice(0, 6).map(([stage, d]) => (
                                            <div key={stage} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 5 }}>
                                                <span style={{ fontSize: 11, color: 'rgba(255,255,255,.7)' }}>{stage || '—'}</span>
