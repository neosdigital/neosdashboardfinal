        /* ── TIMER DE PRODUÇÃO POR TAREFA ───────────────────── */
        function TaskTimerBtn({ taskId, taskTitle, taskStatus }) {
            const { store, startTimer, stopTimer } = useApp();
            const me = JSON.parse(sessionStorage.getItem('neos_auth') || 'null');
            const myId = me?.username || '';
            const activeTimer = (store.taskTimers || []).find(t => t.taskId === taskId && t.userId === myId && !t.endedAt);
            const [tick, setTick] = useState(0);
            useEffect(() => {
                if (!activeTimer) { setTick(0); return; }
                const iv = setInterval(() => setTick(p => p + 1), 1000);
                return () => clearInterval(iv);
            }, [activeTimer?.id]);
            const elapsed = activeTimer ? Math.round((Date.now() - new Date(activeTimer.startedAt)) / 1000) : 0;
            const fmtT = s => `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
            if (!myId) return null;
            if (activeTimer) return (
                <>
                    <button onClick={e => { e.stopPropagation(); stopTimer(activeTimer.id, activeTimer.startedAt); }} style={{ padding: '3px 7px', fontSize: 9.5, background: 'rgba(255,60,60,.18)', border: '1px solid rgba(255,60,60,.4)', borderRadius: 5, color: '#ff6060', cursor: 'pointer', fontWeight: 700, lineHeight: 1 }}>■</button>
                    <span style={{ fontSize: 10, fontWeight: 700, color: '#ff8030', fontFamily: 'monospace' }}>{fmtT(elapsed)}</span>
                </>
            );
            return (
                <button onClick={e => { e.stopPropagation(); startTimer({ taskId, taskTitle, userId: myId, userName: me?.name || myId, stage: taskStatus }); }} style={{ padding: '3px 7px', fontSize: 9.5, background: 'rgba(100,200,100,.12)', border: '1px solid rgba(100,200,100,.3)', borderRadius: 5, color: 'rgba(100,220,100,.85)', cursor: 'pointer', fontWeight: 700, lineHeight: 1 }}>▶</button>
            );
        }

        /* ── APP ────────────────────────────────────────────── */
        function App() {
            const { view, userRole, onlineUsers, chatOpen, setChatOpen } = useApp();
            const [quickAdd, setQuickAdd] = useState(false);
            const isEmployee = userRole !== 'admin';
            const ViewMap = { dashboard: Dashboard, leads: LeadsPage, goals: GoalsPage, clients: Clients, kanban: Kanban, financial: Financial, traffic: Traffic, design: Design, performance: Performance, calendar: CalendarModule };
            const V = (isEmployee && EMPLOYEE_BLOCKED.includes(view)) ? LockedView : (ViewMap[view] || Dashboard);
            const visible = onlineUsers.filter(c => c.view === view);
            return (
                <div style={{ display: 'flex', minHeight: '100vh' }}>
                    <Sidebar />
                    <main style={{ marginLeft: 210, flex: 1, padding: '26px 30px', minHeight: '100vh' }}>
                        <V />
                    </main>
                    {!isEmployee && (
                        <button className="btn-primary pulse" title="Adicionar Cliente" onClick={() => setQuickAdd(true)}
                            style={{ position: 'fixed', bottom: 22, right: 22, zIndex: 200, borderRadius: 50, width: 50, height: 50, padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 30px rgba(255,0,64,.45)' }}>
                            <Ic n="plus" s={20} />
                        </button>
                    )}
                    <AlertMonitor />
                    <InboxBtn />
                    <button onClick={() => setChatOpen(c => !c)} title="Chat Interno"
                        style={{ position: 'fixed', bottom: isEmployee ? 22 : 82, right: 22, zIndex: 200, borderRadius: 50, width: 44, height: 44, padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: chatOpen ? '#ff0040' : 'rgba(255,255,255,.08)', border: '1px solid ' + (chatOpen ? '#ff0040' : 'rgba(255,255,255,.15)'), cursor: 'pointer', boxShadow: chatOpen ? '0 0 18px rgba(255,0,64,.4)' : 'none', transition: 'all .2s' }}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
                    </button>
                    <Chat />
                    {quickAdd && <ClientModal onClose={() => setQuickAdd(false)} />}
                    <Toast />
                    <NewLeadPopup />
                    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9990 }}>
                        {visible.map(c => (
                            <div key={c.k} style={{ position: 'absolute', left: `${c.x * 100}%`, top: `${c.y * 100}%`, transition: 'left 55ms linear, top 55ms linear', pointerEvents: 'none', transform: 'translate(-2px, -2px)' }}>
                                <svg width="18" height="22" viewBox="0 0 18 22" fill="none">
                                    <path d="M2 2L16 10L10 12L7 19L2 2Z" fill={c.color} stroke="#fff" strokeWidth="1.2" strokeLinejoin="round" />
                                </svg>
                                <div style={{ position: 'absolute', top: 18, left: 14, background: c.color, color: '#fff', fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 6, whiteSpace: 'nowrap', boxShadow: '0 2px 10px rgba(0,0,0,.45)' }}>
                                    {c.name}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(p) { super(p); this.state = { err: null }; }
            static getDerivedStateFromError(e) { return { err: e }; }
            componentDidCatch(e, i) { console.error('[Neos] Render error:', e, i); }
            render() {
                if (this.state.err) return (
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', background: '#07070f', gap: 14 }}>
                        <div style={{ width: 36, height: 36, border: '3px solid rgba(255,0,64,.4)', borderTopColor: '#ff0040', borderRadius: '50%' }} />
                        <span style={{ fontSize: 13, color: 'rgba(255,80,80,.85)', fontWeight: 600 }}>Erro ao carregar o dashboard</span>
                        <span style={{ fontSize: 11, color: 'rgba(255,255,255,.35)', maxWidth: 320, textAlign: 'center' }}>{this.state.err.message}</span>
                        <button onClick={() => window.location.reload()} style={{ marginTop: 4, padding: '8px 20px', background: 'rgba(255,0,64,.12)', border: '1px solid rgba(255,0,64,.3)', borderRadius: 8, color: 'rgba(255,80,80,.85)', fontSize: 12, cursor: 'pointer', fontWeight: 600 }}>Recarregar</button>
                    </div>
                );
                return this.props.children;
            }
        }

        function Root() {
            const [authed, setAuthed] = useState(() => {
                try { return JSON.parse(sessionStorage.getItem('neos_auth') || 'null'); }
                catch { return null; }
            });
            if (!authed) return <ErrorBoundary><LoginScreen onLogin={setAuthed} /></ErrorBoundary>;
            return <ErrorBoundary><AppProvider authed={authed}><App /></AppProvider></ErrorBoundary>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>

</html>
